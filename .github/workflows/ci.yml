name: CI

on:
  # automerge coordinator가 BEHIND PR의 base를 GITHUB_TOKEN으로 갱신하면 synchronize
  # 이벤트가 뜨지 않아 새 head에 required context(Data contracts)가 붙지 않는다.
  # 그 경로를 잇는 유일한 수단이 명시 dispatch다.
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    name: Data contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout pinned Mobile fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: AquilaXk/easysubway-mobile
          ref: d85742f14cbf97c526a6b94dd55bbf863e1d1346
          path: .external/mobile
          persist-credentials: false

      - name: Stage pinned Mobile fixture
        shell: bash
        run: |
          set -euo pipefail
          expected_revision="d85742f14cbf97c526a6b94dd55bbf863e1d1346"
          source=".external/mobile/apps/mobile"
          capital_gzip="${source}/assets/datapacks/capital.sqlite.gz"
          expected_sha256="f328fbedff014be18a0e8341e0bdbfe9b0dd774fa7e9ae7692aa869e831707b3"

          actual_revision="$(git -C .external/mobile rev-parse HEAD)"
          [[ "${actual_revision}" == "${expected_revision}" ]]
          [[ -d "${source}" && ! -L "${source}" ]]
          if find "${source}" -type l -print -quit | grep -q .; then
            echo "pinned Mobile fixture contains a symlink" >&2
            exit 1
          fi
          [[ -f "${capital_gzip}" && ! -L "${capital_gzip}" ]]
          actual_sha256="$(sha256sum "${capital_gzip}" | awk '{print $1}')"
          [[ "${actual_sha256}" == "${expected_sha256}" ]]
          test ! -e apps/mobile
          test ! -L apps/mobile

          if [[ -e apps || -L apps ]]; then
            [[ -d apps && ! -L apps ]]
          else
            mkdir apps
          fi
          mv "${source}" apps/mobile

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"

      - name: Backup tracked topology evidence
        shell: bash
        run: |
          set -euo pipefail
          source="tools/datapack/itx-cheongchun-topology-evidence.json"
          backup=".external/itx-cheongchun-topology-evidence.json"
          [[ -f "${source}" && ! -L "${source}" ]]
          [[ -d .external && ! -L .external ]]
          test ! -e "${backup}"
          test ! -L "${backup}"
          cp "${source}" "${backup}"
          [[ -f "${backup}" && ! -L "${backup}" ]]
          cmp -- "${source}" "${backup}"

      - name: Emit pinned Mobile station catalog artifact
        shell: bash
        run: |
          set -euo pipefail
          node tools/datapack/emit-station-catalog-from-bundled-pack.mjs \
            --input apps/mobile/assets/datapacks/capital.sqlite.gz \
            --output .external/mobile-station-catalog

      - name: Migrate pinned Mobile v18 pack to v19
        shell: bash
        run: |
          set -euo pipefail
          node tools/datapack/apply-itx-topology-to-bundled-pack.mjs \
            --migrate-current-v18 \
            --station-catalog-pack .external/mobile-station-catalog

      - name: Verify Data issue 108 bundled-pack regression
        shell: bash
        run: |
          set -euo pipefail
          node --test tools/datapack/readmit-bundled-pack-identity.test.mjs
          node --test --test-name-pattern='bundled 공식 OD quote|bundled 차량·출입문 힌트' tools/datapack/datapack-tools.test.mjs

      - name: Restore tracked topology evidence
        shell: bash
        run: |
          set -euo pipefail
          source="tools/datapack/itx-cheongchun-topology-evidence.json"
          backup=".external/itx-cheongchun-topology-evidence.json"
          [[ -f "${source}" && ! -L "${source}" ]]
          [[ -f "${backup}" && ! -L "${backup}" ]]
          cp "${backup}" "${source}"
          cmp -- "${backup}" "${source}"
          rm "${backup}"

      - name: Lint workflows
        shell: bash
        run: |
          set -euo pipefail
          # 워크플로를 실제 YAML 파서로 읽는 유일한 게이트다. run 블록의 block scalar가
          # 깨져 스크립트 일부가 YAML 구조로 새어 나가는 파손은 텍스트 기반 계약 테스트로는
          # 잡히지 않는다. 이미지는 다른 pin과 같은 규칙으로 digest 고정한다.
          docker run --rm -v "${GITHUB_WORKSPACE}:/repo:ro" -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

      - name: Verify standalone contracts
        run: >-
          node --test
          tools/ci/automerge-queue.test.mjs
          tools/datapack/stage-contracts.test.mjs
          tools/datapack/bundle-component-contract.test.mjs
          tools/datapack/artifact-component-manifest.test.mjs
          tools/datapack/server-route-bundle-build-contract.test.mjs
          tools/datapack/lib/server-route-bundle-final.test.mjs
          tools/datapack/sign-server-route-bundle.test.mjs
          tools/datapack/build-server-route-bundle-final.test.mjs
          tools/datapack/build-transfer-topology-admission.test.mjs
          tools/datapack/build-server-route-bundle-consumer-handoff.test.mjs
          tools/datapack/publish-object-storage.test.mjs
          tools/datapack/publish-server-route-bundle.test.mjs
          tools/datapack/artifact-component-table-layout.test.mjs
          tools/datapack/emit-artifact-components.test.mjs
          tools/datapack/emit-station-catalog-pack.test.mjs
          tools/datapack/check-timetable-snapshot-freshness.test.mjs
          tools/datapack/run-current-itx-collection.test.mjs
          tools/datapack/build-data-component-manifest.test.mjs
          tools/ci/require-workflow-artifact.test.mjs
          tools/release/validate-promotion-request.test.mjs
          tools/ci/datapack-release-workflow.test.mjs
          tools/ci/public-sensitivity-owner-receipt-caller.test.mjs
          tools/ci/mobile-fixture-staging-workflow.test.mjs
          tools/ci/itx-current-collection-workflow.test.mjs
          tools/datapack/lib/provider-call-integrity.test.mjs
          tools/datapack/source-candidate-endpoint-contract.test.mjs
          tools/datapack/collect-kric-source-candidate-evidence.test.mjs
          tools/datapack/collect-seoul-accessibility-evidence.test.mjs
          tools/datapack/collect-korail-itx-cheongchun-timetable.test.mjs
          tools/datapack/probe-korail-facility-workbook.test.mjs
          tools/datapack/build-nationwide-coverage-tally.test.mjs
          tools/datapack/contract-producer.test.mjs
          tools/datapack/lib/datapack-manifest-schema.test.mjs
          tools/datapack/catalog-raw-sql-tables.test.mjs

      - name: Verify current ITX station catalog admission consumers
        run: |
          set -euo pipefail
          node --test tools/datapack/itx-cheongchun-coverage-contract.test.mjs
          node --test tools/datapack/apply-itx-topology-to-bundled-pack.test.mjs
          node --test tools/datapack/apply-timetable-refresh.test.mjs
          node --test tools/datapack/build-server-timetable-snapshot.test.mjs
          node --test tools/datapack/build-backend-timetable-seed.test.mjs
          node --test --test-name-pattern='ITX CLI promotion은 station catalog와 주입된 repository root를 전달한다|ITX CLI current refresh는 admitted source에 station catalog snapshot을 전달한다' tools/datapack/collect-korail-itx-cheongchun-timetable.test.mjs
          node --test --test-name-pattern='official OD fare release candidate|production candidate' tools/datapack/datapack-tools.test.mjs
          node --test tools/datapack/itx-cheongchun-service-layer.test.mjs

      - name: Verify regional materializer fixture projection
        run: |
          set -euo pipefail
          node --test tools/datapack/materialize-test-fixture.test.mjs
          node --test --test-name-pattern='production 시설 status|현장·운영기관 확인 시설|근거 없는 시설 operationalStatus|UNKNOWN 운행상태 시설|production verified edge coverage|UNKNOWN accessibility edge|production pack의 최소 coverage|coverage evidence 누락|source inventory가 뒷받침하지 않는|provenance 전용 source|selected source가 claim한|production pack의 최소 coverage 미달|production coverage 기준|production schedule pass-through|cross-line EXPRESS|admission 전 schedule provenance|quota 미승인 schedule|station-line 단위 facility|동일 station-line-type|stationLineRows 없는|station-line source provenance|missing strict operational|missing approved movement|station-line source 우회|station-line operational evidence|UNDER_MAINTENANCE|NO_OFFICIAL_FEED|임의 strict route reason|route evidence가 아니면|status probe와 결합|field provenance|승인된 이동 경로 누락|STAIR pathway|수도권 pilot source coverage|관리자 검수 NORMAL' tools/datapack/datapack-tools.test.mjs
          node --test --test-concurrency=2 \
            tools/datapack/materialize-busan-accessibility.test.mjs \
            tools/datapack/materialize-busan-route-map-positions.test.mjs \
            tools/datapack/materialize-busan-route-topology.test.mjs \
            tools/datapack/materialize-daegu-accessibility.test.mjs \
            tools/datapack/materialize-daegu-route-map-positions.test.mjs \
            tools/datapack/materialize-daegu-timetable.test.mjs \
            tools/datapack/materialize-daejeon-accessibility.test.mjs \
            tools/datapack/materialize-daejeon-route-map-positions.test.mjs \
            tools/datapack/materialize-daejeon-route-topology.test.mjs \
            tools/datapack/materialize-daejeon-timetable.test.mjs \
            tools/datapack/materialize-gwangju-accessibility.test.mjs \
            tools/datapack/materialize-gwangju-route-map-positions.test.mjs \
            tools/datapack/materialize-gwangju-timetable.test.mjs \
            tools/datapack/materialize-incheon-accessibility.test.mjs \
            tools/datapack/materialize-incheon-station-info.test.mjs \
            tools/datapack/materialize-incheon-timetable.test.mjs \
            tools/datapack/materialize-seoul-route-map-positions.test.mjs \
            tools/datapack/materialize-seoul9-phase1-route-map-positions.test.mjs \
            tools/datapack/materialize-seoul9-route-map-positions.test.mjs
