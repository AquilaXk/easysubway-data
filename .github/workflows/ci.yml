  contracts:
    name: Data contracts
    permissions:
      contents: read
    needs: [contracts_mobile_v19, contracts_shard_1, contracts_shard_2, contracts_shard_3, contracts_shard_4]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful pristine Mobile required-test shards
        shell: bash
        env:
          MOBILE_V19_RESULT: ${{ needs.contracts_mobile_v19.result }}
          SHARD_1_RESULT: ${{ needs.contracts_shard_1.result }}
          SHARD_2_RESULT: ${{ needs.contracts_shard_2.result }}
          SHARD_3_RESULT: ${{ needs.contracts_shard_3.result }}
          SHARD_4_RESULT: ${{ needs.contracts_shard_4.result }}
        run: |
          set -euo pipefail
          [[ "${MOBILE_V19_RESULT}" == "success" ]]
          [[ "${SHARD_1_RESULT}" == "success" ]]
          [[ "${SHARD_2_RESULT}" == "success" ]]
          [[ "${SHARD_3_RESULT}" == "success" ]]
          [[ "${SHARD_4_RESULT}" == "success" ]]
