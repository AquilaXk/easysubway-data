name: CI

on:
  # automerge coordinator가 BEHIND PR의 base를 GITHUB_TOKEN으로 갱신하면 synchronize
  # 이벤트가 뜨지 않아 새 head에 required context(Data contracts)가 붙지 않는다.
  # 그 경로를 잇는 유일한 수단이 명시 dispatch다.
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  contracts_shard_1:
    name: Data contracts (shard 1/5)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Checkout pinned Mobile fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: AquilaXk/easysubway-mobile
          ref: 5b58d426258f536070137737c3f19a8dbeda44c1
          path: .external/mobile
          persist-credentials: false
          fetch-depth: 0

      - name: Stage pinned Mobile fixture
        shell: bash
        run: |
          set -euo pipefail
          expected_revision="5b58d426258f536070137737c3f19a8dbeda44c1"
          source=".external/mobile/apps/mobile"
          capital_gzip="${source}/assets/datapacks/capital.sqlite.gz"
          expected_sha256="609a74095859b5bf7602c25e142caa47cc212170a72d6240e2d01b39f874047a"

          actual_revision="$(git -C .external/mobile rev-parse HEAD)"
          [[ "${actual_revision}" == "${expected_revision}" ]]
          [[ -d "${source}" && ! -L "${source}" ]]
          if find "${source}" -type l -print -quit | grep -q .; then
            echo "pinned Mobile fixture contains a symlink" >&2
            exit 1
          fi
          [[ -f "${capital_gzip}" && ! -L "${capital_gzip}" ]]
          actual_sha256="$(sha256sum "${capital_gzip}" | awk '{print $1}')"
          [[ "${actual_sha256}" == "${expected_sha256}" ]]
          test ! -e apps/mobile
          test ! -L apps/mobile

          if [[ -e apps || -L apps ]]; then
            [[ -d apps && ! -L apps ]]
          else
            mkdir apps
          fi
          cp -a "${source}" apps/mobile

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"

      - name: Verify current Mobile v19 ITX topology evidence
        shell: bash
        run: |
          set -euo pipefail
          node tools/datapack/apply-itx-topology-to-bundled-pack.mjs \
            --check \
            --pack apps/mobile/assets/datapacks/capital.sqlite.gz
          node --test tools/datapack/readmit-bundled-pack-identity.test.mjs
          node --test --test-name-pattern='bundled 공식 OD quote|bundled 차량·출입문 힌트' tools/datapack/datapack-tools.test.mjs
          git diff --exit-code -- tools/datapack/itx-cheongchun-topology-evidence.json

      - name: Verify and run current Mobile v19 owned required tests
        run: node tools/ci/data-test-discovery.mjs run --class required-pr --profile mobile-v19 --max-workers 1

      - name: Re-verify current Mobile fixture for owned tests
        shell: bash
        run: |
          set -euo pipefail
          expected_revision="5b58d426258f536070137737c3f19a8dbeda44c1"
          expected_sha256="609a74095859b5bf7602c25e142caa47cc212170a72d6240e2d01b39f874047a"
          source=".external/mobile/apps/mobile"
          source_capital_gzip="${source}/assets/datapacks/capital.sqlite.gz"
          target="apps/mobile"
          target_capital_gzip="${target}/assets/datapacks/capital.sqlite.gz"

          actual_revision="$(git -C .external/mobile rev-parse HEAD)"
          [[ "${actual_revision}" == "${expected_revision}" ]]
          [[ -d "${source}" && ! -L "${source}" ]]
          [[ -f "${source_capital_gzip}" && ! -L "${source_capital_gzip}" ]]
          source_sha256="$(sha256sum "${source_capital_gzip}" | awk '{print $1}')"
          [[ "${source_sha256}" == "${expected_sha256}" ]]
          [[ -d "${target}" && ! -L "${target}" ]]

          [[ -f "${target_capital_gzip}" && ! -L "${target_capital_gzip}" ]]
          target_sha256="$(sha256sum "${target_capital_gzip}" | awk '{print $1}')"
          [[ "${target_sha256}" == "${expected_sha256}" ]]

      - name: Lint workflows
        shell: bash
        run: |
          set -euo pipefail
          # 워크플로를 실제 YAML 파서로 읽는 유일한 게이트다. run 블록의 block scalar가
          # 깨져 스크립트 일부가 YAML 구조로 새어 나가는 파손은 텍스트 기반 계약 테스트로는
          # 잡히지 않는다. 이미지는 다른 pin과 같은 규칙으로 digest 고정한다.
          docker run --rm -v "${GITHUB_WORKSPACE}:/repo:ro" -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

      - name: Verify current capital live-chain OCI contracts
        run: |
          node --test tools/datapack/run-current-capital-live-chain.test.mjs
          node --test tools/datapack/build-current-capital-live-chain-oci-receipt.test.mjs
          node --test tools/datapack/extract-current-capital-live-chain-directory.test.mjs

      - name: Set up Chrome for browser-dependent required tests
        id: setup-chrome
        uses: browser-actions/setup-chrome@086160e580d6e8c142ad5ba29009dcde677c6321
        with:
          chrome-version: "152.0.7977.54"
          install-dependencies: true

      - name: Verify and run pristine Mobile owned required tests (shard 1/5)
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          ROUTE_MAP_CHROME_NO_SANDBOX: "1"
        run: node tools/ci/data-test-discovery.mjs run --class required-pr --default-profile --max-workers 1 --shard-count 5 --shard-index 1

