    timeout-minutes: 30
    env:
      # #942: 후보 재현 테스트가 고정 입력을 받는 공개 읽기 경로다(시크릿 아님). 앱 데이터팩 공개 base URL과 같은 버킷 공개 경로라
      # 서버 경로 번들용으로 등록된 vars.OCI_SERVER_ROUTE_PUBLIC_BASE_URL을 함께 쓴다(용도 공유, 새 설정 없음).
      EASYSUBWAY_DATA_PACK_BASE_URL: ${{ vars.OCI_SERVER_ROUTE_PUBLIC_BASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify pinned Mobile fixture ref exists
        shell: bash
        run: |
          set -euo pipefail
          # 고정 fixture 커밋은 mobile 레포의 태그가 붙들고 있다. 태그가 지워지거나 옮겨지면 checkout이 불투명하게 실패하므로 먼저 원인을 드러낸다.
          peeled="$(git ls-remote https://github.com/AquilaXk/easysubway-mobile.git 'refs/tags/data-fixture/itx-979^{}' | awk '{print $1}')"
          if [[ "${peeled}" != "573aefdbbf2e639d28de18697eb449da85415353" ]]; then
            echo "pinned Mobile fixture tag data-fixture/itx-979 must point to 573aefdbbf2e639d28de18697eb449da85415353 (found '${peeled}'); do not delete or move this tag" >&2
            exit 1
          fi

      - name: Checkout pinned Mobile fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: AquilaXk/easysubway-mobile
          ref: data-fixture/itx-979
          path: .external/mobile
          persist-credentials: false
          fetch-depth: 0

      - name: Stage pinned Mobile fixture
        shell: bash
        run: |
          set -euo pipefail
          expected_revision="573aefdbbf2e639d28de18697eb449da85415353"
          source=".external/mobile/apps/mobile"
          capital_gzip="${source}/assets/datapacks/capital.sqlite.gz"
          expected_sha256="609a74095859b5bf7602c25e142caa47cc212170a72d6240e2d01b39f874047a"

          actual_revision="$(git -C .external/mobile rev-parse HEAD)"
          [[ "${actual_revision}" == "${expected_revision}" ]]
          [[ -d "${source}" && ! -L "${source}" ]]
          if find "${source}" -type l -print -quit | grep -q .; then
            echo "pinned Mobile fixture contains a symlink" >&2
            exit 1
          fi
          [[ -f "${capital_gzip}" && ! -L "${capital_gzip}" ]]
          actual_sha256="$(sha256sum "${capital_gzip}" | awk '{print $1}')"
          [[ "${actual_sha256}" == "${expected_sha256}" ]]
          test ! -e apps/mobile
          test ! -L apps/mobile

          if [[ -e apps || -L apps ]]; then
            [[ -d apps && ! -L apps ]]
          else
            mkdir apps
          fi
          cp -a "${source}" apps/mobile

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
      - name: Derive ITX-청춘 topology into the staged Mobile fixture
        shell: bash
        run: |
          set -euo pipefail
          # #979: fixture는 ITX topology 적용 전 입력 팩으로 고정돼 있다. 승격마다 mobile 커밋을 새로 만들지 않고, 커밋된 승인 원천에서
          # 같은 팩·index를 결정적으로 파생한다. 파생 증거가 커밋된 itx-cheongchun-topology-evidence.json과 한 글자라도 다르면 실패한다.
          node tools/datapack/apply-itx-topology-to-bundled-pack.mjs --derive-fixture apps/mobile

      - name: Require public candidate input base URL
        run: |
          set -euo pipefail
          # #942: 값이 없으면 고정 입력을 받을 수 없으므로 테스트 전에 실패한다(건너뛰지 않는다).
          [[ "${EASYSUBWAY_DATA_PACK_BASE_URL:-}" =~ ^https://[^[:space:]]+$ ]] || { echo "vars.OCI_SERVER_ROUTE_PUBLIC_BASE_URL must be set to the public data pack bucket base URL" >&2; exit 1; }

      - name: Set up Chrome for browser-dependent required tests
        id: setup-chrome
        uses: browser-actions/setup-chrome@086160e580d6e8c142ad5ba29009dcde677c6321
        with:
          chrome-version: "152.0.7977.54"
          install-dependencies: true

      - name: Verify and run pristine Mobile owned required tests (shard 3/4)
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          ROUTE_MAP_CHROME_NO_SANDBOX: "1"
        run: node tools/ci/data-test-discovery.mjs run --class required-pr --default-profile --max-workers 4 --shard-count 4 --shard-index 3

