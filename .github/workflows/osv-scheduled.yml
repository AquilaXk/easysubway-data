name: Scheduled Dependency Vulnerability Scan

on:
  schedule:
    # Monday 21:37 UTC (Tuesday 06:37 KST)
    - cron: "37 21 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  osv-scan:
    name: Scheduled OSV Scan
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a96bc4d2b09685b6142bcfe25a3dc17cb2d7347
    with:
      export-results: false
      upload-sarif: true
      fail-on-vuln: true
      scan-args: |-
        -r .
