name: Current Capital Topology Registration

# 수도권 topology 등록(#456, #969): 갱신 커밋으로 보호 admission이 main에 들어오면
# 그 topology 원본을 OCI에 게시하고 원장에 등록한 결과를 main에 직접 push한다.
# - 판정(decide-capital-topology-registration)이 REGISTER·RECOVER_CLAIM·REGISTERED·SUPERSEDED를 정한다. 쓰기 step은 앞의 둘에서만 돈다.
# - push·정기 실행은 저장소 변수 DATAPACK_SCHEDULED_SOURCE_REGISTRATION이 true일 때만 돈다. 사람 dispatch는 항상 돈다.
# - 이상(admission 누락/만료·정책 변경·원장 게이트 실패)은 job을 실패시키고 실행 요약으로 드러낸다. 이전 데이터로 대체하지 않는다.
on:
  push:
    branches:
      - main
    paths:
      - tools/datapack/sources/capital-route-topology-*.json
      - tools/datapack/release/capital-topology-reverification-*.json
  schedule:
    - cron: "5 */2 * * *"
  workflow_dispatch:
    inputs:
      recovery_run_id:
        description: Recover one exact failed run after verified OCI publication
        required: false
        type: string

permissions: {}

concurrency:
  group: current-capital-topology-registration-main
  cancel-in-progress: false

jobs:
  register:
    name: Capital topology registration
    # 사람(sender.type이 User) dispatch만 변수와 무관하게 돈다. 행위자 이름(actor·triggering_actor)은 모방할 수 있어 신뢰 근거로 쓰지 않고, GitHub가 이벤트 payload에 채우는 sender.type으로 가른다(Sonar githubactions:S8232).
    if: ${{ github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && github.event.sender.type == 'User') || vars.DATAPACK_SCHEDULED_SOURCE_REGISTRATION == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    environment: datapack-release-check
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.19.0"
      - name: Prepare private operation parent
        run: |
          set -euo pipefail
          operation_root="${RUNNER_TEMP}/current-capital-topology-registration/${GITHUB_RUN_ID}"
          operation_parent="$(dirname "${operation_root}")"
          mkdir -p "${operation_parent}"
          chmod 700 "${operation_parent}"
          printf 'REGISTRATION_OPERATION_ROOT=%s\n' "${operation_root}" >> "${GITHUB_ENV}"
          printf 'REGISTRATION_MAIN_SHA=%s\n' "$(git rev-parse HEAD)" >> "${GITHUB_ENV}"
      - name: Decide whether capital topology registration is needed
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
        run: |
          set -euo pipefail
          main_sha="${REGISTRATION_MAIN_SHA}"
          # 판정 시점의 checkout이 아직 main이어야 한다. 그 사이 main이 움직였으면 새 push·정기 실행이 자기 판정을 한다.
          if [[ "$(git ls-remote origin refs/heads/main | cut -f1)" != "${main_sha}" ]]; then
            echo "::notice title=Capital topology registration::main moved after this run started; a newer run decides on the new main."
            echo "state=SUPERSEDED" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ -n "${RECOVERY_RUN_ID}" ]]; then
            # 사람이 지정한 복구는 판정을 거치지 않는다. producer run 검증과 artifact 다운로드는 다음 step이 한다.
            [[ "${RECOVERY_RUN_ID}" =~ ^[1-9][0-9]*$ ]] || { echo "recovery run ID is invalid" >&2; exit 1; }
            printf 'state=RECOVER_CLAIM\nrecovery_run_id=%s\n' "${RECOVERY_RUN_ID}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          decision_root="${RUNNER_TEMP}/capital-topology-registration-decision/${GITHUB_RUN_ID}"
          mkdir -p "${decision_root}"
          printf '[]\n' > "${decision_root}/prs.json"
          : > "${decision_root}/claims.txt"
          : > "${decision_root}/automation-branches.txt"
          printf '[]\n' > "${decision_root}/runs.json"
          printf '{}\n' > "${decision_root}/artifacts.json"
          node tools/ci/decide-capital-topology-registration.mjs --inventory tools/datapack/source-inventory.json --ledger tools/datapack/release/source-snapshots.json --prs "${decision_root}/prs.json" --claims "${decision_root}/claims.txt" --automation-branches "${decision_root}/automation-branches.txt" --runs "${decision_root}/runs.json" --artifacts "${decision_root}/artifacts.json" --repository "${GITHUB_REPOSITORY}" --current-main-sha "${main_sha}" --pr-limit 1000 --run-limit 200 --github-output "${GITHUB_OUTPUT}"
      - name: Prepare retained publication recovery evidence
        if: ${{ steps.decision.outputs.state == 'RECOVER_CLAIM' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_RUN_ID: ${{ steps.decision.outputs.recovery_run_id }}
        run: |
          set -euo pipefail
          main_sha="${REGISTRATION_MAIN_SHA}"
          [[ "${RECOVERY_RUN_ID}" =~ ^[1-9][0-9]*$ ]] || { echo "recovery run ID is invalid" >&2; exit 1; }
          metadata="$(gh run view "${RECOVERY_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --json databaseId,status,conclusion,event,workflowName,headBranch,headSha --jq '[.databaseId,.status,.conclusion,.event,.workflowName,.headBranch,.headSha] | @tsv')"
          IFS=$'\t' read -r run_id run_status run_conclusion run_event run_workflow run_branch run_head <<< "${metadata}"
          [[ "${run_event}" == "workflow_dispatch" || "${run_event}" == "push" || "${run_event}" == "schedule" ]] || { echo "recovery producer run event is invalid" >&2; exit 1; }
          [[ "${run_id}" == "${RECOVERY_RUN_ID}" && "${run_status}" == "completed" && "${run_conclusion}" == "failure" && "${run_workflow}" == "Current Capital Topology Registration" && "${run_branch}" == "main" && "${run_head}" == "${main_sha}" ]] || { echo "recovery producer run identity is invalid" >&2; exit 1; }
          source_root="${RUNNER_TEMP}/current-capital-topology-registration/retained-${RECOVERY_RUN_ID}"
          mkdir -p "${source_root}"
          chmod 700 "${source_root}"
          gh run download "${RECOVERY_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name "current-capital-topology-registration-${RECOVERY_RUN_ID}" --dir "${source_root}"
          [[ -f "${source_root}/capital-route-topology-registration.json" && -f "${source_root}/capital-route-topology.raw-receipt.json" ]] || { echo "retained registration evidence is incomplete" >&2; exit 1; }
          printf 'REGISTRATION_SOURCE_OPERATION_ROOT=%s\n' "${source_root}" >> "${GITHUB_ENV}"
      - name: Publish and register once
        if: ${{ steps.decision.outputs.state == 'REGISTER' }}
        env:
          EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL: ${{ secrets.EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git fetch --no-tags origin main:refs/remotes/origin/main
          [[ "$(git rev-parse HEAD)" == "${REGISTRATION_MAIN_SHA}" && "$(git rev-parse origin/main)" == "${REGISTRATION_MAIN_SHA}" ]] || { echo "main changed before OCI publication" >&2; exit 1; }
          node tools/datapack/run-current-capital-route-topology-registration.mjs --repository-root "${GITHUB_WORKSPACE}" --operation-root "${REGISTRATION_OPERATION_ROOT}" --expected-main-sha "${REGISTRATION_MAIN_SHA}"
      - name: Recover published registration without OCI
        if: ${{ steps.decision.outputs.state == 'RECOVER_CLAIM' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_RUN_ID: ${{ steps.decision.outputs.recovery_run_id }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git fetch --no-tags origin main:refs/remotes/origin/main
          [[ "$(git rev-parse HEAD)" == "${REGISTRATION_MAIN_SHA}" && "$(git rev-parse origin/main)" == "${REGISTRATION_MAIN_SHA}" ]] || { echo "main changed before recovery registration" >&2; exit 1; }
          node tools/datapack/run-current-capital-route-topology-registration.mjs recover-published --repository-root "${GITHUB_WORKSPACE}" --source-operation-root "${REGISTRATION_SOURCE_OPERATION_ROOT}" --target-operation-root "${REGISTRATION_OPERATION_ROOT}" --expected-main-sha "${REGISTRATION_MAIN_SHA}" --expected-publication-operation-id "${RECOVERY_RUN_ID}"
      - name: Commit and push registration outputs directly to main
        if: ${{ steps.decision.outputs.state == 'REGISTER' || steps.decision.outputs.state == 'RECOVER_CLAIM' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${REGISTRATION_MAIN_SHA}" ]] || { echo "registration commit must stay on its source main" >&2; exit 1; }
          # #989: 재등록은 원장과 inventory만 바꾼다. governance 정책·신선도 SLA가 바뀌어 있으면 push하지 않고 실패한다.
          expected=(tools/datapack/source-inventory.json tools/datapack/release/source-snapshots.json)
          changed="$(git status --porcelain=v1 | sed -E 's/^.. //' | LC_ALL=C sort)"
          for policy in tools/datapack/source-governance-policy.json release/product-gates/datapack-freshness-sla.json; do
            case $'\n'"${changed}"$'\n' in
              *$'\n'"${policy}"$'\n'*) echo "REGISTRATION_POLICY_CHANGED: ${policy} changed; a re-registration must not change source policy" >&2; exit 1 ;;
            esac
          done
          [[ "${changed}" == "$(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)" ]] || { echo "registration changed an invalid path set" >&2; exit 1; }
          # #975 리뷰 F5: 원장 변화 게이트(SOURCE_SHA_DRIFT·SOURCE_COUNT_DELTA·BINDING_MISMATCH)를 통과해야 push한다.
          evidence_root="$(mktemp -d "${RUNNER_TEMP}/registration-evidence.XXXXXX")"
          node tools/ci/source-ledger-gate.mjs --base-sha "${REGISTRATION_MAIN_SHA}" --output "${evidence_root}/gate.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${expected[@]}"
          git commit -m "Register current capital topology"
          node tools/ci/automation-pr-evidence.mjs registration-body --gate "${evidence_root}/gate.json" --base-sha "${REGISTRATION_MAIN_SHA}" --head-sha "$(git rev-parse HEAD)" --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --output "${evidence_root}/body.md"
          cat "${evidence_root}/body.md" >> "${GITHUB_STEP_SUMMARY}"
          gh auth setup-git
          git fetch --no-tags origin main
          if [[ "$(git rev-parse origin/main)" != "${REGISTRATION_MAIN_SHA}" ]]; then
            echo "::notice title=Capital topology registration::main moved from ${REGISTRATION_MAIN_SHA} while registration was running; nothing was pushed and the next run decides again."
            exit 0
          fi
          git push origin HEAD:main
      - name: Detect retained publication receipt
        id: receipt
        if: ${{ always() && (steps.decision.outputs.state == 'REGISTER' || steps.decision.outputs.state == 'RECOVER_CLAIM') }}
        run: |
          set -euo pipefail
          # 복구 run 실행에 필요한 OCI 게시 receipt artifact 유무를 남긴다.
          if [[ -n "${REGISTRATION_OPERATION_ROOT:-}" && -f "${REGISTRATION_OPERATION_ROOT}/capital-route-topology.raw-receipt.json" ]]; then
            echo "has_receipt=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_receipt=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Retain sanitized publication recovery evidence
        if: ${{ always() && steps.receipt.outputs.has_receipt == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: current-capital-topology-registration-${{ github.run_id }}
          path: |
            ${{ env.REGISTRATION_OPERATION_ROOT }}/capital-route-topology-registration.json
            ${{ env.REGISTRATION_OPERATION_ROOT }}/capital-route-topology.raw-receipt.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Report refresh failure summary
        if: ${{ failure() || cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/ci/report-refresh-failure.mjs --workflow current-capital-topology-registration.yml --repository "${GITHUB_REPOSITORY}" --run-id "${GITHUB_RUN_ID}"
