name: KRIC Current Facility Refresh

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: kric-current-facility-refresh-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    name: KRIC current facility refresh
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
      issues: write
    environment: datapack-release-check
    timeout-minutes: 45
    steps:
      - name: KRIC current facility refresh / Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: KRIC current facility refresh / Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"

      - name: KRIC current facility refresh / Prepare operation paths
        run: |
          set -euo pipefail
          operation_root="${RUNNER_TEMP}/kric-current-facility-refresh/${GITHUB_RUN_ID}"
          mkdir -p "$(dirname "${operation_root}")"
          printf 'KRIC_REFRESH_OPERATION_ROOT=%s\n' "${operation_root}" >> "${GITHUB_ENV}"
          printf 'KRIC_REFRESH_DECISION=%s\n' "${RUNNER_TEMP}/kric-current-facility-refresh/decision.json" >> "${GITHUB_ENV}"

      - name: KRIC current facility refresh / Read due state
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prs="${RUNNER_TEMP}/kric-current-facility-refresh/open-prs.json"
          claims="${RUNNER_TEMP}/kric-current-facility-refresh/claims.txt"
          claim_evidence="${RUNNER_TEMP}/kric-current-facility-refresh/claim-evidence.json"
          git ls-remote --heads origin \
            "refs/heads/automation/629-kric-facility-refresh-*" > "${claims}"
          node tools/ci/collect-automation-prs.mjs --repository "${GITHUB_REPOSITORY}" --refs "${claims}" --pr-limit 1000 --output "${prs}"
          # #995: PR 없는 claim은 DUE 여부와 무관하게 만든 run과 게시 증거(출력 커밋·receipt artifact)로 판정한다.
          # 고아마다 gh run view 한 번이다(끝난 run 이력 목록은 받지 않는다). 닫힌(Abandon) claim도 같은 증거로 정리 대상이 된다.
          node tools/ci/claim-orphans.mjs --workflow kric-current-facility-refresh.yml --repository "${GITHUB_REPOSITORY}" --refs "${claims}" --prs "${prs}" --output "${claim_evidence}"
          node tools/ci/decide-current-kric-facility-refresh.mjs \
            --inventory tools/datapack/source-inventory.json \
            --policy release/product-gates/datapack-freshness-sla.json \
            --prs "${prs}" \
            --claims "${claims}" \
            --claim-evidence "${claim_evidence}" \
            --repository "${GITHUB_REPOSITORY}" \
            --output "${KRIC_REFRESH_DECISION}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: KRIC current facility refresh / Remove abandoned claims named by the decision
        if: ${{ steps.decision.outputs.cleanup_claims != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CLEANUP_CLAIMS: ${{ steps.decision.outputs.cleanup_claims }}
        run: |
          set -euo pipefail
          # #995: 판정이 정리 대상으로 알린 claim만 지운다(만든 run이 끝났고 receipt 없는 빈 claim뿐인 고아, 닫힌 Abandon claim).
          # 조용히 지우지 않는다: #926 실패 보고를 먼저 하고 지운다.
          gh auth setup-git
          node tools/ci/remove-orphan-claims.mjs --workflow kric-current-facility-refresh.yml --repository "${GITHUB_REPOSITORY}" --claims "${CLEANUP_CLAIMS}" --refs "${RUNNER_TEMP}/kric-current-facility-refresh/claims.txt"

      - name: KRIC current facility refresh / Note refresh waiting on a running producer
        if: ${{ steps.decision.outputs.state == 'CLAIM_IN_PROGRESS' }}
        env:
          CLAIM_BRANCH: ${{ steps.decision.outputs.branch }}
        run: |
          echo "::notice title=KRIC facility refresh::the run that created ${CLAIM_BRANCH} is still running; waiting for it to finish."

      - name: KRIC current facility refresh / Mint App token for the open refresh pull request
        id: app-token-open
        if: ${{ steps.decision.outputs.state == 'OPEN_PR' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.EASYSUBWAY_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.EASYSUBWAY_RELEASE_APP_PRIVATE_KEY }}
          owner: AquilaXk
          repositories: easysubway-data
          permission-pull-requests: write
      - name: KRIC current facility refresh / Ensure required CI on the open refresh pull request
        id: required-ci
        if: ${{ steps.decision.outputs.state == 'OPEN_PR' }}
        env:
          GH_TOKEN: ${{ github.token }}
          APP_PR_TOKEN: ${{ steps.app-token-open.outputs.token }}
        run: |
          set -euo pipefail
          # #939: head에 pull_request CI가 없으면 그 PR만 App으로 닫았다 다시 열어 CI를 실행한다(이미 있으면 아무것도 하지 않는다).
          node tools/ci/refresh-pr-required-ci.mjs --workflow kric-current-facility-refresh.yml --repository "${GITHUB_REPOSITORY}" --github-output "${GITHUB_OUTPUT}"
      - name: KRIC current facility refresh / Enforce open refresh pull request age limit
        if: ${{ steps.decision.outputs.state == 'OPEN_PR' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # #939: 열린 갱신 PR이 정책 manualCheckCadence를 넘기면 실패해 실패 보고(report-refresh-failure)로 드러낸다.
          open_prs="${RUNNER_TEMP}/open-refresh-prs-${GITHUB_RUN_ID}.json"
          gh pr list --repo "${GITHUB_REPOSITORY}" --state open --base main --limit 1000 --json number,url,createdAt,headRefName,baseRefName,isCrossRepository > "${open_prs}"
          node tools/ci/refresh-open-pr-age.mjs --workflow kric-current-facility-refresh.yml --prs "${open_prs}" --policy release/product-gates/datapack-freshness-sla.json --repository "${GITHUB_REPOSITORY}" --ci-state "${{ steps.required-ci.outputs.state }}"
      - name: KRIC current facility refresh / Mint App token for the refresh pull request
        id: app-token-recover
        if: ${{ steps.decision.outputs.state == 'RECOVER_CLAIM' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.EASYSUBWAY_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.EASYSUBWAY_RELEASE_APP_PRIVATE_KEY }}
          owner: AquilaXk
          repositories: easysubway-data
          permission-pull-requests: write
      - name: KRIC current facility refresh / Recover claimed refresh
        if: ${{ steps.decision.outputs.state == 'RECOVER_CLAIM' }}
        env:
          APP_PR_TOKEN: ${{ steps.app-token-recover.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL: ${{ secrets.EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL }}
        run: |
          set -euo pipefail
          branch="${{ steps.decision.outputs.branch }}"
          git fetch --no-tags origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
          validate_output_set() {
            local changed="$1"
            local deleted="$2"
            [[ -z "${deleted}" ]] || {
              echo "KRIC refresh claim removed a tracked input" >&2
              exit 1
            }
            [[ -n "${changed}" ]] || {
              echo "KRIC refresh claim is incomplete" >&2
              exit 1
            }
            # #862 결정 C: 원천 갱신은 원장 등록까지만 한다. 후보 spec·request·hash는 전국 후보 갱신이 만든다.
            for required in \
              tools/datapack/release/source-snapshots.json \
              tools/datapack/source-inventory.json; do
              grep -Fqx "${required}" <<< "${changed}" || {
                echo "KRIC refresh claim is incomplete" >&2
                exit 1
              }
            done
            grep -Eq '^tools/datapack/sources/[^/]+\.json$' <<< "${changed}" || {
              echo "KRIC refresh claim is incomplete" >&2
              exit 1
            }
            local unexpected
            unexpected="$(printf '%s\n' "${changed}" | grep -Ev \
              'tools/datapack/(release/source-snapshots\.json|source-inventory\.json|sources/[^/]+\.json)' || true)"
            if [[ -n "${unexpected}" ]]; then
              echo "KRIC refresh claim changed an unsupported path" >&2
              exit 1
            fi
          }

          changed_outputs() {
            {
              git diff --name-only --diff-filter=ACMR
              git ls-files --others --exclude-standard
            } | LC_ALL=C sort -u
          }

          validate_terminal_claim_topology() {
            local output_sha="origin/${branch}"
            local output_parent
            local parent_record
            local claim_commit
            local source_main_sha
            local merged_main_sha=""
            local -a parent_fields
            output_parent="$(git rev-parse "${output_sha}^")"
            [[ "$(git rev-list --count "${output_parent}..${output_sha}")" == "1" ]] || {
              echo "KRIC refresh branch has multiple output commits" >&2
              exit 1
            }
            parent_record="$(git rev-list --parents -n 1 "${output_parent}")"
            read -r -a parent_fields <<< "${parent_record}"
            case "${#parent_fields[@]}" in
              2)
                claim_commit="${output_parent}"
                ;;
              3)
                claim_commit="$(git rev-parse "${output_parent}^1")"
                merged_main_sha="$(git rev-parse "${output_parent}^2")"
                ;;
              *)
                echo "KRIC refresh branch has an invalid recovery topology" >&2
                exit 1
                ;;
            esac
            [[ "$(git log -1 --format=%s "${claim_commit}")" == "Claim KRIC facility refresh" ]] || {
              echo "KRIC refresh branch has no exact claim commit" >&2
              exit 1
            }
            source_main_sha="$(git rev-parse "${claim_commit}^")"
            [[ "$(git rev-list --count "${source_main_sha}..${claim_commit}")" == "1" ]] || {
              echo "KRIC refresh branch has multiple claim commits" >&2
              exit 1
            }
            git merge-base --is-ancestor "${source_main_sha}" HEAD || {
              echo "KRIC refresh source main is not an ancestor of current main" >&2
              exit 1
            }
            if [[ -n "${merged_main_sha}" ]]; then
              git merge-base --is-ancestor "${source_main_sha}" "${merged_main_sha}" || {
                echo "KRIC refresh merge does not descend from the source main" >&2
                exit 1
              }
              git merge-base --is-ancestor "${merged_main_sha}" HEAD || {
                echo "KRIC refresh merged main is not an ancestor of current main" >&2
                exit 1
              }
              git diff --quiet "${merged_main_sha}" "${output_parent}" || {
                echo "KRIC refresh merge contains unsupported changes" >&2
                exit 1
              }
            fi
          }

          [[ "${branch}" =~ ^automation/629-kric-facility-refresh-([0-9]+)$ ]] || {
            echo "KRIC refresh claim branch identity is invalid" >&2
            exit 1
          }
          subject="$(git log -1 --format=%s "origin/${branch}")"
          if [[ "${subject}" == "Claim KRIC facility refresh" ]]; then
            source_run_id="${BASH_REMATCH[1]}"
            source_main_sha="$(git rev-parse "origin/${branch}^")"
            [[ "$(git rev-list --count "${source_main_sha}..origin/${branch}")" == "1" ]] || {
              echo "KRIC refresh claim is not an exact one-commit claim" >&2
              exit 1
            }
            git merge-base --is-ancestor "${source_main_sha}" HEAD || {
              echo "KRIC refresh claim main is not an ancestor of current main" >&2
              exit 1
            }
            metadata="$(gh run view "${source_run_id}" --repo "${GITHUB_REPOSITORY}" \
              --json headSha,status,conclusion,event,workflowName,updatedAt \
              --jq '[.headSha,.status,.conclusion,.event,.workflowName,.updatedAt] | @tsv')"
            IFS=$'\t' read -r run_head run_status run_conclusion run_event run_workflow run_updated_at <<< "${metadata}"
            [[ "${run_head}" == "${source_main_sha}" \
              && "${run_status}" == "completed" \
              && "${run_conclusion}" == "failure" \
              && ( "${run_event}" == "schedule" || "${run_event}" == "workflow_dispatch" ) \
              && "${run_workflow}" == "KRIC Current Facility Refresh" ]] || {
              echo "KRIC refresh source run identity is invalid" >&2
              exit 1
            }
            claim_artifacts="${RUNNER_TEMP}/kric-current-facility-refresh/claim-artifacts.json"
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${source_run_id}/artifacts?per_page=100" > "${claim_artifacts}"
            evidence_state="$(SOURCE_RUN_ID="${source_run_id}" SOURCE_RUN_UPDATED_AT="${run_updated_at}" \
              CLAIM_ARTIFACTS="${claim_artifacts}" node --input-type=module -e '
              import { readFile } from "node:fs/promises";
              import { classifyKricFacilityClaimEvidence } from "./tools/ci/decide-current-kric-facility-refresh.mjs";
              const artifacts = JSON.parse(await readFile(process.env.CLAIM_ARTIFACTS, "utf8"));
              process.stdout.write(classifyKricFacilityClaimEvidence({
                sourceRunId: process.env.SOURCE_RUN_ID,
                sourceRunUpdatedAt: process.env.SOURCE_RUN_UPDATED_AT,
                artifacts,
              }));
            ')"
            if [[ "${evidence_state}" == "EXPIRED" ]]; then
              # 보존 증거가 만료돼 회수할 수 없는 claim이다. 성공으로 넘기지 않고 claim을 닫은 기록을 남긴 뒤 실패한다.
              # 다음 run의 decision은 이 claim을 회수 대상에서 빼고 신선도 상태(DUE/EXPIRED)로 새로 판정한다.
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              gh auth setup-git
              git switch --detach "origin/${branch}"
              git commit --allow-empty -m "Abandon KRIC facility refresh claim" \
                -m "Retained evidence of source run ${source_run_id} expired before recovery; nothing was recovered or published from this claim."
              git push origin "HEAD:refs/heads/${branch}"
              message="KRIC refresh claim ${branch} was abandoned: retained evidence of run ${source_run_id} expired before recovery"
              echo "::error title=KRIC refresh claim abandoned::${message}"
              printf '%s\n' "${message}" >> "${GITHUB_STEP_SUMMARY}"
              exit 1
            fi
            [[ "${evidence_state}" == "AVAILABLE" ]] || {
              echo "KRIC refresh retained evidence state is invalid" >&2
              exit 1
            }
            evidence_root="${RUNNER_TEMP}/kric-current-facility-refresh/retained-${source_run_id}"
            source_root="${evidence_root}/${source_run_id}"
            target_root="${KRIC_REFRESH_OPERATION_ROOT}"
            gh run download "${source_run_id}" --repo "${GITHUB_REPOSITORY}" \
              --name "kric-current-facility-refresh-${source_run_id}" --dir "${evidence_root}"
            [[ -f "${evidence_root}/decision.json" \
              && -f "${source_root}/journal.json" \
              && -f "${source_root}/raw-receipt.json" ]] || {
              echo "KRIC refresh retained evidence is incomplete" >&2
              exit 1
            }
            cp "${source_root}/raw-receipt.json" "${source_root}/receipt.json"
            main_sha="$(git rev-parse HEAD)"
            node tools/datapack/run-current-capital-facility-operation.mjs \
              --phase prepare --operation-root "${target_root}" --expected-main-sha "${main_sha}" --expected-facility-head-sha "${main_sha}"
            node tools/datapack/run-current-capital-facility-operation.mjs \
              --phase recover-published --operation-root "${target_root}" --source-operation-root "${source_root}"
            node tools/datapack/run-current-capital-facility-operation.mjs \
              --phase finalize --operation-root "${target_root}"
            validate_output_set "$(changed_outputs)" "$(git diff --name-only --diff-filter=D)"
            git stash push --include-untracked -m "Recover KRIC facility snapshot ${source_run_id}" -- \
              tools/datapack/release/source-snapshots.json \
              tools/datapack/source-inventory.json tools/datapack/sources
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            gh auth setup-git
            git switch --track -c "${branch}" "origin/${branch}"
            git merge --no-edit "${main_sha}"
            git stash pop
            validate_output_set "$(changed_outputs)" "$(git diff --name-only --diff-filter=D)"
            git add tools/datapack/release/source-snapshots.json \
              tools/datapack/source-inventory.json tools/datapack/sources
            git diff --cached --quiet && exit 1
            git commit -m "Refresh KRIC facility snapshot"
            git push origin "${branch}"
          elif [[ "${subject}" == "Refresh KRIC facility snapshot" ]]; then
            validate_terminal_claim_topology
          else
            echo "KRIC refresh claim has no recognized terminal commit" >&2
            exit 1
          fi
          deleted="$(git diff --name-only --diff-filter=D "origin/${branch}^" "origin/${branch}")"
          changed="$(git diff --name-only --diff-filter=ACMR "origin/${branch}^" "origin/${branch}")"
          validate_output_set "${changed}" "${deleted}"
          existing="${RUNNER_TEMP}/kric-current-facility-refresh/claim-prs.json"
          gh pr list --repo "${GITHUB_REPOSITORY}" --state all --base main --head "${branch}" \
            --limit 100 --json number,state,headRefName,baseRefName,headRepository,isCrossRepository > "${existing}"
          [[ "$(tr -d '[:space:]' < "${existing}")" == "[]" ]] || {
            echo "KRIC refresh claim already has a pull request" >&2
            exit 1
          }
          # #939: App이 연 PR이라야 pull_request CI가 required check로 붙는다(GITHUB_TOKEN PR은 action_required, dispatch CI는 인정 안 됨).
          GH_TOKEN="${APP_PR_TOKEN}" gh pr create --repo "${GITHUB_REPOSITORY}" --draft --base main --head "${branch}" \
            --title "Refresh KRIC facility snapshot" \
            --body "Refresh the due KRIC facility snapshot through the current OCI operation.\n\nRefs #629, #39, #29"

      - name: KRIC current facility refresh / Create durable claim
        if: ${{ steps.decision.outputs.state == 'DUE' || steps.decision.outputs.state == 'EXPIRED' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="automation/629-kric-facility-refresh-${GITHUB_RUN_ID}"
          main_sha="$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git commit --allow-empty -m "Claim KRIC facility refresh"
          gh auth setup-git
          git push origin "${branch}"
          git switch --detach "${main_sha}"
          printf 'KRIC_REFRESH_BRANCH=%s\n' "${branch}" >> "${GITHUB_ENV}"
          printf 'KRIC_REFRESH_MAIN_SHA=%s\n' "${main_sha}" >> "${GITHUB_ENV}"

      - name: KRIC current facility refresh / Validate provider configuration
        if: ${{ steps.decision.outputs.state == 'DUE' || steps.decision.outputs.state == 'EXPIRED' }}
        env:
          KRIC_SERVICE_KEY: ${{ secrets.KRIC_SERVICE_KEY }}
          EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL: ${{ secrets.EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${KRIC_SERVICE_KEY:-}" || "${KRIC_SERVICE_KEY}" == *$'\n'* || "${KRIC_SERVICE_KEY}" == *$'\r'* ]]; then
            echo "KRIC_SERVICE_KEY must be a nonempty single line" >&2
            exit 1
          fi
          if [[ -z "${EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL:-}" || "${EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL}" == *$'\n'* || "${EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL}" == *$'\r'* ]]; then
            echo "EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL must be a nonempty single line" >&2
            exit 1
          fi

      - name: KRIC current facility refresh / Collect current snapshot
        if: ${{ steps.decision.outputs.state == 'DUE' || steps.decision.outputs.state == 'EXPIRED' }}
        env:
          KRIC_SERVICE_KEY: ${{ secrets.KRIC_SERVICE_KEY }}
          EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL: ${{ secrets.EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL }}
        run: |
          set -euo pipefail
          # #995: 준비와 공급자 수집까지만 한다. OCI에는 아무것도 올리지 않는다(이 step이 실패하면 게시된 것이 없다).
          [[ "$(git rev-parse HEAD)" == "${KRIC_REFRESH_MAIN_SHA}" ]] || {
            echo "KRIC refresh operation is not running from its claimed main" >&2
            exit 1
          }
          node tools/datapack/run-current-capital-facility-operation.mjs --phase prepare --operation-root "${KRIC_REFRESH_OPERATION_ROOT}" --expected-main-sha "${KRIC_REFRESH_MAIN_SHA}" --expected-facility-head-sha "${KRIC_REFRESH_MAIN_SHA}"
          node tools/datapack/run-current-capital-facility-operation.mjs --phase collect --operation-root "${KRIC_REFRESH_OPERATION_ROOT}"

      - name: KRIC current facility refresh / Publish and register current snapshot
        if: ${{ steps.decision.outputs.state == 'DUE' || steps.decision.outputs.state == 'EXPIRED' }}
        env:
          EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL: ${{ secrets.EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL }}
        run: |
          set -euo pipefail
          # #995: finalize phase가 raw object를 OCI에 게시하고 receipt를 쓴 뒤 등록한다. 이 step이 시작되면 게시됐을 수 있다(claim 정리가 이 step 이름으로 판정한다: claim-orphans.mjs).
          node tools/datapack/run-current-capital-facility-operation.mjs --phase finalize --operation-root "${KRIC_REFRESH_OPERATION_ROOT}"
          cp "${KRIC_REFRESH_OPERATION_ROOT}/receipt.json" "${KRIC_REFRESH_OPERATION_ROOT}/raw-receipt.json"

      - name: KRIC current facility refresh / Finalize claimed refresh branch
        if: ${{ steps.decision.outputs.state == 'DUE' || steps.decision.outputs.state == 'EXPIRED' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git switch "${KRIC_REFRESH_BRANCH}"
          [[ "$(git rev-parse HEAD^)" == "${KRIC_REFRESH_MAIN_SHA}" ]] || {
            echo "KRIC refresh claim is not based on its operation main" >&2
            exit 1
          }
          git add -A
          deleted="$(git diff --cached --name-only --diff-filter=D)"
          [[ -z "${deleted}" ]] || {
            echo "KRIC refresh removed a tracked input" >&2
            exit 1
          }
          changed="$(git diff --cached --name-only --diff-filter=ACMR)"
          if [[ -z "${changed}" ]]; then
            echo "KRIC refresh produced no tracked update" >&2
            exit 1
          fi
          # #862 결정 C: 원천 갱신은 원장 등록까지만 한다. 후보 spec·request·hash는 전국 후보 갱신이 만든다.
          for required in \
            tools/datapack/release/source-snapshots.json \
            tools/datapack/source-inventory.json; do
            grep -Fqx "${required}" <<< "${changed}" || {
              echo "KRIC refresh produced an incomplete output" >&2
              exit 1
            }
          done
          grep -Eq '^tools/datapack/sources/[^/]+\.json$' <<< "${changed}" || {
            echo "KRIC refresh produced an incomplete output" >&2
            exit 1
          }
          unexpected="$(printf '%s\n' "${changed}" | grep -Ev \
            'tools/datapack/(release/source-snapshots\.json|source-inventory\.json|sources/[^/]+\.json)' || true)"
          if [[ -n "${unexpected}" ]]; then
            echo "KRIC refresh changed an unsupported path" >&2
            exit 1
          fi
          git diff --cached --quiet && exit 1
          git commit -m "Refresh KRIC facility snapshot"
          git push origin "${KRIC_REFRESH_BRANCH}"

      - name: KRIC current facility refresh / Mint App token for the refresh pull request
        id: app-token-pr
        if: ${{ steps.decision.outputs.state == 'DUE' || steps.decision.outputs.state == 'EXPIRED' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.EASYSUBWAY_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.EASYSUBWAY_RELEASE_APP_PRIVATE_KEY }}
          owner: AquilaXk
          repositories: easysubway-data
          permission-pull-requests: write
      - name: KRIC current facility refresh / Create draft pull request
        if: ${{ steps.decision.outputs.state == 'DUE' || steps.decision.outputs.state == 'EXPIRED' }}
        env:
          APP_PR_TOKEN: ${{ steps.app-token-pr.outputs.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # #939: App이 연 PR이라야 pull_request CI가 required check로 붙는다(GITHUB_TOKEN PR은 action_required, dispatch CI는 인정 안 됨).
          GH_TOKEN="${APP_PR_TOKEN}" gh pr create --repo "${GITHUB_REPOSITORY}" --draft --base main --head "${KRIC_REFRESH_BRANCH}" \
            --title "Refresh KRIC facility snapshot" \
            --body "Refresh the due KRIC facility snapshot through the current OCI operation.\n\nRefs #629, #39, #29"

      - name: KRIC current facility refresh / Upload sanitized evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kric-current-facility-refresh-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/kric-current-facility-refresh/decision.json
            ${{ runner.temp }}/kric-current-facility-refresh/${{ github.run_id }}/journal.json
            ${{ runner.temp }}/kric-current-facility-refresh/${{ github.run_id }}/raw-receipt.json
          if-no-files-found: ignore
          retention-days: 14
      - name: KRIC current facility refresh / Report refresh failure as an issue
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/ci/report-refresh-failure.mjs --workflow kric-current-facility-refresh.yml --repository "${GITHUB_REPOSITORY}" --run-id "${GITHUB_RUN_ID}"
