name: Data Pack Release Cross-Repository Chain

# release-candidate(RC)가 성공하면 hub 호환성 검증(release-artifacts.yml)을 dispatch한다(#932, #870).
# GITHUB_TOKEN은 다른 저장소 workflow를 dispatch할 수 없으므로 레포 간 실행 권한 GitHub App(QA 승인 2026-10-04)의
# 토큰을 쓴다. 토큰은 hub 저장소 한 곳, actions write 권한으로만 발급한다. App 자격 증명이 없으면 실패한다.
# 기본은 꺼짐이다. 저장소 변수 DATAPACK_CROSS_REPO_CHAIN_ENABLED가 true일 때만 job이 실행된다(App 등록·QA 승인 뒤 메인 세션이 켠다).
on:
  workflow_run:
    workflows: ["Data Pack Release"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: datapack-release-cross-repo-chain-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  compatibility:
    name: Dispatch hub data pack compatibility
    if: ${{ vars.DATAPACK_CROSS_REPO_CHAIN_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.path == '.github/workflows/datapack-release.yml' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # workflow_run은 기본 브랜치(main) 문맥에서 돈다. 검증 도구만 읽고 upstream run의 코드는 checkout하지 않는다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
      - name: Identify the release-candidate run
        id: rc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${RUN_ID}" =~ ^[1-9][0-9]*$ ]] || { echo "workflow_run id is invalid" >&2; exit 1; }
          [[ "${RUN_HEAD_SHA}" =~ ^[a-f0-9]{40}$ ]] || { echo "workflow_run head_sha is invalid" >&2; exit 1; }
          # RC run만 easysubway-datapack-candidate-<run> artifact를 만든다(hub promotion이 받는 후보 artifact).
          name="easysubway-datapack-candidate-${RUN_ID}"
          response="${RUNNER_TEMP}/${name}.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?name=${name}&per_page=100" > "${response}"
          total="$(node -e 'const p = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); if (!Number.isSafeInteger(p.total_count)) process.exit(1); process.stdout.write(String(p.total_count));' "${response}")"
          if [[ "${total}" == "0" ]]; then
            echo "rc=false" >> "${GITHUB_OUTPUT}"
            echo "Data Pack Release run ${RUN_ID}에 RC 후보 artifact가 없어 hub 호환성 검증을 dispatch하지 않는다." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          # publish 경로와 같은 검증기: 정확히 하나, 같은 run id·head sha, 만료되지 않음. 어긋나면 실패한다.
          node tools/ci/require-workflow-artifact.mjs "${response}" "${name}" "${RUN_ID}" "${RUN_HEAD_SHA}"
          echo "rc=true" >> "${GITHUB_OUTPUT}"
          echo "Data Pack Release run ${RUN_ID}(head ${RUN_HEAD_SHA})은 RC 후보 artifact가 있어 hub 호환성 검증을 dispatch한다." >> "${GITHUB_STEP_SUMMARY}"
      - name: Require cross-repository dispatch app credentials
        if: ${{ steps.rc.outputs.rc == 'true' }}
        env:
          APP_CLIENT_ID: ${{ secrets.EASYSUBWAY_RELEASE_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.EASYSUBWAY_RELEASE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${APP_CLIENT_ID:-}" ]] || missing+=(EASYSUBWAY_RELEASE_APP_CLIENT_ID)
          [[ -n "${APP_PRIVATE_KEY:-}" ]] || missing+=(EASYSUBWAY_RELEASE_APP_PRIVATE_KEY)
          if [[ "${#missing[@]}" -gt 0 ]]; then
            echo "cross-repository dispatch app credentials are missing: ${missing[*]}" >&2
            exit 1
          fi
      - name: Create the hub dispatch token
        id: app-token
        if: ${{ steps.rc.outputs.rc == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.EASYSUBWAY_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.EASYSUBWAY_RELEASE_APP_PRIVATE_KEY }}
          owner: AquilaXk
          repositories: easysubway
          permission-actions: write
      - name: Dispatch hub data pack compatibility
        if: ${{ steps.rc.outputs.rc == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh workflow run release-artifacts.yml --repo AquilaXk/easysubway --ref main -f android_rc_signing_mode=ci-self-signed -f datapack_candidate_run_id="${RUN_ID}"
          echo "hub release-artifacts.yml을 datapack_candidate_run_id=${RUN_ID}로 dispatch했다." >> "${GITHUB_STEP_SUMMARY}"
