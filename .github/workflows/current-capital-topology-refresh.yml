name: Current Capital Topology Refresh

on:
  schedule:
    - cron: "47 */2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: current-capital-topology-refresh-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Current topology refresh
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.19.0"
      - name: Prepare current topology refresh paths
        run: |
          set -euo pipefail
          operation_root="${RUNNER_TEMP}/current-capital-topology-refresh/${GITHUB_RUN_ID}"
          mkdir -p "${operation_root}"
          {
            printf 'TOPOLOGY_OPERATION_ROOT=%s\n' "${operation_root}"
            printf 'TOPOLOGY_DECISION=%s\n' "${RUNNER_TEMP}/current-capital-topology-refresh/decision.json"
            printf 'TOPOLOGY_MAIN_SHA=%s\n' "$(git rev-parse HEAD)"
          } >> "${GITHUB_ENV}"
      - name: Decide whether current topology refresh is due
        id: decision
        run: |
          set -euo pipefail
          state_root="${RUNNER_TEMP}/current-capital-topology-refresh"
          mkdir -p "${state_root}"
          main_sha="${TOPOLOGY_MAIN_SHA}"
          printf '[]\n' > "${state_root}/prs.json"
          printf '[]\n' > "${state_root}/claims.json"
          printf '[]\n' > "${state_root}/claim-evidence.json"
          node tools/ci/decide-current-capital-topology-refresh.mjs --inventory tools/datapack/source-inventory.json --candidate tools/datapack/release/candidate-build-spec.json --policy release/product-gates/datapack-freshness-sla.json --prs "${state_root}/prs.json" --claims "${state_root}/claims.json" --claim-evidence "${state_root}/claim-evidence.json" --repository "${GITHUB_REPOSITORY}" --current-main-sha "${main_sha}" --output "${TOPOLOGY_DECISION}" --github-output "${GITHUB_OUTPUT}"
      - name: Note current topology refresh waiting on ITX promotion
        if: ${{ steps.decision.outputs.state == 'WAIT_ITX_PROMOTION' }}
        run: |
          echo "::notice title=Current topology refresh::ITX evidence is inside its refresh window; waiting for the ITX promotion workflow to renew it."
      - name: Preflight immutable current topology identities
        id: preflight
        if: ${{ steps.decision.outputs.state == 'DUE' || steps.decision.outputs.state == 'EXPIRED' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PATHS: ${{ runner.temp }}/current-capital-topology-refresh/${{ github.run_id }}/existing-paths.txt
        run: |
          set -euo pipefail
          gh auth setup-git
          git fetch --no-tags origin main
          [[ "$(git rev-parse origin/main)" == "${TOPOLOGY_MAIN_SHA}" ]] || { echo "main changed before topology preflight" >&2; exit 1; }
          git ls-tree -r --name-only "${TOPOLOGY_MAIN_SHA}" > "${PATHS}"
          node --input-type=module -e 'import { readFile } from "node:fs/promises"; import { currentCapitalTopologyPreflight } from "./tools/ci/decide-current-capital-topology-refresh.mjs"; const existingPaths = (await readFile(process.env.PATHS, "utf8")).split("\n").filter(Boolean); const result = currentCapitalTopologyPreflight({ existingPaths }); process.stdout.write("state=" + result.state + "\n");' >> "${GITHUB_OUTPUT}"
      - name: Collect each official current topology input once
        if: ${{ (steps.decision.outputs.state == 'DUE' || steps.decision.outputs.state == 'EXPIRED') && steps.preflight.outputs.state == 'CLEAR' }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${TOPOLOGY_MAIN_SHA}" ]] || { echo "topology collector is not running from its source main" >&2; exit 1; }
          node tools/datapack/collect-capital-route-topology.mjs --download --output "${TOPOLOGY_OPERATION_ROOT}/capital-route-topology.json"
          node tools/datapack/collect-incheon-station-info.mjs --download --output "${TOPOLOGY_OPERATION_ROOT}/incheon-transit-station-info.json"
          station_stamp="$(node --input-type=module -e 'import { readFile, rename } from "node:fs/promises"; const root = process.env.TOPOLOGY_OPERATION_ROOT; const source = root + "/incheon-transit-station-info.json"; const snapshot = JSON.parse(await readFile(source, "utf8")); const capturedAt = snapshot.capturedAt; if (snapshot.sourceId !== "incheon-transit-station-info" || typeof capturedAt !== "string" || new Date(capturedAt).toISOString() !== capturedAt) throw new Error("station collector identity is invalid"); const stamp = capturedAt.slice(0, 10).replaceAll("-", ""); await rename(source, root + "/incheon-transit-station-info-" + stamp + ".json"); process.stdout.write(stamp);')"
          printf 'TOPOLOGY_STATION_SNAPSHOT=%s/incheon-transit-station-info-%s.json\n' "${TOPOLOGY_OPERATION_ROOT}" "${station_stamp}" >> "${GITHUB_ENV}"
          mkdir -p "${TOPOLOGY_OPERATION_ROOT}/timetables"
          node tools/datapack/collect-incheon-timetable.mjs --download --topology-snapshot "${TOPOLOGY_OPERATION_ROOT}/incheon-transit-station-info-${station_stamp}.json" --output-dir "${TOPOLOGY_OPERATION_ROOT}/timetables"

      - name: Derive immutable input identities from collector output
        if: ${{ (steps.decision.outputs.state == 'DUE' || steps.decision.outputs.state == 'EXPIRED') && steps.preflight.outputs.state == 'CLEAR' }}
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { readFile, readdir } from "node:fs/promises";
            const root = process.env.TOPOLOGY_OPERATION_ROOT;
            const read = async (name) => JSON.parse(await readFile(root + "/" + name, "utf8"));
            const utc = (value) => { if (typeof value !== "string" || new Date(value).toISOString() !== value) throw new Error("collector capturedAt is invalid"); return value.slice(0, 10).replaceAll("-", ""); };
            const seoul = (value) => new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul", year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(new Date(value)).filter(({ type }) => type !== "literal").map(({ value: part }) => part).join("");
            const capital = await read("capital-route-topology.json"); const incheon = JSON.parse(await readFile(process.env.TOPOLOGY_STATION_SNAPSHOT, "utf8"));
            if (capital.sourceId !== "capital-route-topology" || incheon.sourceId !== "incheon-transit-station-info") throw new Error("collector source identity is invalid");
            const timetableFiles = await readdir(root + "/timetables"); if (timetableFiles.length !== 2) throw new Error("collector timetable output count is invalid");
            const timetables = await Promise.all(timetableFiles.map(async (file) => [file, await read("timetables/" + file)]));
            const line1 = timetables.find(([, snapshot]) => snapshot.sourceId === "incheon-line1-train-timetable"); const line2 = timetables.find(([, snapshot]) => snapshot.sourceId === "incheon-line2-train-timetable");
            if (!line1 || !line2 || !/^incheon-line1-train-timetable-[0-9]{8}\.json$/u.test(line1[0]) || !/^incheon-line2-train-timetable-[0-9]{8}\.json$/u.test(line2[0])) throw new Error("collector timetable output identity is invalid");
            const line1Snapshot = line1[1]; const line2Snapshot = line2[1]; utc(line1Snapshot.capturedAt); utc(line2Snapshot.capturedAt);
            if (line1[0] !== "incheon-line1-train-timetable-" + seoul(line1Snapshot.capturedAt) + ".json" || line2[0] !== "incheon-line2-train-timetable-" + seoul(line2Snapshot.capturedAt) + ".json") throw new Error("collector timetable path identity is invalid");
            const values = [
              ["TOPOLOGY_CAPITAL_PATH", "tools/datapack/sources/capital-route-topology-" + utc(capital.capturedAt) + ".json", root + "/capital-route-topology.json"],
              ["TOPOLOGY_INCHEON_PATH", "tools/datapack/sources/incheon-transit-station-info-" + utc(incheon.capturedAt) + ".json", process.env.TOPOLOGY_STATION_SNAPSHOT],
              ["TOPOLOGY_LINE1_PATH", "tools/datapack/sources/incheon-line1-train-timetable-" + seoul(line1Snapshot.capturedAt) + ".json", root + "/timetables/" + line1[0]],
              ["TOPOLOGY_LINE2_PATH", "tools/datapack/sources/incheon-line2-train-timetable-" + seoul(line2Snapshot.capturedAt) + ".json", root + "/timetables/" + line2[0]],
              ["TOPOLOGY_REVERIFICATION_PATH", "tools/datapack/release/capital-topology-reverification-" + utc(capital.capturedAt) + ".json", ""],
            ];
            for (const [key, target, source] of values) { console.log(key + "=" + target); if (source) console.log(key + "_SOURCE=" + source); }
            console.log("TOPOLOGY_BUILD_NOW=" + new Date().toISOString());
          ' >> "${GITHUB_ENV}"
      - name: Commit exactly four immutable current topology inputs
        if: ${{ (steps.decision.outputs.state == 'DUE' || steps.decision.outputs.state == 'EXPIRED') && steps.preflight.outputs.state == 'CLEAR' }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${TOPOLOGY_MAIN_SHA}" ]] || { echo "topology input commit must start from its source main" >&2; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          input_keys=(TOPOLOGY_CAPITAL_PATH TOPOLOGY_INCHEON_PATH TOPOLOGY_LINE1_PATH TOPOLOGY_LINE2_PATH)
          input_targets=()
          for key in "${input_keys[@]}"; do
            target="${!key}"; source_key="${key}_SOURCE"; source="${!source_key}"
            [[ ! -e "${target}" ]] || { echo "topology target already exists" >&2; exit 1; }
            cp "${source}" "${target}"
            input_targets+=("${target}")
          done
          git add -- "${input_targets[@]}"
          mapfile -t input_paths < <(git diff --cached --name-only)
          [[ "${#input_paths[@]}" == "${#input_keys[@]}" ]] || { echo "topology collection changed an invalid component input count" >&2; exit 1; }
          for key in "${input_keys[@]}"; do required="${!key}"; printf '%s\n' "${input_paths[@]}" | grep -Fqx "${required}" || exit 1; done
          [[ -z "$(git diff --name-only)" && -z "$(git ls-files --others --exclude-standard)" ]] || { echo "topology collection changed an unsupported path" >&2; exit 1; }
          git commit -m "Register current topology inputs"
          printf 'TOPOLOGY_BUILDER_SHA=%s\n' "$(git rev-parse HEAD)" >> "${GITHUB_ENV}"
      - name: Derive current activation dependencies
        if: ${{ (steps.decision.outputs.state == 'DUE' || steps.decision.outputs.state == 'EXPIRED') && steps.preflight.outputs.state == 'CLEAR' }}
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const inventory = JSON.parse(await readFile("tools/datapack/source-inventory.json", "utf8")); const source = inventory.sources?.filter(({ id }) => id === "incheon-transit-accessibility");
            if (source?.length !== 1 || typeof source[0].registrationEvidence?.snapshotId !== "string" || !/^incheon-transit-accessibility-[0-9]{8}T[0-9]{9}Z$/u.test(source[0].registrationEvidence.snapshotId)) throw new Error("Incheon accessibility registration identity is invalid");
            console.log("TOPOLOGY_INCHEON_ACCESSIBILITY_PATH=tools/datapack/sources/" + source[0].registrationEvidence.snapshotId + ".json");
          ' >> "${GITHUB_ENV}"
      - name: Validate current activation dependencies
        if: ${{ (steps.decision.outputs.state == 'DUE' || steps.decision.outputs.state == 'EXPIRED') && steps.preflight.outputs.state == 'CLEAR' }}
        run: |
          set -euo pipefail
          [[ -f "${TOPOLOGY_INCHEON_ACCESSIBILITY_PATH}" && ! -e "${TOPOLOGY_REVERIFICATION_PATH}" ]] || { echo "topology activation dependency or target is invalid" >&2; exit 1; }
      - name: Activate current topology inputs exactly once
        if: ${{ (steps.decision.outputs.state == 'DUE' || steps.decision.outputs.state == 'EXPIRED') && steps.preflight.outputs.state == 'CLEAR' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # #862 결정 C: 원천 admission(inventory·reviewed pack·canonical pack·재검증 증거)까지만 만든다. 후보는 다시 만들지 않는다.
          node tools/datapack/activate-current-source-set.mjs --topology-source-admission --capital-topology "${TOPOLOGY_CAPITAL_PATH}" --incheon-topology "${TOPOLOGY_INCHEON_PATH}" --incheon-accessibility "${TOPOLOGY_INCHEON_ACCESSIBILITY_PATH}" --incheon-line1-timetable "${TOPOLOGY_LINE1_PATH}" --incheon-line2-timetable "${TOPOLOGY_LINE2_PATH}" --builder-git-sha "${TOPOLOGY_BUILDER_SHA}" --build-now "${TOPOLOGY_BUILD_NOW}"
          git add -- tools/datapack/source-inventory.json tools/datapack/release/capital-production-reviewed-pack.json tools/datapack/release/capital-production-canonical-pack.json "${TOPOLOGY_REVERIFICATION_PATH}"
          deleted="$(git diff --cached --name-only --diff-filter=D)"
          [[ -z "${deleted}" ]] || { echo "topology activation deleted a tracked path" >&2; exit 1; }
          mapfile -t activation_paths < <(git diff --cached --name-only --diff-filter=ACMR)
          [[ "${#activation_paths[@]}" -gt 0 ]] || { echo "topology activation must change a nonempty subset of the four source admission paths" >&2; exit 1; }
          printf '%s\n' "${activation_paths[@]}" | grep -Fqx "${TOPOLOGY_REVERIFICATION_PATH}" || { echo "topology activation is missing its create-once reverification" >&2; exit 1; }
          allowed_activation_paths=(tools/datapack/source-inventory.json tools/datapack/release/capital-production-reviewed-pack.json tools/datapack/release/capital-production-canonical-pack.json "${TOPOLOGY_REVERIFICATION_PATH}")
          for changed in "${activation_paths[@]}"; do printf '%s\n' "${allowed_activation_paths[@]}" | grep -Fqx "${changed}" || { echo "topology activation changed an unsupported path" >&2; exit 1; }; done
          git commit -m "Activate current topology inputs"
          node tools/datapack/activate-current-source-set.mjs --topology-source-admission --check --capital-topology "${TOPOLOGY_CAPITAL_PATH}" --incheon-topology "${TOPOLOGY_INCHEON_PATH}" --incheon-accessibility "${TOPOLOGY_INCHEON_ACCESSIBILITY_PATH}" --incheon-line1-timetable "${TOPOLOGY_LINE1_PATH}" --incheon-line2-timetable "${TOPOLOGY_LINE2_PATH}" --builder-git-sha "${TOPOLOGY_BUILDER_SHA}" --build-now "${TOPOLOGY_BUILD_NOW}"
          [[ -z "$(git diff --name-only)" && -z "$(git ls-files --others --exclude-standard)" ]] || { echo "topology activation changed an unsupported path" >&2; exit 1; }
          node tools/ci/refresh-automation-pr.mjs body --stage capital-topology-refresh --base-sha "${TOPOLOGY_MAIN_SHA}" --head-sha "$(git rev-parse HEAD)" --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --summary "Refresh due current capital and Incheon topology inputs." --refs "Direct main commit" --output "${TOPOLOGY_OPERATION_ROOT}/commit-summary.md"
          cat "${TOPOLOGY_OPERATION_ROOT}/commit-summary.md" >> "${GITHUB_STEP_SUMMARY}"
          gh auth setup-git
          git fetch --no-tags origin main
          [[ "$(git rev-parse origin/main)" == "${TOPOLOGY_MAIN_SHA}" ]] || { echo "topology target main changed before push" >&2; exit 1; }
          git push origin HEAD:main
      - name: Upload sanitized decision metadata
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: current-capital-topology-refresh-${{ github.run_id }}
          path: ${{ runner.temp }}/current-capital-topology-refresh/decision.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Report refresh failure summary
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/ci/report-refresh-failure.mjs --workflow current-capital-topology-refresh.yml --repository "${GITHUB_REPOSITORY}" --run-id "${GITHUB_RUN_ID}"
