name: Source Reachability Probe

# hub AquilaXk/easysubway#3036: GitHub 호스티드 러너(미국)에서 공공 원천 호스트의 연결 성공률·단계별 지연(dns·connect·tls·first-byte)을 잰다.
# 서울 k3s CronJob(platform source-reachability-probe-deploy)과 같은 스크립트(platform tools/ops/source-reachability-probe.mjs)를 같은 커밋으로 받아 쓴다.
# - 키·토큰·쿠키 없이 호스트 루트에 HEAD 한 번만 보낸다. 환경 비밀·쓰기 권한이 없고 저장소·PR·이슈를 바꾸지 않는다(contents: read).
# - 한 번의 실행은 10분 간격 6라운드(약 50분)이고 매시 시작한다. 호스트당 요청은 10분에 1회다.
# - 정기 실행은 저장소 변수 SOURCE_REACHABILITY_PROBE가 true일 때만 돈다(기본 꺼짐). 사람 dispatch는 항상 한 번 돈다.
# - 측정 기간(KST 17~23시를 포함한 24~48시간)이 끝나면 변수를 false로 바꾸거나 이 workflow와 테스트를 지운다.
# - 결과는 JSON Lines artifact와 요약 표다. 실패는 기록으로 남길 뿐 job을 실패시키지 않는다(도달 실패가 측정 대상이다).
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: source-reachability-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Source reachability from GitHub-hosted runner
    if: ${{ github.event_name == 'workflow_dispatch' || vars.SOURCE_REACHABILITY_PROBE == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - name: Checkout the shared probe script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: AquilaXk/easysubway-platform
          ref: 4c03afebe93c48f8ee9cdca98ce797d4848629ad
          path: platform-probe
          sparse-checkout: tools/ops/source-reachability-probe.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
      - name: Probe source reachability from this runner
        run: |
          set -euo pipefail
          node platform-probe/tools/ops/source-reachability-probe.mjs --vantage gha-us-hosted --rounds 6 --interval-seconds 600 --output "${RUNNER_TEMP}/gha-us-hosted-probe.jsonl"
      - name: Summarize the measurements
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [[ -s "${RUNNER_TEMP}/gha-us-hosted-probe.jsonl" ]]; then
            node platform-probe/tools/ops/source-reachability-probe.mjs summarize "${RUNNER_TEMP}/gha-us-hosted-probe.jsonl" >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Upload the measurements
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-reachability-gha-us-hosted-${{ github.run_id }}
          path: ${{ runner.temp }}/gha-us-hosted-probe.jsonl
          if-no-files-found: ignore
          retention-days: 30
