name: KRIC EXIT Path Provider Snapshot

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: kric-exit-path-provider-snapshot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Collect KRIC EXIT path provider snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"

      - name: Build current KRIC EXIT plan
        run: |
          set -euo pipefail
          node tools/datapack/build-current-kric-exit-collection-plan.mjs \
            --canonical-pack "${GITHUB_WORKSPACE}/tools/datapack/release/capital-production-canonical-pack.json" \
            --coverage-targets "${GITHUB_WORKSPACE}/tools/datapack/nationwide-coverage-targets.json" \
            --provider-code-catalog "${GITHUB_WORKSPACE}/tools/datapack/sources/kric-provider-code-catalog-20260228.json" \
            --route-rosters "${GITHUB_WORKSPACE}/tools/datapack/sources/kric-nationwide-route-rosters-20260730T203926676Z.json" \
            --source-inventory "${GITHUB_WORKSPACE}/tools/datapack/source-inventory.json" \
            --incheon-topology "${GITHUB_WORKSPACE}/tools/datapack/sources/incheon-transit-station-info-20260813.json" \
            --coverage-selector capital-seoul-metro-production \
            --output "${RUNNER_TEMP}/current-kric-exit-plan.json"

      - name: Collect current KRIC EXIT snapshot
        env:
          KRIC_SERVICE_KEY: ${{ secrets.KRIC_SERVICE_KEY }}
        run: |
          set -euo pipefail
          node tools/datapack/collect-current-kric-exit-path-provider-snapshot.mjs \
            --collection-plan "${RUNNER_TEMP}/current-kric-exit-plan.json" \
            --source-id kric-station-movement-standard \
            --output "${RUNNER_TEMP}/current-kric-exit-snapshot.json" \
            --request-timeout-ms 30000 \
            --request-interval-ms 250

      - name: Upload immutable KRIC EXIT snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kric-exit-path-provider-snapshot-${{ github.run_id }}
          path: ${{ runner.temp }}/current-kric-exit-snapshot.json
          if-no-files-found: error
          retention-days: 14
