name: Seoul Current Accessibility Refresh

on:
  schedule:
    - cron: "31 */2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: seoul-current-accessibility-refresh-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    environment: datapack-release-check
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.19.0"
      - name: Prepare paths
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/seoul-current-accessibility-refresh/${GITHUB_RUN_ID}"
          {
            printf 'SEOUL_REFRESH_DECISION=%s\n' "${RUNNER_TEMP}/seoul-current-accessibility-refresh/decision.json"
            printf 'SEOUL_REFRESH_RECEIPT=%s\n' "${RUNNER_TEMP}/seoul-current-accessibility-refresh/${GITHUB_RUN_ID}/receipt.json"
            printf 'SEOUL_REFRESH_MAIN_SHA=%s\n' "$(git rev-parse HEAD)"
          } >> "${GITHUB_ENV}"
      - name: Read due state
        id: decision
        run: |
          set -euo pipefail
          prs="${RUNNER_TEMP}/seoul-current-accessibility-refresh/open-prs.json"
          claims="${RUNNER_TEMP}/seoul-current-accessibility-refresh/claims.txt"
          claim_evidence="${RUNNER_TEMP}/seoul-current-accessibility-refresh/claim-evidence.json"
          printf '[]\n' > "${prs}"
          : > "${claims}"
          printf '[]\n' > "${claim_evidence}"
          node tools/ci/decide-current-seoul-accessibility-refresh.mjs --inventory tools/datapack/source-inventory.json --policy release/product-gates/datapack-freshness-sla.json --prs "${prs}" --claims "${claims}" --claim-evidence "${claim_evidence}" --repository "${GITHUB_REPOSITORY}" --output "${SEOUL_REFRESH_DECISION}" --github-output "${GITHUB_OUTPUT}"
      - name: Validate provider configuration
        if: ${{ steps.decision.outputs.state == 'DUE' || steps.decision.outputs.state == 'EXPIRED' }}
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL: ${{ secrets.EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL }}
        run: |
          set -euo pipefail
          [[ -n "${DATA_GO_KR_SERVICE_KEY:-}" && "${DATA_GO_KR_SERVICE_KEY}" != *$'\n'* && "${DATA_GO_KR_SERVICE_KEY}" != *$'\r'* ]] || { echo "DATA_GO_KR_SERVICE_KEY must be a nonempty single line" >&2; exit 1; }
          [[ -n "${EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL:-}" && "${EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL}" != *$'\n'* && "${EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL}" != *$'\r'* ]] || { echo "EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL must be a nonempty single line" >&2; exit 1; }
      - name: Collect current snapshot
        if: ${{ steps.decision.outputs.state == 'DUE' || steps.decision.outputs.state == 'EXPIRED' }}
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL: ${{ secrets.EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL }}
        run: |
          set -euo pipefail
          # #1326: 일시 오류(timeout·연결 reset·HTTP 429/502/503/504)는 수집기가 같은 GET을 최대 3번 시도하고 소진하면 그대로 실패한다. workflow는 재시도를 감싸지 않는다.
          # #995: 공급자 수집과 observation 기록까지만 한다. OCI에는 아무것도 올리지 않는다(이 step이 실패하면 게시된 것이 없다).
          [[ "$(git rev-parse HEAD)" == "${SEOUL_REFRESH_MAIN_SHA}" ]] || { echo "Seoul refresh operation is not running from its source main" >&2; exit 1; }
          node tools/datapack/run-current-seoul-accessibility-registration.mjs --observation-name "refresh-${GITHUB_RUN_ID}" --receipt "${SEOUL_REFRESH_RECEIPT}" --phase collect
      - name: Publish and register Seoul accessibility snapshot
        id: publish
        if: ${{ steps.decision.outputs.state == 'DUE' || steps.decision.outputs.state == 'EXPIRED' }}
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL: ${{ secrets.EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # #995: 수집 step이 남긴 observation을 OCI에 게시하고 원장에 등록한다. 게시 직전 origin/main 이동 여부를 먼저 검사한다.
          [[ "$(git rev-parse HEAD)" == "${SEOUL_REFRESH_MAIN_SHA}" ]] || { echo "Seoul refresh operation is not running from its source main" >&2; exit 1; }
          gh auth setup-git
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "${SEOUL_REFRESH_MAIN_SHA}" ]] || { echo "Seoul refresh source main changed before publish" >&2; exit 1; }
          node tools/datapack/run-current-seoul-accessibility-registration.mjs --observation-name "refresh-${GITHUB_RUN_ID}" --receipt "${SEOUL_REFRESH_RECEIPT}" --phase publish
      - name: Commit and push Seoul accessibility refresh
        if: ${{ steps.decision.outputs.state == 'DUE' || steps.decision.outputs.state == 'EXPIRED' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${SEOUL_REFRESH_MAIN_SHA}" ]] || { echo "Seoul refresh commit must stay on its source main" >&2; exit 1; }
          mapfile -t untracked < <(git ls-files --others --exclude-standard)
          [[ "${#untracked[@]}" == "1" ]] || { echo "Seoul refresh produced an unexpected untracked file count" >&2; exit 1; }
          [[ "${untracked[0]}" =~ ^tools/datapack/sources/seoul-metro-accessibility-[^/]+\.json$ ]] || { echo "Seoul refresh created an unsupported untracked file" >&2; exit 1; }
          git add -- "${untracked[0]}" tools/datapack/source-inventory.json tools/datapack/release/source-snapshots.json tools/datapack/inputs/capital-pilot-production-source-input.json
          [[ -z "$(git diff --name-only)" ]] || { echo "Seoul refresh modified an unallowed tracked path" >&2; exit 1; }
          changed="$(git diff --cached --name-only --diff-filter=ACMR)"; deleted="$(git diff --cached --name-only --diff-filter=D)"; [[ -z "${deleted}" ]] || { echo "Seoul refresh removed a tracked input" >&2; exit 1; }
          source_count="$(grep -Ec '^tools/datapack/sources/seoul-metro-accessibility-[^/]+\.json$' <<< "${changed}" || true)"; [[ "${source_count}" == "1" ]] || { echo "Seoul refresh produced an incomplete output" >&2; exit 1; }
          expected=$'tools/datapack/source-inventory.json\ntools/datapack/release/source-snapshots.json\ntools/datapack/inputs/capital-pilot-production-source-input.json'
          while IFS= read -r required; do [[ "$(grep -Fxc "${required}" <<< "${changed}")" == "1" ]] || { echo "Seoul refresh produced an incomplete output" >&2; exit 1; }; done <<< "${expected}"
          unexpected="$(printf '%s\n' "${changed}" | grep -Ev '^(tools/datapack/sources/seoul-metro-accessibility-[^/]+\.json|tools/datapack/source-inventory\.json|tools/datapack/release/source-snapshots\.json|tools/datapack/inputs/capital-pilot-production-source-input\.json)$' || true)"
          [[ -z "${unexpected}" ]] && [[ "$(wc -l <<< "${changed}" | tr -d ' ')" == "4" ]] || { echo "Seoul refresh changed an unsupported path" >&2; exit 1; }
          git diff --cached --quiet && exit 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh Seoul accessibility snapshot"
          summary_file="${RUNNER_TEMP}/seoul-current-accessibility-refresh/commit-summary-${GITHUB_RUN_ID}.md"
          node tools/ci/refresh-automation-pr.mjs body --stage seoul-accessibility-refresh --base-sha "${SEOUL_REFRESH_MAIN_SHA}" --head-sha "$(git rev-parse HEAD)" --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --summary "Refresh the due Seoul accessibility snapshot through the current OCI operation." --refs "Direct main commit" --output "${summary_file}"
          cat "${summary_file}" >> "${GITHUB_STEP_SUMMARY}"
          gh auth setup-git
          git fetch --no-tags origin main
          [[ "$(git rev-parse origin/main)" == "${SEOUL_REFRESH_MAIN_SHA}" ]] || { echo "Seoul refresh target main changed before push" >&2; exit 1; }
          git push origin HEAD:main
      - name: Upload sanitized evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: seoul-current-accessibility-refresh-${{ github.run_id }}
          path: ${{ runner.temp }}/seoul-current-accessibility-refresh/decision.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Report refresh failure summary
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/ci/report-refresh-failure.mjs --workflow seoul-current-accessibility-refresh.yml --repository "${GITHUB_REPOSITORY}" --run-id "${GITHUB_RUN_ID}"
