name: Nationwide Candidate Refresh

# 전국 후보 갱신(#927, #870): 로컬에서 돌리던 refresh-nationwide-candidate를 CI에서 실행하고
# 결과를 automation 브랜치의 draft PR로 올린다. 원천 수집·등록은 하지 않는다(저장소 파일만 읽는다).
# 사람 dispatch는 2인 역할을 입력으로만 받는다. 정기 실행(#929 D3)은 정기 전용 고정 역할과 다음 sequence를 쓰고,
# 저장소 변수 DATAPACK_SCHEDULED_CANDIDATE_REFRESH가 true일 때만 돈다. 후보 시계는 실행 시각이고,
# release request에는 이 run 기록(gateRun)을 결속한다.
# #1032: GitHub schedule은 몇 시간씩 밀리므로 외부 스케줄러 App(easysubway-release-chain[bot])이 입력 없이 workflow_dispatch로 깨울 수 있다.
# 정기 역할은 schedule 이벤트와 이 App의 dispatch에서만 인정된다(plan이 github.triggering_actor로 판정하고 gateRun에 actor를 결속한다).
# 사람 dispatch는 지금처럼 항상 돌고 2인 역할을 입력으로 받는다. 입력이 선택인 것은 App이 입력 없이 깨우기 때문이며, 사람 입력이 비면 plan이 실패한다.
# #969: 정기 실행은 2시간마다 돌며, 후보가 읽은 입력 매니페스트가 지금 작업 트리와 다를 때(STALE)만 후보를 만든다. 같으면(CURRENT) 아무것도 하지 않는다.
# 정기 역할이 schedule 이벤트와 스케줄러 App dispatch 전용이라 push·workflow_run 트리거는 쓰지 않는다. 열린 후보 PR이 있으면 새로 만들지 않고,
# 원장을 쓰는 자동화 PR이 열려 있으면 기다린다. 기다림에는 상한(PT2H, #1032)이 있다: 멈춘 PR·claim은 기다리지 않고 경고로 남긴다.
on:
  schedule:
    - cron: "29 */2 * * *"
  workflow_dispatch:
    inputs:
      releaseSequence:
        description: 새 후보의 releaseSequence(커밋된 후보보다 커야 한다). 사람 dispatch는 필수이고 스케줄러 App dispatch는 비운다
        required: false
        type: string
      requestedBy:
        description: 요청 역할(예 data-operator-lead). 사람 dispatch는 필수이고 스케줄러 App dispatch는 비운다
        required: false
        type: string
      approvedBy:
        description: 승인 역할(요청 역할과 달라야 한다, 예 data-release-authority). 사람 dispatch는 필수이고 스케줄러 App dispatch는 비운다
        required: false
        type: string

permissions: {}

concurrency:
  group: nationwide-candidate-refresh-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Nationwide candidate refresh
    if: ${{ github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && github.triggering_actor != 'easysubway-release-chain[bot]') || vars.DATAPACK_SCHEDULED_CANDIDATE_REFRESH == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
      - name: Decide whether the nationwide candidate must be refreshed
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          decision_root="${RUNNER_TEMP}/nationwide-candidate-refresh-decision/${GITHUB_RUN_ID}"
          mkdir -p "${decision_root}"
          git ls-remote --heads origin "refs/heads/automation/927-nationwide-candidate-refresh-*" > "${decision_root}/branches.txt"
          git ls-remote --heads origin "refs/heads/automation/*" > "${decision_root}/automation-branches.txt"
          node tools/ci/collect-automation-prs.mjs --repository "${GITHUB_REPOSITORY}" --refs "${decision_root}/automation-branches.txt" --pr-limit 1000 --output "${decision_root}/prs.json"
          node tools/ci/decide-nationwide-candidate-refresh.mjs --event "${EVENT_NAME}" --actor "${ACTOR}" --repository "${GITHUB_REPOSITORY}" --prs "${decision_root}/prs.json" --branches "${decision_root}/branches.txt" --automation-branches "${decision_root}/automation-branches.txt" --github-output "${GITHUB_OUTPUT}"
      - name: Note candidate refresh proceeding past stuck source automation
        if: ${{ steps.decision.outputs.expired_blockers != '' }}
        env:
          EXPIRED_BLOCKERS: ${{ steps.decision.outputs.expired_blockers }}
        run: |
          echo "::warning title=Nationwide candidate refresh::source-ledger automation ${EXPIRED_BLOCKERS} has been open longer than the wait limit, so the candidate refresh no longer waits for it. The owning workflow reports it; if it merges later the next run refreshes the candidate again."
      - name: Mint App token for the open refresh pull request
        id: app-token-open
        if: ${{ steps.decision.outputs.state == 'OPEN_PR' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.EASYSUBWAY_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.EASYSUBWAY_RELEASE_APP_PRIVATE_KEY }}
          owner: AquilaXk
          repositories: easysubway-data
          permission-pull-requests: write
      - name: Ensure required CI on the open refresh pull request
        id: required-ci
        if: ${{ steps.decision.outputs.state == 'OPEN_PR' }}
        env:
          GH_TOKEN: ${{ github.token }}
          APP_PR_TOKEN: ${{ steps.app-token-open.outputs.token }}
        run: |
          set -euo pipefail
          # #939: head에 pull_request CI가 없으면 그 PR만 App으로 닫았다 다시 열어 CI를 실행한다(이미 있으면 아무것도 하지 않는다). #969: CI가 실패했으면 바로 실패한다.
          node tools/ci/refresh-pr-required-ci.mjs --workflow nationwide-candidate-refresh.yml --repository "${GITHUB_REPOSITORY}" --github-output "${GITHUB_OUTPUT}"
      - name: Enforce open refresh pull request age limit
        if: ${{ steps.decision.outputs.state == 'OPEN_PR' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CI_STATE: ${{ steps.required-ci.outputs.state }}
        run: |
          set -euo pipefail
          # #939: 열린 후보 PR이 정책 manualCheckCadence를 넘기면 실패해 실패 보고(report-refresh-failure)로 드러낸다.
          open_prs="${RUNNER_TEMP}/open-refresh-prs-${GITHUB_RUN_ID}.json"
          gh pr list --repo "${GITHUB_REPOSITORY}" --state open --base main --limit 1000 --json number,url,createdAt,headRefName,baseRefName,isCrossRepository > "${open_prs}"
          node tools/ci/refresh-open-pr-age.mjs --workflow nationwide-candidate-refresh.yml --prs "${open_prs}" --policy release/product-gates/datapack-freshness-sla.json --repository "${GITHUB_REPOSITORY}" --ci-state "${CI_STATE}"
      - name: Note candidate refresh waiting on a pending source pull request
        if: ${{ steps.decision.outputs.state == 'BLOCKED_BY_PENDING_PR' }}
        env:
          STALE_PATHS: ${{ steps.decision.outputs.stale_paths }}
          BLOCKED_BY: ${{ steps.decision.outputs.blocked_by }}
        run: |
          echo "::notice title=Nationwide candidate refresh::candidate inputs changed (${STALE_PATHS}) but source-ledger automation pull request(s) ${BLOCKED_BY} are still open; the candidate is refreshed after they merge."
      - name: Remove stale candidate refresh branches named by the decision
        if: ${{ steps.decision.outputs.cleanup_branches != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CLEANUP_BRANCHES: ${{ steps.decision.outputs.cleanup_branches }}
        run: |
          set -euo pipefail
          # 이전 실행이 남긴 후보 브랜치(PR 없음·닫힌 PR)는 사람이 지울 일이 아니다(이슈 #973). 판정이 알린 것만, 열린 PR이 없을 때만 지운다.
          gh auth setup-git
          IFS=',' read -r -a stale_branches <<< "${CLEANUP_BRANCHES}"
          for stale_branch in "${stale_branches[@]}"; do
            [[ "${stale_branch}" =~ ^automation/927-nationwide-candidate-refresh-[1-9][0-9]*$ ]] || { echo "stale candidate branch name is invalid" >&2; exit 1; }
            [[ "$(gh pr list --repo "${GITHUB_REPOSITORY}" --state open --head "${stale_branch}" --json number --jq 'length')" == "0" ]] || { echo "stale candidate branch has an open pull request" >&2; exit 1; }
            git push origin --delete "${stale_branch}"
            echo "::notice title=Nationwide candidate refresh::removed stale candidate branch ${stale_branch}"
          done
      - name: Validate candidate refresh inputs
        id: plan
        if: ${{ steps.decision.outputs.state == 'STALE' || steps.decision.outputs.state == 'FORCED' }}
        env:
          RELEASE_SEQUENCE: ${{ inputs.releaseSequence }}
          REQUESTED_BY: ${{ inputs.requestedBy }}
          APPROVED_BY: ${{ inputs.approvedBy }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          node tools/ci/plan-datapack-release-chain.mjs candidate-refresh --release-sequence "${RELEASE_SEQUENCE}" --requested-by "${REQUESTED_BY}" --approved-by "${APPROVED_BY}" --event "${EVENT_NAME}" --actor "${ACTOR}" --github-output "${GITHUB_OUTPUT}"
      - name: Record the candidate gate run
        if: ${{ steps.decision.outputs.state == 'STALE' || steps.decision.outputs.state == 'FORCED' }}
        run: |
          set -euo pipefail
          node tools/ci/plan-datapack-release-chain.mjs gate-run --output "${RUNNER_TEMP}/candidate-gate-run.json"
      - name: Refresh nationwide candidate
        if: ${{ steps.decision.outputs.state == 'STALE' || steps.decision.outputs.state == 'FORCED' }}
        env:
          EVALUATED_AT: ${{ steps.plan.outputs.evaluated_at }}
          RELEASE_SEQUENCE: ${{ steps.plan.outputs.release_sequence }}
          REQUESTED_BY: ${{ steps.plan.outputs.requested_by }}
          APPROVED_BY: ${{ steps.plan.outputs.approved_by }}
          # #942: 후보 입력 매니페스트의 바이트를 OCI candidate-inputs/sha256/에 올린다.
          EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL: ${{ secrets.EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL }}
        run: |
          set -euo pipefail
          node tools/datapack/refresh-nationwide-candidate.mjs --evaluated-at "${EVALUATED_AT}" --release-sequence "${RELEASE_SEQUENCE}" --requested-by "${REQUESTED_BY}" --approved-by "${APPROVED_BY}" --gate-run "${RUNNER_TEMP}/candidate-gate-run.json"
      - name: Verify candidate refresh output scope
        if: ${{ steps.decision.outputs.state == 'STALE' || steps.decision.outputs.state == 'FORCED' }}
        run: |
          set -euo pipefail
          # 출력 목록은 후보 갱신 도구가 선언한 NATIONWIDE_CANDIDATE_REFRESH_OUTPUTS뿐이다. 목록을 못 읽으면 여기서 실패한다.
          output_list="$(node --input-type=module -e 'import { NATIONWIDE_CANDIDATE_REFRESH_OUTPUTS } from "./tools/datapack/refresh-nationwide-candidate.mjs"; console.log(NATIONWIDE_CANDIDATE_REFRESH_OUTPUTS.join("\n"));')"
          outputs=()
          while IFS= read -r output; do [[ -n "${output}" ]] && outputs+=("${output}"); done <<< "${output_list}"
          [[ "${#outputs[@]}" -gt 0 ]] || { echo "candidate refresh output list is empty" >&2; exit 1; }
          git add -- "${outputs[@]}"
          unstaged="$(git diff --name-only)"
          untracked="$(git ls-files --others --exclude-standard)"
          [[ -z "${unstaged}" && -z "${untracked}" ]] || { echo "candidate refresh changed a path outside its outputs" >&2; exit 1; }
          # git diff --quiet: 0 변화 없음, 1 변화 있음. 그 밖의 종료 코드는 오류로 실패한다.
          set +e
          git diff --cached --quiet
          diff_status=$?
          set -e
          case "${diff_status}" in
            0) echo "candidate refresh produced no change" >&2; exit 1 ;;
            1) ;;
            *) echo "candidate refresh staged diff check failed (git diff exit ${diff_status})" >&2; exit "${diff_status}" ;;
          esac
      - name: Recheck that no source-ledger automation is pending before pushing
        id: recheck
        if: ${{ steps.decision.outputs.state == 'STALE' || steps.decision.outputs.state == 'FORCED' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 후보 생성은 길다. 그 사이 원장을 쓰는 자동화(열린 PR·PR 전의 claim 브랜치)가 시작됐으면 이 결과를 올리지 않고 다음 실행에 맡긴다(#974 리뷰 F2).
          recheck_root="${RUNNER_TEMP}/nationwide-candidate-refresh-recheck/${GITHUB_RUN_ID}"
          mkdir -p "${recheck_root}"
          git ls-remote --heads origin "refs/heads/automation/*" > "${recheck_root}/automation-branches.txt"
          node tools/ci/collect-automation-prs.mjs --repository "${GITHUB_REPOSITORY}" --refs "${recheck_root}/automation-branches.txt" --pr-limit 1000 --output "${recheck_root}/prs.json"
          node tools/ci/ledger-writers-idle.mjs --repository "${GITHUB_REPOSITORY}" --prs "${recheck_root}/prs.json" --automation-branches "${recheck_root}/automation-branches.txt" --max-age "PT2H" --github-output "${GITHUB_OUTPUT}"
      - name: Note candidate refresh superseded by pending source automation
        if: ${{ (steps.decision.outputs.state == 'STALE' || steps.decision.outputs.state == 'FORCED') && steps.recheck.outputs.idle == 'false' }}
        env:
          BLOCKED_BY: ${{ steps.recheck.outputs.blocked_by }}
        run: |
          echo "::notice title=Nationwide candidate refresh::source-ledger automation (${BLOCKED_BY}) started while the candidate was being built; nothing was pushed and the next run decides again."
      - name: Commit and push candidate refresh branch
        if: ${{ (steps.decision.outputs.state == 'STALE' || steps.decision.outputs.state == 'FORCED') && steps.recheck.outputs.idle == 'true' }}
        env:
          EVALUATED_AT: ${{ steps.plan.outputs.evaluated_at }}
          RELEASE_SEQUENCE: ${{ steps.plan.outputs.release_sequence }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="automation/927-nationwide-candidate-refresh-${GITHUB_RUN_ID}"
          git switch -c "${branch}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'CANDIDATE_BASE_SHA=%s\n' "$(git rev-parse HEAD)" >> "${GITHUB_ENV}"
          git commit -m "[Data] 전국 후보 재생성(releaseSequence ${RELEASE_SEQUENCE}, 후보 시계 ${EVALUATED_AT})"
          printf 'CANDIDATE_HEAD_SHA=%s\n' "$(git rev-parse HEAD)" >> "${GITHUB_ENV}"
          gh auth setup-git
          git push origin "${branch}"
          printf 'CANDIDATE_BRANCH=%s\n' "${branch}" >> "${GITHUB_ENV}"
      - name: Mint App token for the candidate refresh pull request
        id: app-token-pr
        if: ${{ (steps.decision.outputs.state == 'STALE' || steps.decision.outputs.state == 'FORCED') && steps.recheck.outputs.idle == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.EASYSUBWAY_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.EASYSUBWAY_RELEASE_APP_PRIVATE_KEY }}
          owner: AquilaXk
          repositories: easysubway-data
          permission-pull-requests: write
      - name: Create candidate refresh pull request
        if: ${{ (steps.decision.outputs.state == 'STALE' || steps.decision.outputs.state == 'FORCED') && steps.recheck.outputs.idle == 'true' }}
        env:
          APP_PR_TOKEN: ${{ steps.app-token-pr.outputs.token }}
          STALE_PATHS: ${{ steps.decision.outputs.stale_paths }}
          EVALUATED_AT: ${{ steps.plan.outputs.evaluated_at }}
          RELEASE_SEQUENCE: ${{ steps.plan.outputs.release_sequence }}
          REQUESTED_BY: ${{ steps.plan.outputs.requested_by }}
          APPROVED_BY: ${{ steps.plan.outputs.approved_by }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -n "${STALE_PATHS}" ]]; then reason="후보 입력 변경(${STALE_PATHS})"; else reason="사람 dispatch(명시 요청)"; fi
          # #986 F4: 이 PR이 바꾼 경로 전체를 증거 블록에 싣는다(2단계 정책이 API diff와 정확히 대조한다).
          changed_paths="${RUNNER_TEMP}/candidate-changed-paths.txt"
          git diff --name-only "${CANDIDATE_BASE_SHA}" "${CANDIDATE_HEAD_SHA}" > "${changed_paths}"
          evidence_block="$(node tools/ci/automation-pr-evidence.mjs candidate-refresh-block --build-spec tools/datapack/release/candidate-build-spec.json --changed-paths "${changed_paths}" --base-sha "${CANDIDATE_BASE_SHA}" --head-sha "${CANDIDATE_HEAD_SHA}" --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          body="$(printf '%s\n' \
            "## Summary" \
            "" \
            "- CI가 \`refresh-nationwide-candidate.mjs\`로 전국 후보를 다시 만들었다." \
            "- releaseSequence: ${RELEASE_SEQUENCE}" \
            "- 후보 시계(evaluatedAt): ${EVALUATED_AT}" \
            "- 요청 역할: ${REQUESTED_BY}, 승인 역할: ${APPROVED_BY}" \
            "- 시작 사유: ${reason}" \
            "- 실행 run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "" \
            "이 PR이 main에 들어오면 \`datapack-release-candidate-chain.yml\`이 release-candidate를 실행한다." \
            "" \
            "Refs #927" \
            "Refs #870" \
            "" \
            "${evidence_block}")"
          # #939: App이 연 PR이라야 pull_request CI가 required check로 붙는다(GITHUB_TOKEN PR은 action_required, dispatch CI는 인정 안 됨).
          pr_url="$(GH_TOKEN="${APP_PR_TOKEN}" gh pr create --repo "${GITHUB_REPOSITORY}" --draft --base main --head "${CANDIDATE_BRANCH}" --title "[Data] 전국 후보 재생성(releaseSequence ${RELEASE_SEQUENCE}, 후보 시계 ${EVALUATED_AT})" --body "${body}")"
          printf 'CANDIDATE_PR_URL=%s\n' "${pr_url}" >> "${GITHUB_ENV}"
      - name: Remove the candidate refresh branch after a later failure
        if: ${{ (failure() || cancelled()) && env.CANDIDATE_BRANCH != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # push 뒤 단계(App 토큰 발급·PR 생성)가 실패하면 남은 automation 브랜치와 CI 없는 PR을 정리한다. job은 실패로 남는다.
          if [[ -n "${CANDIDATE_PR_URL:-}" ]]; then
            gh pr close "${CANDIDATE_PR_URL}" --repo "${GITHUB_REPOSITORY}" --delete-branch --comment "후보 갱신 run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}이 PR 생성 뒤 실패해 이 PR과 브랜치를 정리한다."
          else
            git push origin --delete "${CANDIDATE_BRANCH}"
          fi
      - name: Report refresh failure as an issue
        if: ${{ failure() || cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/ci/report-refresh-failure.mjs --workflow nationwide-candidate-refresh.yml --repository "${GITHUB_REPOSITORY}" --run-id "${GITHUB_RUN_ID}"
