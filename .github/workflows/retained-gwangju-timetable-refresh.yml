name: Retained Gwangju Timetable Refresh

on:
  schedule:
    - cron: "43 */2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: retained-gwangju-timetable-refresh-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
      issues: write
    environment: datapack-release-check
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
      - name: Read retained timetable due state
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state_root="${RUNNER_TEMP}/retained-gwangju-timetable-refresh/${GITHUB_RUN_ID}"
          mkdir -p "${state_root}"
          node tools/ci/decide-retained-gwangju-timetable-refresh.mjs > "${state_root}/due.json"
          git ls-remote --heads origin "refs/heads/automation/504-retained-gwangju-timetable-refresh-*" > "${state_root}/claims.txt"
          node tools/ci/collect-automation-prs.mjs --repository "${GITHUB_REPOSITORY}" --refs "${state_root}/claims.txt" --pr-limit 1000 --output "${state_root}/prs.json"
          # #995: PR 없는 claim은 DUE·CURRENT와 무관하게 만든 run과 게시 증거로 판정한다. 고아마다 gh run view 한 번이다(끝난 run 이력 목록은 받지 않는다).
          node tools/ci/claim-orphans.mjs --workflow retained-gwangju-timetable-refresh.yml --repository "${GITHUB_REPOSITORY}" --refs "${state_root}/claims.txt" --prs "${state_root}/prs.json" --output "${state_root}/claim-evidence.json"
          STATE_ROOT="${state_root}" node --input-type=module -e '
            import { appendFile, readFile } from "node:fs/promises";
            import { classifyRetainedGwangjuRefreshDelivery, parseRetainedGwangjuRefreshClaims } from "./tools/ci/retained-gwangju-refresh-delivery.mjs";
            const root = process.env.STATE_ROOT;
            const result = classifyRetainedGwangjuRefreshDelivery({ decision: JSON.parse(await readFile(root + "/due.json")), repository: process.env.GITHUB_REPOSITORY, claims: parseRetainedGwangjuRefreshClaims(await readFile(root + "/claims.txt", "utf8")), pullRequests: JSON.parse(await readFile(root + "/prs.json", "utf8")), claimEvidence: JSON.parse(await readFile(root + "/claim-evidence.json", "utf8")) });
            await appendFile(process.env.GITHUB_OUTPUT, "state=" + result.state + "\nbranch=" + (result.branch ?? "") + "\ncleanup_claims=" + result.cleanupClaims.join(",") + "\n");
          '
          printf 'RETAINED_GWANGJU_STATE_ROOT=%s\n' "${state_root}" >> "${GITHUB_ENV}"
      - name: Remove abandoned retained timetable claims named by the decision
        if: ${{ steps.decision.outputs.cleanup_claims != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CLEANUP_CLAIMS: ${{ steps.decision.outputs.cleanup_claims }}
        run: |
          set -euo pipefail
          # #995: 판정이 정리 대상으로 알린 claim만 지운다(만든 run이 끝났고 빈 claim뿐인 고아). 조용히 지우지 않는다: #926 실패 보고를 먼저 하고 지운다.
          gh auth setup-git
          node tools/ci/remove-orphan-claims.mjs --workflow retained-gwangju-timetable-refresh.yml --repository "${GITHUB_REPOSITORY}" --claims "${CLEANUP_CLAIMS}" --refs "${RETAINED_GWANGJU_STATE_ROOT}/claims.txt"
      - name: Note retained timetable refresh waiting on a running producer
        if: ${{ steps.decision.outputs.state == 'CLAIM_IN_PROGRESS' }}
        env:
          CLAIM_BRANCH: ${{ steps.decision.outputs.branch }}
        run: |
          echo "::notice title=Retained Gwangju timetable refresh::the run that created ${CLAIM_BRANCH} is still running; waiting for it to finish."
      - name: Mint App token for the open refresh pull request
        id: app-token-open
        if: ${{ steps.decision.outputs.state == 'OPEN_PR' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.EASYSUBWAY_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.EASYSUBWAY_RELEASE_APP_PRIVATE_KEY }}
          owner: AquilaXk
          repositories: easysubway-data
          permission-pull-requests: write
      - name: Ensure required CI on the open refresh pull request
        id: required-ci
        if: ${{ steps.decision.outputs.state == 'OPEN_PR' }}
        env:
          GH_TOKEN: ${{ github.token }}
          APP_PR_TOKEN: ${{ steps.app-token-open.outputs.token }}
        run: |
          set -euo pipefail
          # #939: head에 pull_request CI가 없으면 그 PR만 App으로 닫았다 다시 열어 CI를 실행한다(이미 있으면 아무것도 하지 않는다).
          node tools/ci/refresh-pr-required-ci.mjs --workflow retained-gwangju-timetable-refresh.yml --repository "${GITHUB_REPOSITORY}" --github-output "${GITHUB_OUTPUT}"
      - name: Enforce open refresh pull request age limit
        if: ${{ steps.decision.outputs.state == 'OPEN_PR' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # #939: 열린 갱신 PR이 정책 manualCheckCadence를 넘기면 실패해 실패 보고(report-refresh-failure)로 드러낸다.
          open_prs="${RUNNER_TEMP}/open-refresh-prs-${GITHUB_RUN_ID}.json"
          gh pr list --repo "${GITHUB_REPOSITORY}" --state open --base main --limit 1000 --json number,url,createdAt,headRefName,baseRefName,isCrossRepository > "${open_prs}"
          node tools/ci/refresh-open-pr-age.mjs --workflow retained-gwangju-timetable-refresh.yml --prs "${open_prs}" --policy release/product-gates/datapack-freshness-sla.json --repository "${GITHUB_REPOSITORY}" --ci-state "${{ steps.required-ci.outputs.state }}"
      - name: Mint App token for the refresh pull request
        id: app-token-recover
        if: ${{ steps.decision.outputs.state == 'RECOVER_CLAIM' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.EASYSUBWAY_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.EASYSUBWAY_RELEASE_APP_PRIVATE_KEY }}
          owner: AquilaXk
          repositories: easysubway-data
          permission-pull-requests: write
      - name: Recover completed retained timetable claim
        if: ${{ steps.decision.outputs.state == 'RECOVER_CLAIM' }}
        env:
          APP_PR_TOKEN: ${{ steps.app-token-recover.outputs.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="${{ steps.decision.outputs.branch }}"
          git fetch --no-tags origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
          [[ "$(git rev-list --count "origin/${branch}^^..origin/${branch}")" == "2" ]] || { echo "retained timetable claim must have one claim and one output commit" >&2; exit 1; }
          git merge-base --is-ancestor "origin/${branch}^^" origin/main || { echo "retained timetable claim source main is not an origin/main ancestor" >&2; exit 1; }
          [[ "$(git log -1 --format=%s "origin/${branch}^")" == "Claim retained Gwangju timetable refresh" ]] || { echo "retained timetable claim commit is invalid" >&2; exit 1; }
          [[ "$(git log -1 --format=%s "origin/${branch}")" == "Refresh retained Gwangju timetable" ]] || { echo "retained timetable output commit is invalid" >&2; exit 1; }
          git diff --quiet "origin/${branch}^^" "origin/${branch}^" || { echo "retained timetable claim must be empty" >&2; exit 1; }
          changed="${RETAINED_GWANGJU_STATE_ROOT}/recovery-changed.txt"; deleted="${RETAINED_GWANGJU_STATE_ROOT}/recovery-deleted.txt"
          git diff --name-only --diff-filter=ACMR "origin/${branch}^" "origin/${branch}" > "${changed}"
          git diff --name-only --diff-filter=D "origin/${branch}^" "origin/${branch}" > "${deleted}"
          CHANGED="${changed}" DELETED="${deleted}" node --input-type=module -e 'import { readFile } from "node:fs/promises"; import { validateRetainedGwangjuRefreshOutputPaths } from "./tools/ci/retained-gwangju-refresh-delivery.mjs"; await validateRetainedGwangjuRefreshOutputPaths({ changedPaths: (await readFile(process.env.CHANGED, "utf8")).split("\n").filter(Boolean), deletedPaths: (await readFile(process.env.DELETED, "utf8")).split("\n").filter(Boolean) });'
          existing="${RETAINED_GWANGJU_STATE_ROOT}/recovery-prs.json"
          gh pr list --repo "${GITHUB_REPOSITORY}" --state all --base main --head "${branch}" --limit 100 --json number,state,isDraft,headRefName,baseRefName,headRepository,isCrossRepository > "${existing}"
          EXISTING="${existing}" BRANCH="${branch}" node --input-type=module -e 'import { readFile } from "node:fs/promises"; import { assertRetainedGwangjuRecoveryPullRequestAbsent } from "./tools/ci/retained-gwangju-refresh-delivery.mjs"; assertRetainedGwangjuRecoveryPullRequestAbsent({ repository: process.env.GITHUB_REPOSITORY, branch: process.env.BRANCH, pullRequests: JSON.parse(await readFile(process.env.EXISTING, "utf8")) });'
          # #939: App이 연 PR이라야 pull_request CI가 required check로 붙는다(GITHUB_TOKEN PR은 action_required, dispatch CI는 인정 안 됨).
          GH_TOKEN="${APP_PR_TOKEN}" gh pr create --repo "${GITHUB_REPOSITORY}" --draft --base main --head "${branch}" --title "Refresh retained Gwangju timetable" --body "Refresh the due retained Gwangju timetable through the current official-source operation.\n\nRefs #504"
      - name: Create retained timetable claim before provider access
        if: ${{ steps.decision.outputs.state == 'DUE' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="automation/504-retained-gwangju-timetable-refresh-${GITHUB_RUN_ID}"
          main_sha="$(git rev-parse HEAD)"
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "${main_sha}" ]] || { echo "retained timetable source main changed before claim" >&2; exit 1; }
          git switch -c "${branch}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Claim retained Gwangju timetable refresh"
          gh auth setup-git
          git push origin "${branch}"
          git switch --detach "${main_sha}"
          printf 'RETAINED_GWANGJU_BRANCH=%s\n' "${branch}" >> "${GITHUB_ENV}"
          printf 'RETAINED_GWANGJU_MAIN_SHA=%s\n' "${main_sha}" >> "${GITHUB_ENV}"
      - name: Collect due retained Gwangju timetable
        if: ${{ steps.decision.outputs.state == 'DUE' }}
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL: ${{ secrets.EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL }}
        run: |
          set -euo pipefail
          # #995: 수집·계약 준비까지만 한다. OCI에는 아무것도 올리지 않는다(이 step이 실패하면 게시된 것이 없다).
          [[ "$(git rev-parse HEAD)" == "${RETAINED_GWANGJU_MAIN_SHA}" ]] || { echo "retained timetable controller is not running from its claimed main" >&2; exit 1; }
          node tools/datapack/run-retained-gwangju-timetable-refresh.mjs --operation-root "${RUNNER_TEMP}/retained-gwangju-timetable-refresh/${GITHUB_RUN_ID}/operation" --phase collect
      - name: Publish and register retained Gwangju timetable
        if: ${{ steps.decision.outputs.state == 'DUE' }}
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL: ${{ secrets.EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL }}
        run: |
          set -euo pipefail
          # #995: 수집 step이 남긴 파일을 OCI에 게시하고 원장에 등록한다. 이 step이 시작되면 게시됐을 수 있다(claim 정리가 이 step 이름으로 판정한다: claim-orphans.mjs).
          [[ "$(git rev-parse HEAD)" == "${RETAINED_GWANGJU_MAIN_SHA}" ]] || { echo "retained timetable controller is not running from its claimed main" >&2; exit 1; }
          node tools/datapack/run-retained-gwangju-timetable-refresh.mjs --operation-root "${RUNNER_TEMP}/retained-gwangju-timetable-refresh/${GITHUB_RUN_ID}/operation" --phase publish
      - name: Finalize retained timetable claim
        if: ${{ steps.decision.outputs.state == 'DUE' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ -z "$(git ls-files --others --exclude-standard)" ]] || { echo "retained timetable controller left untracked checkout files" >&2; exit 1; }
          git switch "${RETAINED_GWANGJU_BRANCH}"
          [[ "$(git rev-parse HEAD^)" == "${RETAINED_GWANGJU_MAIN_SHA}" ]] || { echo "retained timetable claim is not based on its source main" >&2; exit 1; }
          git add -A
          changed="${RETAINED_GWANGJU_STATE_ROOT}/changed.txt"; deleted="${RETAINED_GWANGJU_STATE_ROOT}/deleted.txt"
          git diff --cached --name-only --diff-filter=ACMR > "${changed}"
          git diff --cached --name-only --diff-filter=D > "${deleted}"
          CHANGED="${changed}" DELETED="${deleted}" node --input-type=module -e 'import { readFile } from "node:fs/promises"; import { validateRetainedGwangjuRefreshOutputPaths } from "./tools/ci/retained-gwangju-refresh-delivery.mjs"; validateRetainedGwangjuRefreshOutputPaths({ changedPaths: (await readFile(process.env.CHANGED, "utf8")).split("\n").filter(Boolean), deletedPaths: (await readFile(process.env.DELETED, "utf8")).split("\n").filter(Boolean) });'
          git diff --cached --quiet && { echo "retained timetable controller produced no registration output" >&2; exit 1; }
          git diff --quiet "${RETAINED_GWANGJU_MAIN_SHA}" -- tools/datapack/source-governance-policy.json release/product-gates/datapack-freshness-sla.json || { echo "retained timetable changed governance or freshness policy" >&2; exit 1; }
          git commit -m "Refresh retained Gwangju timetable"
          git push origin "${RETAINED_GWANGJU_BRANCH}"
      - name: Mint App token for the refresh pull request
        id: app-token-pr
        if: ${{ steps.decision.outputs.state == 'DUE' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.EASYSUBWAY_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.EASYSUBWAY_RELEASE_APP_PRIVATE_KEY }}
          owner: AquilaXk
          repositories: easysubway-data
          permission-pull-requests: write
      - name: Create retained timetable draft pull request
        if: ${{ steps.decision.outputs.state == 'DUE' }}
        env:
          APP_PR_TOKEN: ${{ steps.app-token-pr.outputs.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # #939: App이 연 PR이라야 pull_request CI가 required check로 붙는다(GITHUB_TOKEN PR은 action_required, dispatch CI는 인정 안 됨).
          GH_TOKEN="${APP_PR_TOKEN}" gh pr create --repo "${GITHUB_REPOSITORY}" --draft --base main --head "${RETAINED_GWANGJU_BRANCH}" --title "Refresh retained Gwangju timetable" --body $'Refresh the due retained Gwangju timetable through the current official-source operation.\n\nRefs #504'
      - name: Report refresh failure as an issue
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/ci/report-refresh-failure.mjs --workflow retained-gwangju-timetable-refresh.yml --repository "${GITHUB_REPOSITORY}" --run-id "${GITHUB_RUN_ID}"
