name: ITX Current Promotion

# ITX-청춘 원천 시간표 자동 승격(#977, #870 전체 자동화 3단계): 건별 QA 승인 코멘트(/approve-itx-current) 없이,
# 수집분이 자동 이상 판정 게이트(itx-promotion-gate-v1)를 통과했을 때만 승격 PR을 연다. 사람은 이상이 났을 때만 개입한다.
# - 매일 03:00 KST에 돌지만 공급자 호출 전 판정(decide-itx-current-promotion)이 수집 여부를 정한다. 수집할 때가 아니면 공급자도 PR도 없다.
#   수집 시점은 신선도 규칙에서 계산한다: 만료 2일 전부터(금·토·일) 수집하고, 어느 한 번이 실패해도 다음 날 재시도로 끊기지 않는다.
# - 수집(KST 하루 한 번, 예산 가드) -> 오프라인 replay -> 게이트 -> 승격 -> 브랜치 push -> App 토큰 PR. 게이트가 막으면 job이 실패해 실패 이슈(#926)로 드러난다.
# - 정기 실행은 저장소 변수 DATAPACK_SCHEDULED_ITX_PROMOTION이 true일 때만 돈다(기본 꺼짐). 사람 dispatch는 항상 돈다.
#   force_collect를 주면 수집할 때가 아니어도 수집한다(후속 단계가 새 수집분을 기다릴 때).
# - 승격 뒤 파생 재결속(#979)을 같은 job에서 한다: 고정 입력 fixture(mobile, ITX 적용 전 팩)에 새 원천 topology를 적용해 증거(현재·버전 별)와 팩을 만들고,
#   후보 build spec 결속과 5권역 alignment fixture를 새 팩에 맞춘다. mobile 커밋·workflow pin은 승격마다 바뀌지 않는다(CI가 입력 팩에서 출력 팩을 파생해 증거와 대조).
#   그래서 승격 PR 하나가 사람 손 없이 required CI를 통과한다. raw capture 원장(OCI 발행) 등록은 아직 없다(#979 본문 참조).
#   DATAPACK_SCHEDULED_ITX_PROMOTION은 그 남은 항목의 처리와 QA 결정 전까지 켜지 않는다.
# - 수동 승인 경로(collect-korail-itx-cheongchun-timetable --promote-candidate --approval-url ...)는 override로 그대로 있다. 이 workflow는 쓰지 않는다.
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      force_collect:
        description: Collect now even when the freshness rule says it is not due
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: itx-current-promotion-main
  cancel-in-progress: false

jobs:
  promote:
    name: ITX current promotion
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.DATAPACK_SCHEDULED_ITX_PROMOTION == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
      issues: write
    environment: itx-current-collection
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
      - name: Prepare ITX promotion paths
        run: |
          set -euo pipefail
          operation_root="${RUNNER_TEMP}/itx-current-promotion/${GITHUB_RUN_ID}"
          mkdir -p "${operation_root}"
          chmod 700 "${operation_root}"
          printf 'ITX_OPERATION_ROOT=%s\n' "${operation_root}" >> "${GITHUB_ENV}"
      - name: Decide whether ITX promotion is due
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          FORCE_COLLECT: ${{ inputs.force_collect }}
        run: |
          set -euo pipefail
          decision_root="${RUNNER_TEMP}/itx-current-promotion-decision/${GITHUB_RUN_ID}"
          mkdir -p "${decision_root}"
          gh pr list --repo "${GITHUB_REPOSITORY}" --state all --limit 1000 --json number,state,isDraft,headRefName,baseRefName,headRepository,isCrossRepository > "${decision_root}/prs.json"
          git ls-remote --heads origin "refs/heads/automation/977-itx-promotion-*" > "${decision_root}/branches.txt"
          force=false
          if [[ "${FORCE_COLLECT}" == "true" ]]; then force=true; fi
          # 같은 KST 날 topology 갱신·수동 수집이 이미 ITX 공급자를 불렀다면 공급자 호출은 하루 한 번이라 오늘은 수집하지 않고 정상 종료한다.
          itx_collected="$(node tools/ci/guard-itx-current-collection-budget.mjs --probe)"
          node tools/ci/decide-itx-current-promotion.mjs --contract tools/datapack/itx-cheongchun-coverage-contract.json --prs "${decision_root}/prs.json" --branches "${decision_root}/branches.txt" --repository "${GITHUB_REPOSITORY}" --pr-limit 1000 --force "${force}" --itx-collected-today "${itx_collected}" --github-output "${GITHUB_OUTPUT}"
      - name: Mint App token for the open refresh pull request
        id: app-token-open
        if: ${{ steps.decision.outputs.state == 'OPEN_PR' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.EASYSUBWAY_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.EASYSUBWAY_RELEASE_APP_PRIVATE_KEY }}
          owner: AquilaXk
          repositories: easysubway-data
          permission-pull-requests: write
      - name: Ensure required CI on the open refresh pull request
        id: required-ci
        if: ${{ steps.decision.outputs.state == 'OPEN_PR' }}
        env:
          GH_TOKEN: ${{ github.token }}
          APP_PR_TOKEN: ${{ steps.app-token-open.outputs.token }}
        run: |
          set -euo pipefail
          # #939: head에 pull_request CI가 없으면 그 PR만 App으로 닫았다 다시 열어 CI를 실행한다(이미 있으면 아무것도 하지 않는다). #969: CI가 실패했으면 바로 실패한다.
          node tools/ci/refresh-pr-required-ci.mjs --workflow itx-current-promotion.yml --repository "${GITHUB_REPOSITORY}" --github-output "${GITHUB_OUTPUT}"
      - name: Enforce open refresh pull request age limit
        if: ${{ steps.decision.outputs.state == 'OPEN_PR' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CI_STATE: ${{ steps.required-ci.outputs.state }}
        run: |
          set -euo pipefail
          # #939: 열린 승격 PR이 정책 manualCheckCadence를 넘기면 실패해 실패 보고(report-refresh-failure)로 드러낸다.
          open_prs="${RUNNER_TEMP}/open-refresh-prs-${GITHUB_RUN_ID}.json"
          gh pr list --repo "${GITHUB_REPOSITORY}" --state open --base main --limit 1000 --json number,url,createdAt,headRefName,baseRefName,isCrossRepository > "${open_prs}"
          node tools/ci/refresh-open-pr-age.mjs --workflow itx-current-promotion.yml --prs "${open_prs}" --policy release/product-gates/datapack-freshness-sla.json --repository "${GITHUB_REPOSITORY}" --ci-state "${CI_STATE}"
      - name: Note ITX promotion is not due
        if: ${{ steps.decision.outputs.state == 'WAIT' }}
        env:
          DAYS_UNTIL_EXPIRY: ${{ steps.decision.outputs.days_until_expiry }}
          WAIT_REASON: ${{ steps.decision.outputs.reason }}
        run: |
          echo "::notice title=ITX promotion::${WAIT_REASON}: the admitted ITX source stays fresh for ${DAYS_UNTIL_EXPIRY} more day(s); no provider call was made and no pull request was opened."
      - name: Note ITX promotion waiting on another pending automation pull request
        if: ${{ steps.decision.outputs.state == 'BLOCKED_BY_PENDING_PR' }}
        env:
          BLOCKED_BY: ${{ steps.decision.outputs.blocked_by }}
        run: |
          echo "::notice title=ITX promotion::waiting for pending automation pull request(s) ${BLOCKED_BY}; the next daily run decides again."
      - name: Prepare current ITX promotion
        if: ${{ steps.decision.outputs.state == 'COLLECT' }}
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${DATA_GO_KR_SERVICE_KEY:-}" || "${DATA_GO_KR_SERVICE_KEY}" == *$'\n'* || "${DATA_GO_KR_SERVICE_KEY}" == *$'\r'* ]]; then
            echo "DATA_GO_KR_SERVICE_KEY must be a nonempty single line" >&2
            exit 1
          fi
          node tools/datapack/emit-station-catalog-pack.mjs --output "${ITX_OPERATION_ROOT}/station-catalog-pack" --catalog-pack-id "itx-current-station-catalog-v1"
      - name: Guard KST quota window
        if: ${{ steps.decision.outputs.state == 'COLLECT' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/ci/guard-itx-current-collection-budget.mjs --output "${ITX_OPERATION_ROOT}/freshness.json"
      - name: Collect current ITX timetable
        if: ${{ steps.decision.outputs.state == 'COLLECT' }}
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          set -euo pipefail
          # 공급자 호출은 이 step 한 번뿐이다. 실패(MISSING)하면 이 step이 실패하고 이전 데이터로 대체하지 않는다.
          node tools/datapack/run-current-itx-collection.mjs --output "${ITX_OPERATION_ROOT}/itx-result.json" --completeness-output "${ITX_OPERATION_ROOT}/itx-completeness.json" --station-catalog-pack "${ITX_OPERATION_ROOT}/station-catalog-pack" --freshness-output "${ITX_OPERATION_ROOT}/freshness.json"
      - name: Replay retained capture offline
        if: ${{ steps.decision.outputs.state == 'COLLECT' }}
        run: |
          set -euo pipefail
          # 보관한 raw capture만으로 수집 결과를 다시 만든다(공급자 호출 없음). 게이트가 후보 계보와 대조한다.
          node tools/datapack/replay-current-itx-collection.mjs --capture "${ITX_OPERATION_ROOT}/provider-response-capture.json" --output "${ITX_OPERATION_ROOT}/itx-replay.json" --station-catalog-pack "${ITX_OPERATION_ROOT}/station-catalog-pack"
      - name: Evaluate promotion gate
        if: ${{ steps.decision.outputs.state == 'COLLECT' }}
        run: |
          set -euo pipefail
          # PASS면 0, 차단이면 3으로 끝난다. 차단 코드는 로그와 itx-promotion-gate.json 영수증에 남고 job이 실패해 이슈로 드러난다.
          node tools/datapack/itx-promotion-gate.mjs --candidate "${ITX_OPERATION_ROOT}/itx-result.json" --completeness "${ITX_OPERATION_ROOT}/itx-completeness.json" --capture "${ITX_OPERATION_ROOT}/provider-response-capture.json" --replay "${ITX_OPERATION_ROOT}/itx-replay.json" --coverage-contract "${GITHUB_WORKSPACE}/tools/datapack/itx-cheongchun-coverage-contract.json" --policy "${GITHUB_WORKSPACE}/tools/datapack/itx-promotion-gate-policy.json" --output "${ITX_OPERATION_ROOT}/itx-promotion-gate.json"
      - name: Promote the gated candidate
        if: ${{ steps.decision.outputs.state == 'COLLECT' }}
        run: |
          set -euo pipefail
          # 승인 코멘트 없이 게이트를 같은 입력으로 다시 계산해 PASS일 때만 원천·완전성 증거·게이트 영수증을 쓰고 coverage contract를 갱신한다.
          node tools/datapack/collect-korail-itx-cheongchun-timetable.mjs --promote-candidate "${ITX_OPERATION_ROOT}/itx-result.json" --completeness-evidence "${ITX_OPERATION_ROOT}/itx-completeness.json" --source-output-dir "${GITHUB_WORKSPACE}/tools/datapack/sources" --coverage-contract "${GITHUB_WORKSPACE}/tools/datapack/itx-cheongchun-coverage-contract.json" --station-catalog-pack "${ITX_OPERATION_ROOT}/station-catalog-pack" --auto-gate --provider-capture "${ITX_OPERATION_ROOT}/provider-response-capture.json" --replay-evidence "${ITX_OPERATION_ROOT}/itx-replay.json"
      - name: Checkout pinned Mobile input fixture
        if: ${{ steps.decision.outputs.state == 'COLLECT' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: AquilaXk/easysubway-mobile
          ref: 573aefdbbf2e639d28de18697eb449da85415353
          path: .external/mobile
          persist-credentials: false
          fetch-depth: 0
      - name: Stage pinned Mobile input fixture
        if: ${{ steps.decision.outputs.state == 'COLLECT' }}
        shell: bash
        run: |
          set -euo pipefail
          # ci.yml의 Stage pinned Mobile fixture와 같은 고정 커밋·입력 팩 sha256이다(workflow 계약 테스트가 두 곳의 일치를 본다).
          expected_revision="573aefdbbf2e639d28de18697eb449da85415353"
          source=".external/mobile/apps/mobile"
          capital_gzip="${source}/assets/datapacks/capital.sqlite.gz"
          expected_sha256="609a74095859b5bf7602c25e142caa47cc212170a72d6240e2d01b39f874047a"
          actual_revision="$(git -C .external/mobile rev-parse HEAD)"
          [[ "${actual_revision}" == "${expected_revision}" ]]
          [[ -d "${source}" && ! -L "${source}" ]]
          if find "${source}" -type l -print -quit | grep -q .; then
            echo "pinned Mobile fixture contains a symlink" >&2
            exit 1
          fi
          [[ -f "${capital_gzip}" && ! -L "${capital_gzip}" ]]
          actual_sha256="$(sha256sum "${capital_gzip}" | awk '{print $1}')"
          [[ "${actual_sha256}" == "${expected_sha256}" ]]
          test ! -e apps/mobile
          test ! -L apps/mobile
          if [[ -e apps || -L apps ]]; then
            [[ -d apps && ! -L apps ]]
          else
            mkdir apps
          fi
          cp -a "${source}" apps/mobile
      - name: Rebind derived ITX bindings
        if: ${{ steps.decision.outputs.state == 'COLLECT' }}
        run: |
          set -euo pipefail
          # 승격 근거를 다시 확인한 뒤 입력 팩에 새 topology를 적용해 증거·버전 증거·후보 build spec 결속·alignment fixture를 새 원천에 맞춘다.
          node tools/datapack/rebind-itx-promotion.mjs --repository-root "${GITHUB_WORKSPACE}" --build-now "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
      - name: Mint App token for the promotion pull request
        id: app-token-pr
        if: ${{ steps.decision.outputs.state == 'COLLECT' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.EASYSUBWAY_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.EASYSUBWAY_RELEASE_APP_PRIVATE_KEY }}
          owner: AquilaXk
          repositories: easysubway-data
          permission-pull-requests: write
      - name: Commit exactly the promotion and rebinding outputs and open draft PR
        if: ${{ steps.decision.outputs.state == 'COLLECT' }}
        env:
          APP_PR_TOKEN: ${{ steps.app-token-pr.outputs.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          contract="tools/datapack/itx-cheongchun-coverage-contract.json"
          artifact_id="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).sourceTimetableArtifact.artifactId)' "${contract}")"
          [[ "${artifact_id}" =~ ^itx-cheongchun-source-timetable-[0-9]{17}$ ]] || { echo "promoted artifact identity is invalid" >&2; exit 1; }
          # 허용 경로의 정본은 증거 단계 코드 한 곳이다(원천 승격 4 + 재결속 8). 정확히 이 집합만 바뀌어야 한다.
          mapfile -t paths < <(node -e 'import("./tools/ci/automation-pr-evidence.mjs").then(({ itxPromotionAllowedPaths }) => process.stdout.write(`${itxPromotionAllowedPaths(process.argv[1]).join("\n")}\n`))' "${artifact_id}")
          mapfile -t changed < <(git status --porcelain=v1 | sed -E 's/^.. //')
          [[ "${#changed[@]}" == "${#paths[@]}" ]] || { echo "promotion changed an unsupported path count" >&2; exit 1; }
          for file in "${paths[@]}"; do printf '%s\n' "${changed[@]}" | grep -Fqx "${file}" || { echo "promotion changed an unsupported path" >&2; exit 1; }; done
          base_sha="$(git rev-parse HEAD)"
          branch="automation/977-itx-promotion-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          git switch -c "${branch}"
          git add "${paths[@]}"
          git commit -m "Promote ITX cheongchun source timetable ${artifact_id}"
          # 정리 step이 알 수 있도록 push보다 먼저 이름을 기록한다. 정리 step은 원격 브랜치가 없으면 조용히 끝난다.
          printf 'PROMOTION_BRANCH=%s\n' "${branch}" >> "${GITHUB_ENV}"
          git push origin "${branch}"
          evidence_root="$(mktemp -d "${RUNNER_TEMP}/itx-promotion-evidence.XXXXXX")"
          printf '%s\n' "${paths[@]}" > "${evidence_root}/paths.txt"
          node tools/ci/automation-pr-evidence.mjs itx-promotion-body --receipt "tools/datapack/sources/${artifact_id}-promotion-gate.json" --changed-paths "${evidence_root}/paths.txt" --base-sha "${base_sha}" --head-sha "$(git rev-parse HEAD)" --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --output "${evidence_root}/body.md"
          # #967: App이 연 PR이라야 pull_request CI가 required check로 붙는다(GITHUB_TOKEN PR은 action_required). push는 GITHUB_TOKEN 그대로다.
          GH_TOKEN="${APP_PR_TOKEN}" gh pr create --repo "${GITHUB_REPOSITORY}" --draft --base main --head "${branch}" --title "[Data] ITX-청춘 원천 시간표 자동 승격 (${artifact_id})" --body-file "${evidence_root}/body.md"
      - name: Surface a lapsed freshness
        if: ${{ steps.decision.outputs.state == 'COLLECT' && steps.decision.outputs.lapsed == 'true' }}
        run: |
          echo "the admitted ITX source had already expired before this collection; the promotion pull request was opened, but the lapse needs a look" >&2
          exit 1
      - name: Upload sanitized promotion evidence
        if: ${{ always() && steps.decision.outputs.state == 'COLLECT' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: itx-current-promotion-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/itx-current-promotion/${{ github.run_id }}/freshness.json
            ${{ runner.temp }}/itx-current-promotion/${{ github.run_id }}/itx-result.json
            ${{ runner.temp }}/itx-current-promotion/${{ github.run_id }}/itx-completeness.json
            ${{ runner.temp }}/itx-current-promotion/${{ github.run_id }}/provider-response-capture.json
            ${{ runner.temp }}/itx-current-promotion/${{ github.run_id }}/itx-replay.json
            ${{ runner.temp }}/itx-current-promotion/${{ github.run_id }}/itx-promotion-gate.json
          if-no-files-found: warn
          retention-days: 14
      - name: Remove this run's branch when no pull request was opened
        if: ${{ (failure() || cancelled()) && env.PROMOTION_BRANCH != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 이 run이 push한 브랜치에 PR이 없으면 지운다(다음 실행의 판정이 PR 없는 브랜치를 이상으로 보기 때문이다). PR이 있으면 지우지 않는다.
          branch="automation/977-itx-promotion-${GITHUB_RUN_ID}"
          [[ "${PROMOTION_BRANCH}" == "${branch}" ]] || exit 0
          git ls-remote --exit-code --heads origin "refs/heads/${branch}" > /dev/null || exit 0
          [[ "$(gh pr list --repo "${GITHUB_REPOSITORY}" --state all --head "${branch}" --json number --jq 'length')" == "0" ]] || exit 0
          gh auth setup-git
          git push origin --delete "${branch}"
          echo "::notice title=ITX promotion::removed ${branch}; no pull request was opened, so the next run starts over."
      - name: Report refresh failure as an issue
        if: ${{ failure() || cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/ci/report-refresh-failure.mjs --workflow itx-current-promotion.yml --repository "${GITHUB_REPOSITORY}" --run-id "${GITHUB_RUN_ID}"
