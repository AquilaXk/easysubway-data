name: ITX Current Promotion

# ITX-청춘 원천 시간표 자동 승격(단독 운영):
# 수집분이 자동 이상 판정 게이트(itx-promotion-gate-v1)를 통과하면 파생 재결속 후 main에 직접 반영한다(PR·이슈 생성 없음).
# - 외부 스케줄러가 3시간마다(UTC 0·3·…·21시 정각) dispatch하고, GitHub schedule 백업도 3시간마다 돈다. 공급자 호출 전 판정(decide-itx-current-promotion)이 수집 여부를 정한다.
# - 수집은 KST 하루 공급자 호출 예산 안에서 한다(itx-collection-allowance). 같은 날 이미 성공했으면 기다리고, 실패만 했으면(공급자 장애) 3시간 주기의 다음 실행이
#   마지막 시도가 끝난 2시간 뒤에 다시 수집한다. 실패한 날의 요청 수는 실패 run의 증거 artifact(provider-response-capture)에서 읽고, 하루 시도 3회·요청 9,482건을 넘거나 요청 수를 증명할 수 없으면 job이 실패해 요약으로 드러난다.
# - 수집(KST 하루 호출 예산, 예산 가드) -> 오프라인 replay -> 게이트 -> 승격 -> main 직접 push. 게이트가 막으면 job이 실패해 요약으로 드러난다.
# - 정기 실행은 저장소 변수 DATAPACK_SCHEDULED_ITX_PROMOTION이 true일 때만 돈다(기본 꺼짐). 사람 dispatch는 항상 돈다.
#   force_collect를 주면 수집할 때가 아니어도 수집하고 재시도 최소 간격도 건너뛴다(하루 시도 상한·요청 예산은 건너뛰지 못한다).
# - 승격 뒤 파생 재결속을 같은 job에서 한다: 고정 입력 fixture(mobile, ITX 적용 전 팩)에 새 원천 topology를 적용해 증거·팩·5권역 alignment fixture를 함께 갱신한다.
#   raw capture 원장(OCI 발행) 대조와 첫 실제 dispatch 확인은 #981로 분리했고 변수 켜기의 선행 조건이 아니다.
#   DATAPACK_SCHEDULED_ITX_PROMOTION은 코드가 켜지 않는다. QA 보고 뒤 별도 설정 변경으로만 켠다.
# - 보관 capture 재생: replay_run_id에 이전 run id를 주면 그 run의 artifact(itx-current-promotion-<run id>)에서 후보·완전성 증거·raw capture를 되살려
#   공급자를 부르지 않고 같은 오프라인 replay -> 게이트 -> 승격 -> main push 단계를 거친다.
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      force_collect:
        description: Collect now even when the freshness rule says it is not due
        required: false
        default: false
        type: boolean
      replay_run_id:
        description: Replay the retained capture of this earlier run id instead of calling the provider
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: itx-current-promotion-main-${{ inputs.replay_run_id && format('replay-{0}', inputs.replay_run_id) || 'schedule' }}
  cancel-in-progress: false

jobs:
  promote:
    name: ITX current promotion
    # 사람(sender.type이 User) dispatch만 변수와 무관하게 돈다. 행위자 이름(actor·triggering_actor)은 모방할 수 있어 신뢰 근거로 쓰지 않고, GitHub가 이벤트 payload에 채우는 sender.type으로 가른다(Sonar githubactions:S8232).
    if: ${{ github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && github.event.sender.type == 'User') || vars.DATAPACK_SCHEDULED_ITX_PROMOTION == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    environment: datapack-release-check
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.19.0"
      - name: Prepare ITX promotion paths
        run: |
          set -euo pipefail
          operation_root="${RUNNER_TEMP}/itx-current-promotion/${GITHUB_RUN_ID}"
          mkdir -p "${operation_root}"
          chmod 700 "${operation_root}"
          printf 'ITX_OPERATION_ROOT=%s\n' "${operation_root}" >> "${GITHUB_ENV}"
      - name: Decide whether ITX promotion is due
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          FORCE_COLLECT: ${{ inputs.force_collect }}
          REPLAY_RUN_ID: ${{ inputs.replay_run_id }}
        run: |
          set -euo pipefail
          decision_root="${RUNNER_TEMP}/itx-current-promotion-decision/${GITHUB_RUN_ID}"
          mkdir -p "${decision_root}"
          : > "${decision_root}/branches.txt"
          printf '[]\n' > "${decision_root}/prs.json"
          printf 'ITX_BASE_SHA=%s\n' "$(git rev-parse HEAD)" >> "${GITHUB_ENV}"
          force=false
          if [[ "${FORCE_COLLECT}" == "true" ]]; then force=true; fi
          # 같은 KST 날 ITX 수집 기록(성공·진행 중·실패와 실패 run이 쓴 요청 수)을 공급자 호출 전에 읽는다. 판정이 이미 성공했으면 기다리고, 실패만 했으면 예산 안에서 다시 수집한다.
          node tools/ci/guard-itx-current-collection-budget.mjs --ledger "${decision_root}/itx-collection-ledger.json"
          node tools/ci/decide-itx-current-promotion.mjs --contract tools/datapack/itx-cheongchun-coverage-contract.json --prs "${decision_root}/prs.json" --branches "${decision_root}/branches.txt" --repository "${GITHUB_REPOSITORY}" --pr-limit 1000 --force "${force}" --itx-collection-ledger "${decision_root}/itx-collection-ledger.json" --replay-run-id "${REPLAY_RUN_ID}" --github-output "${GITHUB_OUTPUT}"
      - name: Note ITX promotion is not due
        if: ${{ steps.decision.outputs.state == 'WAIT' }}
        env:
          DAYS_UNTIL_EXPIRY: ${{ steps.decision.outputs.days_until_expiry }}
          WAIT_REASON: ${{ steps.decision.outputs.reason }}
        run: |
          echo "::notice title=ITX promotion::${WAIT_REASON}: no provider call was made and nothing was pushed to main (the admitted ITX source stays fresh for ${DAYS_UNTIL_EXPIRY} more day(s))."
      - name: Prepare current ITX promotion
        if: ${{ steps.decision.outputs.state == 'COLLECT' }}
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          REPLAY_RUN_ID: ${{ steps.decision.outputs.replay_run_id }}
        run: |
          set -euo pipefail
          # 재생은 공급자를 부르지 않으므로 키 검사도 하지 않는다. 보관 capture에서 다시 계산할 역 카탈로그 팩만 만든다.
          if [[ -z "${REPLAY_RUN_ID}" && ( -z "${DATA_GO_KR_SERVICE_KEY:-}" || "${DATA_GO_KR_SERVICE_KEY}" == *$'\n'* || "${DATA_GO_KR_SERVICE_KEY}" == *$'\r'* ) ]]; then
            echo "DATA_GO_KR_SERVICE_KEY must be a nonempty single line" >&2
            exit 1
          fi
          node tools/datapack/emit-station-catalog-pack.mjs --output "${ITX_OPERATION_ROOT}/station-catalog-pack" --catalog-pack-id "itx-current-station-catalog-v1"
      - name: Guard KST quota window
        if: ${{ steps.decision.outputs.state == 'COLLECT' && steps.decision.outputs.replay_run_id == '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # 판정 뒤 다른 workflow가 끼어들었을 수 있으므로 수집 직전에 같은 규칙(실패한 앞선 수집만 있고 상한·예산 안)을 한 번 더 본다.
        run: node tools/ci/guard-itx-current-collection-budget.mjs --output "${ITX_OPERATION_ROOT}/freshness.json" --allow-after-failure
      - name: Collect current ITX timetable
        if: ${{ steps.decision.outputs.state == 'COLLECT' && steps.decision.outputs.replay_run_id == '' }}
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          set -euo pipefail
          # 공급자 호출은 이 step 한 번뿐이다. 실패(MISSING)하면 이 step이 실패하고 이전 데이터로 대체하지 않는다.
          node tools/datapack/run-current-itx-collection.mjs --output "${ITX_OPERATION_ROOT}/itx-result.json" --completeness-output "${ITX_OPERATION_ROOT}/itx-completeness.json" --station-catalog-pack "${ITX_OPERATION_ROOT}/station-catalog-pack" --freshness-output "${ITX_OPERATION_ROOT}/freshness.json"
      - name: Download retained ITX collection evidence
        if: ${{ steps.decision.outputs.state == 'COLLECT' && steps.decision.outputs.replay_run_id != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          repository: ${{ github.repository }}
          run-id: ${{ steps.decision.outputs.replay_run_id }}
          name: itx-current-promotion-${{ steps.decision.outputs.replay_run_id }}
          path: ${{ runner.temp }}/itx-replay-source/${{ github.run_id }}/artifact
          github-token: ${{ github.token }}
      - name: Restore retained ITX collection evidence
        if: ${{ steps.decision.outputs.state == 'COLLECT' && steps.decision.outputs.replay_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPLAY_RUN_ID: ${{ steps.decision.outputs.replay_run_id }}
        run: |
          set -euo pipefail
          # 공급자 호출은 없다. 원본 run 메타데이터를 읽고, 그 run이 실제로 수집·게이트 통과한 증거만 작업 위치로 되살린다. 어긋나면 이 step이 실패한다.
          source_root="${RUNNER_TEMP}/itx-replay-source/${GITHUB_RUN_ID}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${REPLAY_RUN_ID}" > "${source_root}/run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${REPLAY_RUN_ID}/jobs?filter=all&per_page=100" > "${source_root}/jobs.json"
          node tools/ci/restore-itx-replay-evidence.mjs --source-run-id "${REPLAY_RUN_ID}" --repository "${GITHUB_REPOSITORY}" --run "${source_root}/run.json" --jobs "${source_root}/jobs.json" --artifact-dir "${source_root}/artifact" --contract tools/datapack/itx-cheongchun-coverage-contract.json --output-root "${ITX_OPERATION_ROOT}"
      - name: Replay retained capture offline
        if: ${{ steps.decision.outputs.state == 'COLLECT' }}
        run: |
          set -euo pipefail
          # 보관한 raw capture만으로 수집 결과를 다시 만든다(공급자 호출 없음). 게이트가 후보 계보와 대조한다.
          node tools/datapack/replay-current-itx-collection.mjs --capture "${ITX_OPERATION_ROOT}/provider-response-capture.json" --output "${ITX_OPERATION_ROOT}/itx-replay.json" --station-catalog-pack "${ITX_OPERATION_ROOT}/station-catalog-pack"
      - name: Evaluate promotion gate
        if: ${{ steps.decision.outputs.state == 'COLLECT' }}
        run: |
          set -euo pipefail
          # PASS면 0, 차단이면 3으로 끝난다. 차단 코드는 로그와 itx-promotion-gate.json 영수증에 남고 job이 실패해 이슈로 드러난다.
          node tools/datapack/itx-promotion-gate.mjs --candidate "${ITX_OPERATION_ROOT}/itx-result.json" --completeness "${ITX_OPERATION_ROOT}/itx-completeness.json" --capture "${ITX_OPERATION_ROOT}/provider-response-capture.json" --replay "${ITX_OPERATION_ROOT}/itx-replay.json" --coverage-contract "${GITHUB_WORKSPACE}/tools/datapack/itx-cheongchun-coverage-contract.json" --policy "${GITHUB_WORKSPACE}/tools/datapack/itx-promotion-gate-policy.json" --output "${ITX_OPERATION_ROOT}/itx-promotion-gate.json"
      - name: Verify pinned Mobile fixture ref exists
        if: ${{ steps.decision.outputs.state == 'COLLECT' }}
        shell: bash
        run: |
          set -euo pipefail
          # 고정 fixture 커밋은 mobile 레포의 태그가 붙들고 있다. 태그가 지워지거나 옮겨지면 checkout이 불투명하게 실패하므로 먼저 원인을 드러낸다.
          peeled="$(git ls-remote https://github.com/AquilaXk/easysubway-mobile.git 'refs/tags/data-fixture/basemap-textnomerge-1495^{}' | awk '{print $1}')"
          if [[ "${peeled}" != "d3694c0fe1d15e9ee7854cba14e9120fd8ade9da" ]]; then
            echo "pinned Mobile fixture tag data-fixture/basemap-textnomerge-1495 must point to d3694c0fe1d15e9ee7854cba14e9120fd8ade9da (found '${peeled}'); do not delete or move this tag" >&2
            exit 1
          fi

      - name: Checkout pinned Mobile input fixture
        if: ${{ steps.decision.outputs.state == 'COLLECT' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: AquilaXk/easysubway-mobile
          ref: data-fixture/basemap-textnomerge-1495
          path: .external/mobile
          persist-credentials: false
          fetch-depth: 0
      - name: Stage pinned Mobile input fixture
        if: ${{ steps.decision.outputs.state == 'COLLECT' }}
        shell: bash
        run: |
          set -euo pipefail
          # ci.yml의 Stage pinned Mobile fixture와 같은 고정 커밋·입력 팩 sha256이다(workflow 계약 테스트가 두 곳의 일치를 본다).
          expected_revision="d3694c0fe1d15e9ee7854cba14e9120fd8ade9da"
          source=".external/mobile/apps/mobile"
          capital_gzip="${source}/assets/datapacks/capital.sqlite.gz"
          expected_sha256="609a74095859b5bf7602c25e142caa47cc212170a72d6240e2d01b39f874047a"
          actual_revision="$(git -C .external/mobile rev-parse HEAD)"
          [[ "${actual_revision}" == "${expected_revision}" ]]
          [[ -d "${source}" && ! -L "${source}" ]]
          if find "${source}" -type l -print -quit | grep -q .; then
            echo "pinned Mobile fixture contains a symlink" >&2
            exit 1
          fi
          [[ -f "${capital_gzip}" && ! -L "${capital_gzip}" ]]
          actual_sha256="$(sha256sum "${capital_gzip}" | awk '{print $1}')"
          [[ "${actual_sha256}" == "${expected_sha256}" ]]
          test ! -e apps/mobile
          test ! -L apps/mobile
          if [[ -e apps || -L apps ]]; then
            [[ -d apps && ! -L apps ]]
          else
            mkdir apps
          fi
          cp -a "${source}" apps/mobile
      - name: Promote the gated candidate
        if: ${{ steps.decision.outputs.state == 'COLLECT' }}
        env:
          EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL: ${{ secrets.EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL:-}" || "${EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL}" == *$'\n'* || "${EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL}" == *$'\r'* ]]; then
            echo "EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL must be a nonempty single line" >&2
            exit 1
          fi
          # 승인 코멘트 없이 게이트를 같은 입력으로 다시 계산해 PASS일 때만 raw capture를 OCI에 발행·원장(source-snapshots.json)에 등록하고 원천·완전성 증거·게이트 영수증을 쓰며 coverage contract를 갱신한다.
          # --rebind는 승격 직후 같은 프로세스에서 파생 재결속(topology 증거·버전 증거·alignment fixture)을 만든다. 앞 step이 stage한 고정 입력 fixture(apps/mobile)를 쓴다.
          node tools/datapack/collect-korail-itx-cheongchun-timetable.mjs --promote-candidate "${ITX_OPERATION_ROOT}/itx-result.json" --completeness-evidence "${ITX_OPERATION_ROOT}/itx-completeness.json" --source-output-dir "${GITHUB_WORKSPACE}/tools/datapack/sources" --coverage-contract "${GITHUB_WORKSPACE}/tools/datapack/itx-cheongchun-coverage-contract.json" --station-catalog-pack "${ITX_OPERATION_ROOT}/station-catalog-pack" --auto-gate --provider-capture "${ITX_OPERATION_ROOT}/provider-response-capture.json" --replay-evidence "${ITX_OPERATION_ROOT}/itx-replay.json" --rebind
      - name: Commit and push ITX promotion and rebinding outputs
        id: push
        if: ${{ steps.decision.outputs.state == 'COLLECT' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          contract="tools/datapack/itx-cheongchun-coverage-contract.json"
          artifact_id="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).sourceTimetableArtifact.artifactId)' "${contract}")"
          [[ "${artifact_id}" =~ ^itx-cheongchun-source-timetable-[0-9]{17}$ ]] || { echo "promoted artifact identity is invalid" >&2; exit 1; }
          # 허용 경로의 정본은 증거 단계 코드 한 곳이다(원천 승격 4 + 재결속 7). 정확히 이 집합만 바뀌어야 한다.
          mapfile -t paths < <(node -e 'import("./tools/ci/automation-pr-evidence.mjs").then(({ itxPromotionAllowedPaths }) => process.stdout.write(itxPromotionAllowedPaths(process.argv[1]).join("\n") + "\n"))' "${artifact_id}")
          mapfile -t changed < <(git status --porcelain=v1 | sed -E 's/^.. //')
          [[ "${#changed[@]}" == "${#paths[@]}" ]] || { echo "promotion changed an unsupported path count" >&2; exit 1; }
          for file in "${paths[@]}"; do printf '%s\n' "${changed[@]}" | grep -Fqx "${file}" || { echo "promotion changed an unsupported path" >&2; exit 1; }; done
          base_sha="${ITX_BASE_SHA}"
          git fetch --no-tags origin main
          if [[ "$(git rev-parse origin/main)" != "${base_sha}" ]]; then
            echo "::notice title=ITX promotion::main moved from ${base_sha} while ITX promotion was running; nothing was pushed and a newer run decides on the new main."
            echo "pushed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          git add -- "${paths[@]}"
          git commit -m "Promote ITX cheongchun source timetable ${artifact_id}"
          evidence_root="$(mktemp -d "${RUNNER_TEMP}/itx-promotion-evidence.XXXXXX")"
          printf '%s\n' "${paths[@]}" > "${evidence_root}/paths.txt"
          node tools/ci/automation-pr-evidence.mjs itx-promotion-body --receipt "tools/datapack/sources/${artifact_id}-promotion-gate.json" --changed-paths "${evidence_root}/paths.txt" --base-sha "${base_sha}" --head-sha "$(git rev-parse HEAD)" --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --output "${evidence_root}/body.md"
          git push origin HEAD:main
          cat "${evidence_root}/body.md" >> "${GITHUB_STEP_SUMMARY}"
          echo "pushed=true" >> "${GITHUB_OUTPUT}"
      - name: Surface a lapsed freshness
        if: ${{ steps.decision.outputs.state == 'COLLECT' && steps.decision.outputs.lapsed == 'true' }}
        run: |
          echo "the admitted ITX source had already expired before this collection; the promotion outputs were committed if main matched, and the lapse needs a look" >&2
          exit 1
      - name: Upload sanitized promotion evidence
        if: ${{ always() && steps.decision.outputs.state == 'COLLECT' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: itx-current-promotion-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/itx-current-promotion/${{ github.run_id }}/freshness.json
            ${{ runner.temp }}/itx-current-promotion/${{ github.run_id }}/itx-result.json
            ${{ runner.temp }}/itx-current-promotion/${{ github.run_id }}/itx-completeness.json
            ${{ runner.temp }}/itx-current-promotion/${{ github.run_id }}/provider-response-capture.json
            ${{ runner.temp }}/itx-current-promotion/${{ github.run_id }}/itx-replay.json
            ${{ runner.temp }}/itx-current-promotion/${{ github.run_id }}/itx-promotion-gate.json
          if-no-files-found: warn
          retention-days: 14
      - name: Report refresh failure summary
        if: ${{ failure() || cancelled() }}
        run: node tools/ci/report-refresh-failure.mjs --workflow itx-current-promotion.yml --repository "${GITHUB_REPOSITORY}" --run-id "${GITHUB_RUN_ID}"
