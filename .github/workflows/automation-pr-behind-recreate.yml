name: Automation PR Behind Recreate

# main보다 뒤처진 데이터 전용 자동화 PR을 닫고 최신 main에서 다시 만들게 한다(#986 리뷰 F2, #870 전체 자동화 2단계).
# - 자동화 PR의 증거 블록과 정책 통과 기록은 head에 묶여 있다. base 갱신(update-branch)은 사람(PAT 소유자) 작성 병합 커밋을 만들어 head 결속을 깨므로
#   하지 않는다. 대신 PR 닫기(App 토큰) -> claim 브랜치 삭제 -> 해당 단계 workflow 재실행 순서로 처리한다.
# - 하루 한 번만 받을 수 있는 수집분을 들고 있는 단계는 그냥 닫지 않는다(#1127). ITX 승격 PR은 닫기 전에 원본 run의 artifact가 살아 있는지 읽고, 닫은 뒤
#   itx-current-promotion.yml을 replay_run_id 입력으로 다시 실행해 같은 수집분을 최신 main 위에 승격한다(공급자 재호출 없음). 원본이 없으면 닫지 않고 job을 실패시킨다.
#   수도권 topology 갱신 PR은 같은 KST 날 만들어졌으면 ITX 수집분을 들고 있을 수 있어 그날은 닫지 않고 기다린다. 단계별 방식은 STAGE_RECREATE_MODE가 정본이다.
# - 후보 갱신 단계는 dispatch하지 않는다(정기 역할은 schedule 이벤트와 스케줄러 App의 dispatch에서만 쓸 수 있어 정기 실행과 스케줄러가 다시 만든다).
# - 같은 단계가 24시간 안에 3회를 넘게 닫히면 더 닫지 않고 job을 실패시켜 실패 이슈(#926, report-refresh-failure)로 드러낸다.
# - main push와 CI 완료(자동화 브랜치 PR)에서 돈다. 읽기는 github.token, 쓰기는 ref 삭제(contents: write)와 workflow 재실행(actions: write)뿐이고
#   PR 닫기만 App 설치 토큰(pull-requests: write)이다. 닫을 대상이 있을 때만 App 토큰을 받는다. PR 코드는 가져오거나 실행하지 않는다.
# - 저장소 변수 DATAPACK_AUTOMATION_AUTOMERGE가 true일 때만 돈다(기본 꺼짐, 코드가 켜지 않는다). 변수는 QA 보고 뒤 별도 설정 변경으로만 켠다.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  recreate:
    name: Automation PR recreate
    if: ${{ vars.DATAPACK_AUTOMATION_AUTOMERGE == 'true' && (github.event_name == 'push' || (github.event.workflow_run.event == 'pull_request' && startsWith(github.event.workflow_run.head_branch, 'automation/') && github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    concurrency:
      group: automation-pr-recreate
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: read
    timeout-minutes: 10
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
      - name: Plan the behind automation pull requests
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node tools/ci/automation-pr-recreate.mjs plan --repository "${GITHUB_REPOSITORY}" --github-output "${GITHUB_OUTPUT}"
      - name: Mint App token for closing pull requests
        id: app-token
        if: ${{ steps.plan.outputs.targets != '0' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.EASYSUBWAY_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.EASYSUBWAY_RELEASE_APP_PRIVATE_KEY }}
          owner: AquilaXk
          repositories: easysubway-data
          permission-pull-requests: write
      - name: Close behind automation pull requests and request a fresh run
        if: ${{ steps.plan.outputs.targets != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          node tools/ci/automation-pr-recreate.mjs run --repository "${GITHUB_REPOSITORY}"
      - name: Report refresh failure as an issue
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/ci/report-refresh-failure.mjs --workflow automation-pr-behind-recreate.yml --repository "${GITHUB_REPOSITORY}" --run-id "${GITHUB_RUN_ID}"
