name: KRIC EXIT Full-Capital Refresh

on:
  schedule:
    - cron: "41 */2 * * *"
  workflow_dispatch:
    inputs:
      recovery_producer_run_id:
        description: Inspect one canonical producer run for guarded ancestor recovery
        required: false
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: kric-exit-full-capital-refresh-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    name: Produce immutable EXIT source
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      actions: read
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    environment: datapack-release-check
    timeout-minutes: 45
    outputs:
      state: ${{ steps.source-outputs.outputs.state }}
      facility_branch: ${{ steps.source-outputs.outputs.facility_branch }}
      facility_head_sha: ${{ steps.source-outputs.outputs.facility_head_sha }}
      exit_branch: ${{ steps.source-outputs.outputs.exit_branch }}
      producer_run_id: ${{ steps.source-outputs.outputs.producer_run_id }}
      main_sha: ${{ steps.source-outputs.outputs.main_sha }}
      claim_sha: ${{ steps.source-outputs.outputs.claim_sha }}
      builder_sha: ${{ steps.source-outputs.outputs.builder_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"

      - name: Prepare KRIC EXIT refresh paths
        run: |
          set -euo pipefail
          operation_root="${RUNNER_TEMP}/kric-exit-full-capital-refresh/${GITHUB_RUN_ID}"
          mkdir -p "${operation_root}"
          printf 'EXIT_REFRESH_OPERATION_ROOT=%s\n' "${operation_root}" >> "${GITHUB_ENV}"
          printf 'EXIT_REFRESH_DECISION=%s\n' "${RUNNER_TEMP}/kric-exit-full-capital-refresh/decision.json" >> "${GITHUB_ENV}"

      - name: Decide whether KRIC EXIT refresh is due
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_PRODUCER_RUN_ID: ${{ github.event.inputs.recovery_producer_run_id || '' }}
        run: |
          set -euo pipefail
          state_root="${RUNNER_TEMP}/kric-exit-full-capital-refresh"
          mkdir -p "${state_root}"
          gh pr list --repo "${GITHUB_REPOSITORY}" --state all --limit 1000 \
            --json number,state,isDraft,headRefName,headRefOid,baseRefName,headRepository,isCrossRepository,files > "${state_root}/prs.json"
          gh pr list --repo "${GITHUB_REPOSITORY}" --state open --limit 1000 \
            --json number,state,isDraft,headRefName,headRefOid,baseRefName,headRepository,isCrossRepository,files > "${state_root}/facility-prs.json"
          git ls-remote --heads origin "refs/heads/automation/6-kric-exit-full-capital-refresh-*" > "${state_root}/claims.txt"
          main_sha="$(git rev-parse HEAD)"
          claim_rows="${state_root}/claim-evidence.tsv"
          claim_evidence="${state_root}/claim-evidence.json"
          : > "${claim_rows}"
          while IFS=$'\t' read -r claim_sha claim_ref; do
            [[ -z "${claim_sha}" ]] && continue
            branch="${claim_ref#refs/heads/}"
            git fetch --no-tags origin "${claim_ref}"
            parent_sha="$(git rev-parse "${claim_sha}^")"
            commit_count="$(git rev-list --count "${main_sha}..${claim_sha}")"
            subject="$(git show -s --format=%s "${claim_sha}")"
            printf '%s\t%s\t%s\t%s\t%s\n' "${claim_sha}" "${branch}" "${parent_sha}" "${commit_count}" "${subject}" >> "${claim_rows}"
          done < "${state_root}/claims.txt"
          node --input-type=module -e '
            import { readFile, writeFile } from "node:fs/promises";
            const [rowsPath, outputPath] = process.argv.slice(1);
            const rows = (await readFile(rowsPath, "utf8")).split("\n").filter(Boolean).map((line) => {
              const fields = line.split("\t");
              if (fields.length !== 5) throw new Error("invalid claim evidence field count");
              const [sha, branch, parentSha, commitCount, subject] = fields;
              return { sha, branch, parentSha, commitCount: Number(commitCount), subject };
            });
            await writeFile(outputPath, JSON.stringify(rows) + "\n", { flag: "wx" });
          ' "${claim_rows}" "${claim_evidence}"
          recovery_producer_run_id="${RECOVERY_PRODUCER_RUN_ID}"
          decision_args=(
            --inventory tools/datapack/release/current-exit-admission-v2/exit-path-source-admission.json
            --policy release/product-gates/datapack-freshness-sla.json
            --prs "${state_root}/prs.json"
            --claims "${state_root}/claims.txt"
            --claim-evidence "${claim_evidence}"
            --current-main-sha "${main_sha}"
            --facility-prs "${state_root}/facility-prs.json"
            --repository "${GITHUB_REPOSITORY}"
            --output "${EXIT_REFRESH_DECISION}"
            --github-output "${GITHUB_OUTPUT}"
          )
          if [[ -n "${recovery_producer_run_id}" ]]; then
            [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]] || { echo "manual recovery selector is invalid" >&2; exit 1; }
            decision_args+=(--recovery-producer-run-id "${recovery_producer_run_id}")
          fi
          node tools/ci/decide-current-kric-exit-full-capital-refresh.mjs "${decision_args[@]}"

      - name: Bind selected FACILITY branch
        if: ${{ steps.decision.outputs.state == 'DUE' || steps.decision.outputs.state == 'EXPIRED' || steps.decision.outputs.state == 'RECOVER_CLAIM' }}
        run: |
          set -euo pipefail
          branch="${{ steps.decision.outputs.facility_branch }}"
          head_sha="${{ steps.decision.outputs.facility_head_sha }}"
          [[ "${branch}" =~ ^automation/629-kric-facility-refresh-[0-9]+$ ]] || { echo "FACILITY branch is invalid" >&2; exit 1; }
          [[ "${head_sha}" =~ ^[a-f0-9]{40}$ ]] || { echo "FACILITY head is invalid" >&2; exit 1; }
          git fetch --no-tags origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
          [[ "$(git rev-parse "origin/${branch}")" == "${head_sha}" ]] || { echo "FACILITY remote head changed" >&2; exit 1; }
          {
            printf 'EXIT_REFRESH_FACILITY_BRANCH=%s\n' "${branch}"
            printf 'EXIT_REFRESH_FACILITY_HEAD_SHA=%s\n' "${head_sha}"
          } >> "${GITHUB_ENV}"

      - name: Inspect selected current FACILITY identity
        if: ${{ steps.decision.outputs.state == 'INSPECT_SELECTED_CLAIM' }}
        run: |
          set -euo pipefail
          branch="${{ steps.decision.outputs.facility_branch }}"
          head_sha="${{ steps.decision.outputs.facility_head_sha }}"
          [[ "${branch}" =~ ^automation/629-kric-facility-refresh-[0-9]+$ ]] || { echo "FACILITY branch is invalid" >&2; exit 1; }
          [[ "${head_sha}" =~ ^[a-f0-9]{40}$ ]] || { echo "FACILITY head is invalid" >&2; exit 1; }
          git fetch --no-tags origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
          [[ "$(git rev-parse "origin/${branch}")" == "${head_sha}" ]] || { echo "FACILITY remote head changed" >&2; exit 1; }
          {
            printf 'EXIT_REFRESH_FACILITY_BRANCH=%s\n' "${branch}"
            printf 'EXIT_REFRESH_FACILITY_HEAD_SHA=%s\n' "${head_sha}"
          } >> "${GITHUB_ENV}"

      - name: Normalize exact Data origin before claiming
        if: ${{ steps.decision.outputs.state == 'DUE' || steps.decision.outputs.state == 'EXPIRED' }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          [[ "$(git remote get-url origin)" == "https://github.com/${GITHUB_REPOSITORY}.git" ]] || { echo "Data origin normalization failed" >&2; exit 1; }

      - name: Require source-main ancestry before claiming
        if: ${{ steps.decision.outputs.state == 'DUE' || steps.decision.outputs.state == 'EXPIRED' }}
        run: |
          set -euo pipefail
          source_main_sha="$(git rev-parse HEAD)"
          [[ "${source_main_sha}" =~ ^[a-f0-9]{40}$ ]] || { echo "source main identity is invalid" >&2; exit 1; }
          EXIT_REFRESH_SOURCE_MAIN_SHA="${source_main_sha}" node --input-type=module -e '
            import { execFileSync } from "node:child_process";
            const sourceMainSha = process.env.EXIT_REFRESH_SOURCE_MAIN_SHA;
            try {
              execFileSync("git", ["merge-base", "--is-ancestor", sourceMainSha, process.env.EXIT_REFRESH_FACILITY_HEAD_SHA], { cwd: process.env.GITHUB_WORKSPACE, stdio: "ignore" });
            } catch {
              throw new Error("source main is not an ancestor of selected FACILITY head");
            }
          '

      - name: Create durable claim before provider access
        if: ${{ steps.decision.outputs.state == 'DUE' || steps.decision.outputs.state == 'EXPIRED' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="automation/6-kric-exit-full-capital-refresh-${GITHUB_RUN_ID}"
          main_sha="$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git commit --allow-empty -m "Claim KRIC EXIT full-capital refresh"
          claim_sha="$(git rev-parse HEAD)"
          gh auth setup-git
          git push origin "${branch}"
          git switch main
          [[ "$(git rev-parse HEAD)" == "${main_sha}" ]] || { echo "EXIT producer is not on claimed main" >&2; exit 1; }
          {
            printf 'EXIT_REFRESH_BRANCH=%s\n' "${branch}"
            printf 'EXIT_REFRESH_MAIN_SHA=%s\n' "${main_sha}"
            printf 'EXIT_REFRESH_CLAIM_SHA=%s\n' "${claim_sha}"
            printf 'EXIT_REFRESH_PRODUCER_RUN_ID=%s\n' "${GITHUB_RUN_ID}"
          } >> "${GITHUB_ENV}"

      - name: Validate provider and OCI configuration
        if: ${{ steps.decision.outputs.state == 'DUE' || steps.decision.outputs.state == 'EXPIRED' }}
        env:
          KRIC_SERVICE_KEY: ${{ secrets.KRIC_SERVICE_KEY }}
          EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL: ${{ secrets.EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL }}
        run: |
          set -euo pipefail
          [[ -n "${KRIC_SERVICE_KEY:-}" && "${KRIC_SERVICE_KEY}" != *$'\n'* && "${KRIC_SERVICE_KEY}" != *$'\r'* ]] || { echo "KRIC_SERVICE_KEY must be a nonempty single line" >&2; exit 1; }
          [[ -n "${EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL:-}" && "${EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL}" != *$'\n'* && "${EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL}" != *$'\r'* ]] || { echo "EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL must be a nonempty single line" >&2; exit 1; }

      - name: Produce immutable EXIT source handoff from exact main
        if: ${{ steps.decision.outputs.state == 'DUE' || steps.decision.outputs.state == 'EXPIRED' }}
        env:
          KRIC_SERVICE_KEY: ${{ secrets.KRIC_SERVICE_KEY }}
          EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL: ${{ secrets.EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL }}
        run: |
          set -euo pipefail
          [[ "$(git branch --show-current)" == "main" && "$(git rev-parse HEAD)" == "${EXIT_REFRESH_MAIN_SHA}" ]] || { echo "EXIT producer is not on exact main" >&2; exit 1; }
          retained_root="${EXIT_REFRESH_OPERATION_ROOT}/retained-facility"
          private_builder_root="${EXIT_REFRESH_OPERATION_ROOT}/private-builder"
          git worktree add --detach "${retained_root}" "${EXIT_REFRESH_FACILITY_HEAD_SHA}"
          EXIT_REFRESH_RETAINED_ROOT="${retained_root}" node --input-type=module -e '
            import { assertCurrentCapitalExitItxAuthorityFresh } from "./tools/datapack/run-current-capital-live-chain.mjs";
            await assertCurrentCapitalExitItxAuthorityFresh({ repositoryRoot: process.env.EXIT_REFRESH_RETAINED_ROOT });
          '
          git worktree add --detach "${private_builder_root}" "${EXIT_REFRESH_FACILITY_HEAD_SHA}"
          node tools/datapack/collect-capital-route-topology.mjs --download --output "${EXIT_REFRESH_OPERATION_ROOT}/capital-route-topology.json"
          node tools/datapack/collect-incheon-station-info.mjs --download --output "${EXIT_REFRESH_OPERATION_ROOT}/incheon-transit-station-info.json"
          station_stamp="$(node --input-type=module -e 'import { readFile, rename } from "node:fs/promises"; const root = process.env.EXIT_REFRESH_OPERATION_ROOT; const file = root + "/incheon-transit-station-info.json"; const value = JSON.parse(await readFile(file)); if (value.sourceId !== "incheon-transit-station-info" || new Date(value.capturedAt).toISOString() !== value.capturedAt) throw new Error("Incheon topology collector identity mismatch"); const stamp = value.capturedAt.slice(0, 10).replaceAll("-", ""); await rename(file, root + "/incheon-transit-station-info-" + stamp + ".json"); process.stdout.write(stamp);')"
          mkdir -p "${EXIT_REFRESH_OPERATION_ROOT}/timetables"
          node tools/datapack/collect-incheon-timetable.mjs --download --topology-snapshot "${EXIT_REFRESH_OPERATION_ROOT}/incheon-transit-station-info-${station_stamp}.json" --output-dir "${EXIT_REFRESH_OPERATION_ROOT}/timetables"
          # shellcheck disable=SC2016
          EXIT_REFRESH_PRIVATE_BUILDER_ROOT="${private_builder_root}" EXIT_REFRESH_STATION_STAMP="${station_stamp}" node --input-type=module -e '
            import { readFile, readdir, writeFile } from "node:fs/promises";
            import path from "node:path";
            const operation = process.env.EXIT_REFRESH_OPERATION_ROOT; const builder = process.env.EXIT_REFRESH_PRIVATE_BUILDER_ROOT;
            const capital = JSON.parse(await readFile(operation + "/capital-route-topology.json")); const station = JSON.parse(await readFile(operation + "/incheon-transit-station-info-" + process.env.EXIT_REFRESH_STATION_STAMP + ".json"));
            const names = await readdir(operation + "/timetables"); if (names.length !== 2) throw new Error("Incheon timetable output count mismatch");
            const parsed = await Promise.all(names.map(async (name) => [name, JSON.parse(await readFile(operation + "/timetables/" + name))]));
            const line1 = parsed.find(([, value]) => value.sourceId === "incheon-line1-train-timetable"); const line2 = parsed.find(([, value]) => value.sourceId === "incheon-line2-train-timetable");
            const utc = (value) => { if (new Date(value).toISOString() !== value) throw new Error("topology capture timestamp mismatch"); return value.slice(0, 10).replaceAll("-", ""); };
            const seoul = (value) => new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul", year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(new Date(value)).filter(({ type }) => type !== "literal").map(({ value: part }) => part).join("");
            if (capital.sourceId !== "capital-route-topology" || station.sourceId !== "incheon-transit-station-info" || !line1 || !line2) throw new Error("topology capture identity mismatch");
            const rows = [["capitalTopologyPath", "tools/datapack/sources/capital-route-topology-" + utc(capital.capturedAt) + ".json", operation + "/capital-route-topology.json"], ["incheonTopologyPath", "tools/datapack/sources/incheon-transit-station-info-" + utc(station.capturedAt) + ".json", operation + "/incheon-transit-station-info-" + process.env.EXIT_REFRESH_STATION_STAMP + ".json"], ["incheonLine1TimetablePath", "tools/datapack/sources/incheon-line1-train-timetable-" + seoul(line1[1].capturedAt) + ".json", operation + "/timetables/" + line1[0]], ["incheonLine2TimetablePath", "tools/datapack/sources/incheon-line2-train-timetable-" + seoul(line2[1].capturedAt) + ".json", operation + "/timetables/" + line2[0]]];
            for (const [, relative, source] of rows) await writeFile(path.join(builder, relative), await readFile(source), { flag: "wx", mode: 0o600 });
            const inventory = JSON.parse(await readFile(builder + "/tools/datapack/source-inventory.json")); const incheon = inventory.sources.find(({ id }) => id === "incheon-transit-accessibility"); const candidate = JSON.parse(await readFile(builder + "/tools/datapack/release/candidate-build-spec.json"));
            const accessibilityId = incheon?.registrationEvidence?.snapshotId; if (!/^incheon-transit-accessibility-[0-9]{8}T[0-9]{9}Z$/u.test(accessibilityId ?? "") || typeof candidate.itxTopologyEvidencePath !== "string") throw new Error("topology dependency identity mismatch");
            const currentItxAdmission = candidate.networkEdgeEvidence?.itxCurrentTopologyAdmission?.path ?? null;
            await writeFile(operation + "/topology-build.json", JSON.stringify({ buildNow: new Date().toISOString(), capitalTopologyPath: rows[0][1], incheonTopologyPath: rows[1][1], incheonLine1TimetablePath: rows[2][1], incheonLine2TimetablePath: rows[3][1], incheonAccessibilityPath: "tools/datapack/sources/" + accessibilityId + ".json", itxCurrentAdmissionPath: currentItxAdmission, itxTopologyEvidencePath: candidate.itxTopologyEvidencePath }) + "\n", { flag: "wx", mode: 0o600 });
          '
          git -C "${private_builder_root}" add tools/datapack/sources
          mapfile -t builder_paths < <(git -C "${private_builder_root}" diff --cached --name-only)
          [[ "${#builder_paths[@]}" == "4" ]] || { echo "private builder input count mismatch" >&2; exit 1; }
          git -C "${private_builder_root}" config user.name "github-actions[bot]"
          git -C "${private_builder_root}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "${private_builder_root}" commit -m "Stage current topology inputs"
          builder_sha="$(git -C "${private_builder_root}" rev-parse HEAD)"
          [[ "$(git -C "${private_builder_root}" rev-parse HEAD^)" == "${EXIT_REFRESH_FACILITY_HEAD_SHA}" ]] || { echo "private builder parent mismatch" >&2; exit 1; }
          private_ref="refs/easysubway-private/topology-${GITHUB_RUN_ID}"
          git update-ref "${private_ref}" "${builder_sha}"
          git bundle create "${EXIT_REFRESH_OPERATION_ROOT}/private-builder.bundle" "${private_ref}" "^${EXIT_REFRESH_FACILITY_HEAD_SHA}"
          git update-ref -d "${private_ref}"
          export EXIT_REFRESH_RETAINED_ROOT="${retained_root}"
          export EXIT_REFRESH_PRIVATE_BUILDER_ROOT="${private_builder_root}"
          export EXIT_REFRESH_BUILDER_SHA="${builder_sha}"
          printf 'EXIT_REFRESH_RETAINED_ROOT=%s\nEXIT_REFRESH_PRIVATE_BUILDER_ROOT=%s\nEXIT_REFRESH_BUILDER_SHA=%s\n' "${retained_root}" "${private_builder_root}" "${builder_sha}" >> "${GITHUB_ENV}"
          # shellcheck disable=SC2016
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            import { runCurrentCapitalExitOnlyProducer } from "./tools/datapack/run-current-capital-live-chain.mjs";
            await runCurrentCapitalExitOnlyProducer({
              repositoryRoot: process.env.GITHUB_WORKSPACE,
              retainedRoot: process.env.EXIT_REFRESH_RETAINED_ROOT,
              privateBuilderRoot: process.env.EXIT_REFRESH_PRIVATE_BUILDER_ROOT,
              builderGitSha: process.env.EXIT_REFRESH_BUILDER_SHA,
              topologyBuild: JSON.parse(await readFile(`${process.env.EXIT_REFRESH_OPERATION_ROOT}/topology-build.json`)),
              runnerTemp: process.env.RUNNER_TEMP,
              repository: process.env.GITHUB_REPOSITORY,
              repositorySha: process.env.EXIT_REFRESH_MAIN_SHA,
              operationId: `kric-exit-full-capital-refresh-${process.env.GITHUB_RUN_ID}`,
              handoffDirectory: `${process.env.EXIT_REFRESH_OPERATION_ROOT}/source-handoff`,
              facilityPullRequest: { repository: process.env.GITHUB_REPOSITORY, branch: process.env.EXIT_REFRESH_FACILITY_BRANCH, headSha: process.env.EXIT_REFRESH_FACILITY_HEAD_SHA },
            });
          '
          cp "${EXIT_REFRESH_OPERATION_ROOT}/private-builder.bundle" "${EXIT_REFRESH_OPERATION_ROOT}/source-handoff/private-builder.bundle"

      - name: Upload immutable EXIT source handoff
        if: ${{ always() && (steps.decision.outputs.state == 'DUE' || steps.decision.outputs.state == 'EXPIRED') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kric-exit-full-capital-source-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/kric-exit-full-capital-refresh/${{ github.run_id }}/source-handoff/current-kric-exit-provider-oci-plan.json
            ${{ runner.temp }}/kric-exit-full-capital-refresh/${{ github.run_id }}/source-handoff/current-kric-exit-provider-oci-receipt.json
            ${{ runner.temp }}/kric-exit-full-capital-refresh/${{ github.run_id }}/source-handoff/current-capital-exit-provider-source-handoff.json
            ${{ runner.temp }}/kric-exit-full-capital-refresh/${{ github.run_id }}/source-handoff/current-capital-topology-terminal-handoff.json
            ${{ runner.temp }}/kric-exit-full-capital-refresh/${{ github.run_id }}/source-handoff/private-builder.bundle
          if-no-files-found: error
          retention-days: 14

      - name: Remove private producer worktrees
        if: ${{ always() && (steps.decision.outputs.state == 'DUE' || steps.decision.outputs.state == 'EXPIRED') }}
        run: |
          set -euo pipefail
          for entry in "retained-facility:${EXIT_REFRESH_FACILITY_HEAD_SHA}" "private-builder:${EXIT_REFRESH_BUILDER_SHA:-}"; do
            directory="${EXIT_REFRESH_OPERATION_ROOT}/${entry%%:*}"
            expected="${entry#*:}"
            if [[ -e "${directory}" ]]; then
              actual="$(git -C "${directory}" rev-parse HEAD)"
              if [[ -z "${expected}" ]]; then
                [[ "${entry%%:*}" == "private-builder" && "${actual}" == "${EXIT_REFRESH_FACILITY_HEAD_SHA}" ]] || { echo "private producer worktree identity mismatch" >&2; exit 1; }
              else
                [[ "${actual}" == "${expected}" ]] || { echo "private producer worktree identity mismatch" >&2; exit 1; }
              fi
              git worktree remove --force "${directory}"
            fi
          done

      - name: Recover immutable EXIT source handoff
        if: ${{ steps.decision.outputs.state == 'RECOVER_CLAIM' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="${{ steps.decision.outputs.branch }}"
          producer_run_id="${{ steps.decision.outputs.producer_run_id }}"
          [[ "${producer_run_id}" =~ ^[1-9][0-9]*$ ]] || { echo "EXIT claim run identity is invalid" >&2; exit 1; }
          [[ "${branch}" == "automation/6-kric-exit-full-capital-refresh-${producer_run_id}" ]] || { echo "EXIT claim/run identity mismatch" >&2; exit 1; }
          git fetch --no-tags origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
          claim_sha="$(git rev-parse "origin/${branch}")"
          producer_main_sha="$(git rev-parse "origin/${branch}^")"
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${producer_run_id}")"
          jobs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${producer_run_id}/jobs?filter=all&per_page=100")"
          # shellcheck disable=SC2016
          RUN_JSON="${run_json}" JOBS_JSON="${jobs_json}" PRODUCER_RUN_ID="${producer_run_id}" EXIT_REFRESH_MAIN_SHA="${producer_main_sha}" node --input-type=module -e '
            const run = JSON.parse(process.env.RUN_JSON);
            const jobs = JSON.parse(process.env.JOBS_JSON)?.jobs?.filter((job) => job?.name === "Produce immutable EXIT source") ?? [];
            if (run?.status !== "completed" || typeof run?.conclusion !== "string" || run?.head_repository?.full_name !== process.env.GITHUB_REPOSITORY || run?.head_sha !== process.env.EXIT_REFRESH_MAIN_SHA || typeof run?.path !== "string" || !run.path.startsWith(".github/workflows/kric-exit-full-capital-refresh.yml@") || jobs.length !== 1 || jobs[0].conclusion !== "success" || jobs[0].run_id !== Number(process.env.PRODUCER_RUN_ID) || jobs[0].head_sha !== process.env.EXIT_REFRESH_MAIN_SHA) throw new Error("producer workflow identity mismatch");
          '
          artifact_name="kric-exit-full-capital-source-${producer_run_id}"
          artifacts="${RUNNER_TEMP}/kric-exit-full-capital-refresh/producer-artifacts.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${producer_run_id}/artifacts?name=${artifact_name}&per_page=100" > "${artifacts}"
          node tools/ci/require-workflow-artifact.mjs "${artifacts}" "${artifact_name}" "${producer_run_id}" "${producer_main_sha}"
          gh run download "${producer_run_id}" --repo "${GITHUB_REPOSITORY}" --name "${artifact_name}" --dir "${EXIT_REFRESH_OPERATION_ROOT}/source-handoff"
          # shellcheck disable=SC2016
          EXIT_REFRESH_SOURCE_HANDOFF="${EXIT_REFRESH_OPERATION_ROOT}/source-handoff" node --input-type=module -e '
            import { lstat, readFile, readdir } from "node:fs/promises";
            import path from "node:path";
            import { createHash } from "node:crypto";
            import { canonicalCurrentCapitalExitProviderSourceHandoffJson } from "./tools/datapack/current-capital-exit-provider-handoff.mjs";
            import { canonicalCurrentKricExitProviderOciPlanJson } from "./tools/datapack/build-current-kric-exit-provider-oci-plan.mjs";
            import { canonicalCurrentKricExitProviderOciReceiptJson } from "./tools/datapack/build-current-kric-exit-provider-oci-receipt.mjs";
            import { canonicalJson } from "./tools/datapack/lib/manifest-validation.mjs";
            const root = process.env.EXIT_REFRESH_SOURCE_HANDOFF;
            const names = ["current-kric-exit-provider-oci-plan.json", "current-kric-exit-provider-oci-receipt.json", "current-capital-exit-provider-source-handoff.json", "current-capital-topology-terminal-handoff.json", "private-builder.bundle"];
            const actual = await readdir(root); if (actual.length !== names.length || names.some((name) => !actual.includes(name))) throw new Error("producer artifact file set is invalid");
            for (const name of names) { const stat = await lstat(path.join(root, name)); if (!stat.isFile() || stat.isSymbolicLink()) throw new Error("producer artifact path is invalid"); }
            const [planBytes, receiptBytes, handoffBytes, topologyBytes] = await Promise.all(names.slice(0, 4).map((name) => readFile(path.join(root, name))));
            const value = JSON.parse(handoffBytes); const plan = JSON.parse(planBytes); const receipt = JSON.parse(receiptBytes);
            const topology = JSON.parse(topologyBytes); const { handoffSha256, ...topologyPayload } = topology;
            if (!handoffBytes.equals(Buffer.from(`${canonicalCurrentCapitalExitProviderSourceHandoffJson(value)}\n`)) || !planBytes.equals(Buffer.from(`${canonicalCurrentKricExitProviderOciPlanJson(plan)}\n`)) || !receiptBytes.equals(Buffer.from(`${canonicalCurrentKricExitProviderOciReceiptJson(receipt, { planBytes })}\n`)) || !topologyBytes.equals(Buffer.from(`${canonicalJson(topology)}\n`)) || handoffSha256 !== createHash("sha256").update(Buffer.from(canonicalJson(topologyPayload))).digest("hex") || topology.repository !== process.env.GITHUB_REPOSITORY || topology.sourceMainGitSha !== value.sourceMainSha || topology.operationId !== value.sourceOperationId || topology.facility?.branch !== process.env.EXIT_REFRESH_FACILITY_BRANCH || topology.facility?.headSha !== process.env.EXIT_REFRESH_FACILITY_HEAD_SHA || topology.itxProviderCalls !== 0 || value.sourceProviderOciPlanSha256 !== createHash("sha256").update(planBytes).digest("hex") || value.sourceProviderOciReceiptSha256 !== createHash("sha256").update(receiptBytes).digest("hex") || plan.mainSha !== value.sourceMainSha || plan.operationId !== value.sourceOperationId || receipt.mainSha !== value.sourceMainSha || receipt.operationId !== value.sourceOperationId) throw new Error("producer artifact cross-digest mismatch");
          '
          git bundle verify "${EXIT_REFRESH_OPERATION_ROOT}/source-handoff/private-builder.bundle"
          # shellcheck disable=SC2016
          EXIT_REFRESH_SOURCE_HANDOFF="${EXIT_REFRESH_OPERATION_ROOT}/source-handoff" node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const topology = JSON.parse(await readFile(process.env.EXIT_REFRESH_SOURCE_HANDOFF + "/current-capital-topology-terminal-handoff.json"));
            process.stdout.write(`EXIT_REFRESH_BUILDER_SHA=${topology.builderGitSha}\n`);
          ' >> "${GITHUB_ENV}"
          {
            printf 'EXIT_REFRESH_MAIN_SHA=%s\n' "${producer_main_sha}"
            printf 'EXIT_REFRESH_BRANCH=%s\n' "${branch}"
            printf 'EXIT_REFRESH_CLAIM_SHA=%s\n' "${claim_sha}"
            printf 'EXIT_REFRESH_PRODUCER_RUN_ID=%s\n' "${producer_run_id}"
          } >> "${GITHUB_ENV}"

      - name: Verify selected ancestor recovery handoff
        if: ${{ steps.decision.outputs.state == 'INSPECT_SELECTED_CLAIM' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          producer_run_id="${{ steps.decision.outputs.producer_run_id }}"
          branch="${{ steps.decision.outputs.branch }}"
          [[ "${producer_run_id}" =~ ^[1-9][0-9]*$ ]] || { echo "selected producer run identity is invalid" >&2; exit 1; }
          [[ "${branch}" == "automation/6-kric-exit-full-capital-refresh-${producer_run_id}" ]] || { echo "selected claim/run identity mismatch" >&2; exit 1; }
          git fetch --no-tags origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
          claim_sha="$(git rev-parse "origin/${branch}")"
          producer_main_sha="$(git rev-parse "origin/${branch}^")"
          current_main_sha="$(git rev-parse HEAD)"
          [[ "$(git show -s --format=%s "${claim_sha}")" == "Claim KRIC EXIT full-capital refresh" ]] || { echo "selected claim subject mismatch" >&2; exit 1; }
          [[ "$(git rev-list --count "${producer_main_sha}..${claim_sha}")" == "1" ]] || { echo "selected claim commit count mismatch" >&2; exit 1; }
          git merge-base --is-ancestor "${producer_main_sha}" "${current_main_sha}"
          git merge-base --is-ancestor "${current_main_sha}" "${EXIT_REFRESH_FACILITY_HEAD_SHA}"
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${producer_run_id}")"
          jobs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${producer_run_id}/jobs?filter=all&per_page=100")"
          # shellcheck disable=SC2016
          RUN_JSON="${run_json}" JOBS_JSON="${jobs_json}" PRODUCER_RUN_ID="${producer_run_id}" EXIT_REFRESH_MAIN_SHA="${producer_main_sha}" node --input-type=module -e '
            const run = JSON.parse(process.env.RUN_JSON);
            const jobs = JSON.parse(process.env.JOBS_JSON)?.jobs?.filter((job) => job?.name === "Produce immutable EXIT source") ?? [];
            if (run?.status !== "completed" || run?.conclusion !== "failure" || run?.head_repository?.full_name !== process.env.GITHUB_REPOSITORY || run?.head_sha !== process.env.EXIT_REFRESH_MAIN_SHA || typeof run?.path !== "string" || !run.path.startsWith(".github/workflows/kric-exit-full-capital-refresh.yml@") || jobs.length !== 1 || jobs[0].conclusion !== "success" || jobs[0].run_id !== Number(process.env.PRODUCER_RUN_ID) || jobs[0].head_sha !== process.env.EXIT_REFRESH_MAIN_SHA) throw new Error("selected producer workflow identity mismatch");
          '
          artifact_name="kric-exit-full-capital-source-${producer_run_id}"
          artifacts="${RUNNER_TEMP}/kric-exit-full-capital-refresh/selected-producer-artifacts.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${producer_run_id}/artifacts?name=${artifact_name}&per_page=100" > "${artifacts}"
          node tools/ci/require-workflow-artifact.mjs "${artifacts}" "${artifact_name}" "${producer_run_id}" "${producer_main_sha}"
          selected_handoff="${EXIT_REFRESH_OPERATION_ROOT}/selected-source-handoff"
          gh run download "${producer_run_id}" --repo "${GITHUB_REPOSITORY}" --name "${artifact_name}" --dir "${selected_handoff}"
          # shellcheck disable=SC2016
          identity_lines="$(EXIT_REFRESH_SOURCE_HANDOFF="${selected_handoff}" node --input-type=module -e '
            import { lstat, readFile, readdir } from "node:fs/promises";
            import path from "node:path";
            import { createHash } from "node:crypto";
            import { canonicalCurrentCapitalExitProviderSourceHandoffJson } from "./tools/datapack/current-capital-exit-provider-handoff.mjs";
            import { canonicalCurrentKricExitProviderOciPlanJson } from "./tools/datapack/build-current-kric-exit-provider-oci-plan.mjs";
            import { canonicalCurrentKricExitProviderOciReceiptJson } from "./tools/datapack/build-current-kric-exit-provider-oci-receipt.mjs";
            import { canonicalJson } from "./tools/datapack/lib/manifest-validation.mjs";
            const root = process.env.EXIT_REFRESH_SOURCE_HANDOFF;
            const names = ["current-kric-exit-provider-oci-plan.json", "current-kric-exit-provider-oci-receipt.json", "current-capital-exit-provider-source-handoff.json", "current-capital-topology-terminal-handoff.json", "private-builder.bundle"];
            const actual = await readdir(root); if (actual.length !== names.length || names.some((name) => !actual.includes(name))) throw new Error("selected producer artifact file set is invalid");
            for (const name of names) { const stat = await lstat(path.join(root, name)); if (!stat.isFile() || stat.isSymbolicLink()) throw new Error("selected producer artifact path is invalid"); }
            const [planBytes, receiptBytes, handoffBytes, topologyBytes] = await Promise.all(names.slice(0, 4).map((name) => readFile(path.join(root, name))));
            const source = JSON.parse(handoffBytes); const plan = JSON.parse(planBytes); const receipt = JSON.parse(receiptBytes); const topology = JSON.parse(topologyBytes); const { handoffSha256, ...topologyPayload } = topology;
            if (!handoffBytes.equals(Buffer.from(`${canonicalCurrentCapitalExitProviderSourceHandoffJson(source)}\n`)) || !planBytes.equals(Buffer.from(`${canonicalCurrentKricExitProviderOciPlanJson(plan)}\n`)) || !receiptBytes.equals(Buffer.from(`${canonicalCurrentKricExitProviderOciReceiptJson(receipt, { planBytes })}\n`)) || !topologyBytes.equals(Buffer.from(`${canonicalJson(topology)}\n`)) || handoffSha256 !== createHash("sha256").update(Buffer.from(canonicalJson(topologyPayload))).digest("hex") || topology.repository !== process.env.GITHUB_REPOSITORY || topology.sourceMainGitSha !== source.sourceMainSha || topology.operationId !== source.sourceOperationId || !/^automation\/629-kric-facility-refresh-[0-9]+$/u.test(topology.facility?.branch ?? "") || !/^[a-f0-9]{40}$/u.test(topology.facility?.headSha ?? "") || !/^[a-f0-9]{40}$/u.test(topology.builderGitSha ?? "") || topology.itxProviderCalls !== 0 || source.sourceProviderOciPlanSha256 !== createHash("sha256").update(planBytes).digest("hex") || source.sourceProviderOciReceiptSha256 !== createHash("sha256").update(receiptBytes).digest("hex") || plan.mainSha !== source.sourceMainSha || plan.operationId !== source.sourceOperationId || receipt.mainSha !== source.sourceMainSha || receipt.operationId !== source.sourceOperationId) throw new Error("selected producer artifact cross-digest mismatch");
            process.stdout.write(`${topology.facility.branch}\t${topology.facility.headSha}\t${topology.builderGitSha}`);
          ')"
          IFS=$'\t' read -r ancestor_facility_branch ancestor_facility_head_sha ancestor_builder_sha <<< "${identity_lines}"
          [[ "${ancestor_facility_branch}" =~ ^automation/629-kric-facility-refresh-[0-9]+$ && "${ancestor_facility_head_sha}" =~ ^[a-f0-9]{40}$ && "${ancestor_builder_sha}" =~ ^[a-f0-9]{40}$ ]] || { echo "selected producer topology identity mismatch" >&2; exit 1; }
          git merge-base --is-ancestor "${ancestor_facility_head_sha}" "${EXIT_REFRESH_FACILITY_HEAD_SHA}"
          {
            printf 'EXIT_REFRESH_BRANCH=%s\n' "${branch}"
            printf 'EXIT_REFRESH_MAIN_SHA=%s\n' "${producer_main_sha}"
            printf 'EXIT_REFRESH_CLAIM_SHA=%s\n' "${claim_sha}"
            printf 'EXIT_REFRESH_PRODUCER_RUN_ID=%s\n' "${producer_run_id}"
            printf 'EXIT_REFRESH_BUILDER_SHA=%s\n' "${ancestor_builder_sha}"
            printf 'EXIT_REFRESH_ANCESTOR_FACILITY_BRANCH=%s\n' "${ancestor_facility_branch}"
            printf 'EXIT_REFRESH_ANCESTOR_FACILITY_HEAD_SHA=%s\n' "${ancestor_facility_head_sha}"
            printf 'EXIT_REFRESH_ANCESTOR_BUILDER_SHA=%s\n' "${ancestor_builder_sha}"
            printf 'EXIT_REFRESH_ANCESTOR_RECOVERY_PREFLIGHTED=true\n'
          } >> "${GITHUB_ENV}"

      - name: Export immutable source identity
        id: source-outputs
        if: ${{ steps.decision.outputs.state == 'DUE' || steps.decision.outputs.state == 'EXPIRED' || steps.decision.outputs.state == 'RECOVER_CLAIM' || steps.decision.outputs.state == 'INSPECT_SELECTED_CLAIM' }}
        run: |
          set -euo pipefail
          state="${{ steps.decision.outputs.state }}"
          if [[ "${state}" == "INSPECT_SELECTED_CLAIM" ]]; then
            [[ "${EXIT_REFRESH_ANCESTOR_RECOVERY_PREFLIGHTED:-}" == "true" ]] || { echo "selected ancestor recovery preflight is incomplete" >&2; exit 1; }
            state="INSPECTED_ANCESTOR_CLAIM"
          fi
          {
            printf 'state=%s\n' "${state}"
            printf 'facility_branch=%s\n' "${EXIT_REFRESH_FACILITY_BRANCH}"
            printf 'facility_head_sha=%s\n' "${EXIT_REFRESH_FACILITY_HEAD_SHA}"
            printf 'exit_branch=%s\n' "${EXIT_REFRESH_BRANCH}"
            printf 'producer_run_id=%s\n' "${EXIT_REFRESH_PRODUCER_RUN_ID}"
            printf 'main_sha=%s\n' "${EXIT_REFRESH_MAIN_SHA}"
            printf 'claim_sha=%s\n' "${EXIT_REFRESH_CLAIM_SHA}"
            printf 'builder_sha=%s\n' "${EXIT_REFRESH_BUILDER_SHA}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload refresh decision
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kric-exit-full-capital-refresh-${{ github.run_id }}
          path: ${{ runner.temp }}/kric-exit-full-capital-refresh/decision.json
          if-no-files-found: ignore
          retention-days: 14

  terminal:
    name: Commit verified EXIT terminal candidate
    needs: source
    if: ${{ needs.source.outputs.state == 'DUE' || needs.source.outputs.state == 'EXPIRED' || needs.source.outputs.state == 'RECOVER_CLAIM' || needs.source.outputs.state == 'INSPECTED_ANCESTOR_CLAIM' }}
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    environment: datapack-release-check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"

      - name: Normalize exact Data origin for terminal
        run: |
          set -euo pipefail
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          [[ "$(git remote get-url origin)" == "https://github.com/${GITHUB_REPOSITORY}.git" ]] || { echo "Data origin normalization failed" >&2; exit 1; }

      - name: Prepare terminal identities
        run: |
          set -euo pipefail
          operation_root="${RUNNER_TEMP}/kric-exit-full-capital-refresh/${GITHUB_RUN_ID}"
          mkdir -p "${operation_root}"
          {
            printf 'EXIT_REFRESH_OPERATION_ROOT=%s\n' "${operation_root}"
            printf 'EXIT_REFRESH_RECOVERY_STATE=%s\n' "${{ needs.source.outputs.state }}"
            printf 'EXIT_REFRESH_FACILITY_BRANCH=%s\n' "${{ needs.source.outputs.facility_branch }}"
            printf 'EXIT_REFRESH_FACILITY_HEAD_SHA=%s\n' "${{ needs.source.outputs.facility_head_sha }}"
            printf 'EXIT_REFRESH_BRANCH=%s\n' "${{ needs.source.outputs.exit_branch }}"
            printf 'EXIT_REFRESH_PRODUCER_RUN_ID=%s\n' "${{ needs.source.outputs.producer_run_id }}"
            printf 'EXIT_REFRESH_MAIN_SHA=%s\n' "${{ needs.source.outputs.main_sha }}"
            printf 'EXIT_REFRESH_CLAIM_SHA=%s\n' "${{ needs.source.outputs.claim_sha }}"
            printf 'EXIT_REFRESH_BUILDER_SHA=%s\n' "${{ needs.source.outputs.builder_sha }}"
          } >> "${GITHUB_ENV}"

      - name: Download immutable EXIT source handoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_name="kric-exit-full-capital-source-${EXIT_REFRESH_PRODUCER_RUN_ID}"
          gh run download "${EXIT_REFRESH_PRODUCER_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name "${artifact_name}" --dir "${EXIT_REFRESH_OPERATION_ROOT}/source-handoff"

      - name: Materialize selected FACILITY terminal candidate
        env:
          EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL: ${{ secrets.EASYSUBWAY_OBJECT_STORAGE_PREAUTH_BASE_URL }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/${EXIT_REFRESH_FACILITY_BRANCH}:refs/remotes/origin/${EXIT_REFRESH_FACILITY_BRANCH}"
          git switch --track -c "${EXIT_REFRESH_FACILITY_BRANCH}" "origin/${EXIT_REFRESH_FACILITY_BRANCH}"
          [[ "$(git rev-parse HEAD)" == "${EXIT_REFRESH_FACILITY_HEAD_SHA}" ]] || { echo "terminal candidate head changed" >&2; exit 1; }
          [[ "$(git rev-parse --abbrev-ref --symbolic-full-name '@{upstream}')" == "origin/${EXIT_REFRESH_FACILITY_BRANCH}" ]] || { echo "terminal candidate upstream mismatch" >&2; exit 1; }
          transfer_source_root="${EXIT_REFRESH_OPERATION_ROOT}/transfer-source"
          source_main_root="${EXIT_REFRESH_OPERATION_ROOT}/source-main"
          private_builder_root="${EXIT_REFRESH_OPERATION_ROOT}/private-builder"
          git worktree add --detach "${transfer_source_root}" "${EXIT_REFRESH_FACILITY_HEAD_SHA}"
          git worktree add --detach "${source_main_root}" "${EXIT_REFRESH_MAIN_SHA}"
          git bundle verify "${EXIT_REFRESH_OPERATION_ROOT}/source-handoff/private-builder.bundle"
          mapfile -t bundled_refs < <(git bundle unbundle "${EXIT_REFRESH_OPERATION_ROOT}/source-handoff/private-builder.bundle")
          [[ "${#bundled_refs[@]}" == "1" && "${bundled_refs[0]%%[[:space:]]*}" == "${EXIT_REFRESH_BUILDER_SHA}" ]] || { echo "private builder bundle identity mismatch" >&2; exit 1; }
          git worktree add --detach "${private_builder_root}" "${EXIT_REFRESH_BUILDER_SHA}"
          topology_handoff_path="${EXIT_REFRESH_OPERATION_ROOT}/source-handoff/current-capital-topology-terminal-handoff.json"
          if [[ "${EXIT_REFRESH_RECOVERY_STATE}" == "INSPECTED_ANCESTOR_CLAIM" ]]; then
            # shellcheck disable=SC2016
            topology_identity="$(EXIT_REFRESH_TOPOLOGY_HANDOFF="${topology_handoff_path}" node --input-type=module -e '
              import { readFile } from "node:fs/promises";
              const value = JSON.parse(await readFile(process.env.EXIT_REFRESH_TOPOLOGY_HANDOFF));
              if (!/^automation\/629-kric-facility-refresh-[0-9]+$/u.test(value?.facility?.branch ?? "") || !/^[a-f0-9]{40}$/u.test(value?.facility?.headSha ?? "") || !/^[a-f0-9]{40}$/u.test(value?.builderGitSha ?? "")) throw new Error("ancestor topology identity mismatch");
              process.stdout.write(`${value.facility.branch}\t${value.facility.headSha}\t${value.builderGitSha}`);
            ')"
            IFS=$'\t' read -r ancestor_facility_branch ancestor_facility_head_sha ancestor_builder_sha <<< "${topology_identity}"
            [[ "${ancestor_facility_branch}" == "${EXIT_REFRESH_FACILITY_BRANCH}" ]] || { echo "ancestor FACILITY branch changed" >&2; exit 1; }
            [[ "${ancestor_builder_sha}" == "${EXIT_REFRESH_BUILDER_SHA}" ]] || { echo "ancestor builder identity changed" >&2; exit 1; }
            git merge-base --is-ancestor "${EXIT_REFRESH_MAIN_SHA}" "$(git rev-parse origin/main)"
            git merge-base --is-ancestor "$(git rev-parse origin/main)" "${EXIT_REFRESH_FACILITY_HEAD_SHA}"
            git merge-base --is-ancestor "${ancestor_facility_head_sha}" "${EXIT_REFRESH_FACILITY_HEAD_SHA}"
            [[ "$(git -C "${private_builder_root}" rev-parse HEAD^)" == "${ancestor_facility_head_sha}" ]] || { echo "ancestor private builder parent mismatch" >&2; exit 1; }
            ancestor_retained_root="${EXIT_REFRESH_OPERATION_ROOT}/ancestor-retained"
            git worktree add --detach "${ancestor_retained_root}" "${ancestor_facility_head_sha}"
            export EXIT_REFRESH_ANCESTOR_RETAINED_ROOT="${ancestor_retained_root}"
            export EXIT_REFRESH_ANCESTOR_FACILITY_HEAD_SHA="${ancestor_facility_head_sha}"
          else
            [[ "$(git -C "${private_builder_root}" rev-parse HEAD^)" == "${EXIT_REFRESH_FACILITY_HEAD_SHA}" ]] || { echo "private builder parent mismatch" >&2; exit 1; }
          fi
          node "${GITHUB_WORKSPACE}/tools/datapack/recover-current-live-chain-transfer-observation.mjs" \
            --repository-root "${transfer_source_root}" \
            --recovery-root "${EXIT_REFRESH_OPERATION_ROOT}/transfer"
          export EXIT_REFRESH_SOURCE_MAIN_ROOT="${source_main_root}"
          export EXIT_REFRESH_PRIVATE_BUILDER_ROOT="${private_builder_root}"
          printf 'EXIT_REFRESH_SOURCE_MAIN_ROOT=%s\nEXIT_REFRESH_PRIVATE_BUILDER_ROOT=%s\nEXIT_REFRESH_ANCESTOR_RETAINED_ROOT=%s\nEXIT_REFRESH_ANCESTOR_FACILITY_HEAD_SHA=%s\n' "${source_main_root}" "${private_builder_root}" "${EXIT_REFRESH_ANCESTOR_RETAINED_ROOT:-}" "${EXIT_REFRESH_ANCESTOR_FACILITY_HEAD_SHA:-}" >> "${GITHUB_ENV}"
          # shellcheck disable=SC2016
          node --input-type=module -e '
            import { execFile } from "node:child_process";
            import { readFile, writeFile } from "node:fs/promises";
            import { promisify } from "node:util";
            import { canonicalJson } from "./tools/datapack/lib/manifest-validation.mjs";
            import { rebuildCurrentCapitalTopologyTerminalHandoffForAncestorRecovery, runCurrentCapitalExitTerminalConsumer } from "./tools/datapack/run-current-capital-live-chain.mjs";
            const run = promisify(execFile);
            const handoff = `${process.env.EXIT_REFRESH_OPERATION_ROOT}/source-handoff`;
            const originalTopologyHandoffBytes = await readFile(`${handoff}/current-capital-topology-terminal-handoff.json`);
            let topologyHandoffBytes = originalTopologyHandoffBytes;
            if (process.env.EXIT_REFRESH_RECOVERY_STATE === "INSPECTED_ANCESTOR_CLAIM") {
              const rebound = await rebuildCurrentCapitalTopologyTerminalHandoffForAncestorRecovery({
                repository: process.env.GITHUB_REPOSITORY, sourceMainRoot: process.env.EXIT_REFRESH_SOURCE_MAIN_ROOT,
                sourceMainGitSha: process.env.EXIT_REFRESH_MAIN_SHA, ancestorRetainedRoot: process.env.EXIT_REFRESH_ANCESTOR_RETAINED_ROOT,
                ancestorFacilityHeadGitSha: process.env.EXIT_REFRESH_ANCESTOR_FACILITY_HEAD_SHA,
                originalPrivateBuilderRoot: process.env.EXIT_REFRESH_PRIVATE_BUILDER_ROOT,
                originalBuilderGitSha: process.env.EXIT_REFRESH_BUILDER_SHA, currentRetainedRoot: process.env.GITHUB_WORKSPACE,
                currentFacilityBranch: process.env.EXIT_REFRESH_FACILITY_BRANCH,
                currentFacilityHeadGitSha: process.env.EXIT_REFRESH_FACILITY_HEAD_SHA, topologyHandoffBytes: originalTopologyHandoffBytes,
              });
              topologyHandoffBytes = Buffer.from(`${canonicalJson(rebound.topologyHandoff)}\n`);
            }
            const topologyHandoff = JSON.parse(topologyHandoffBytes);
            const result = await runCurrentCapitalExitTerminalConsumer({
              repositoryRoot: process.env.GITHUB_WORKSPACE, runnerTemp: process.env.RUNNER_TEMP, repository: process.env.GITHUB_REPOSITORY,
              sourceMainRoot: process.env.EXIT_REFRESH_SOURCE_MAIN_ROOT, sourceMainGitSha: process.env.EXIT_REFRESH_MAIN_SHA,
              privateBuilderRoot: process.env.EXIT_REFRESH_PRIVATE_BUILDER_ROOT, builderGitSha: process.env.EXIT_REFRESH_BUILDER_SHA,
              topologyBuild: topologyHandoff.topologyBuild, topologyHandoffBytes,
              candidateOperationId: `kric-exit-full-capital-terminal-${process.env.GITHUB_RUN_ID}`,
              operationNow: new Date(), sourceReceiptBytes: await readFile(`${handoff}/current-capital-exit-provider-source-handoff.json`),
              providerOciPlanBytes: await readFile(`${handoff}/current-kric-exit-provider-oci-plan.json`), providerOciReceiptBytes: await readFile(`${handoff}/current-kric-exit-provider-oci-receipt.json`),
              transferObservationDirectory: `${process.env.EXIT_REFRESH_OPERATION_ROOT}/transfer/observation`, transferReceiptPath: `${process.env.EXIT_REFRESH_OPERATION_ROOT}/transfer/receipt.json`,
              isAncestor: async (from, to) => { await run("git", ["merge-base", "--is-ancestor", from, to], { cwd: process.env.GITHUB_WORKSPACE }); return true; },
            });
            if (result.providerCalls !== 0 || result.ociGetCalls !== 1 || result.ociPutCalls !== 0) throw new Error("terminal OCI operation count mismatch");
            await writeFile(`${process.env.EXIT_REFRESH_OPERATION_ROOT}/terminal-result.json`, `${JSON.stringify(result)}\n`, { flag: "wx" });
          '

      - name: Commit exact terminal outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t replacements < <(node -e 'const value=JSON.parse(require("fs").readFileSync(process.env.EXIT_REFRESH_OPERATION_ROOT + "/terminal-result.json")); process.stdout.write(value.replacementPaths.join("\n"))')
          mapfile -t markers < <(node -e 'const value=JSON.parse(require("fs").readFileSync(process.env.EXIT_REFRESH_OPERATION_ROOT + "/terminal-result.json")); process.stdout.write(value.deletedMarkerPaths.join("\n"))')
          [[ "${#replacements[@]}" -gt 0 && "${#markers[@]}" == "2" ]] || { echo "terminal result path identity mismatch" >&2; exit 1; }
          git add -- "${replacements[@]}"
          git add -u -- "${markers[@]}"
          mapfile -t staged_paths < <(git diff --cached --name-only)
          mapfile -t expected_paths < <(printf '%s\n' "${replacements[@]}" "${markers[@]}" | LC_ALL=C sort -u)
          [[ "$(printf '%s\n' "${staged_paths[@]}")" == "$(printf '%s\n' "${expected_paths[@]}")" ]] || { echo "terminal staged path set mismatch" >&2; exit 1; }
          [[ -z "$(git diff --name-only)" && -z "$(git ls-files --others --exclude-standard)" ]] || { echo "terminal left an unsupported worktree delta" >&2; exit 1; }
          final_tree="$(git write-tree)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          terminal_parent_sha="${EXIT_REFRESH_BUILDER_SHA}"
          if [[ "${EXIT_REFRESH_RECOVERY_STATE}" == "INSPECTED_ANCESTOR_CLAIM" ]]; then terminal_parent_sha="${EXIT_REFRESH_FACILITY_HEAD_SHA}"; fi
          final_sha="$(printf '%s\n' 'Refresh KRIC EXIT full-capital snapshot' | git commit-tree "${final_tree}" -p "${terminal_parent_sha}")"
          [[ "$(git rev-parse "${final_sha}^")" == "${terminal_parent_sha}" && "$(git rev-parse "${final_sha}^{tree}")" == "${final_tree}" ]] || { echo "terminal commit identity mismatch" >&2; exit 1; }
          git update-ref "refs/heads/${EXIT_REFRESH_FACILITY_BRANCH}" "${final_sha}" "${EXIT_REFRESH_FACILITY_HEAD_SHA}"
          [[ "$(git rev-parse HEAD)" == "${final_sha}" ]] || { echo "terminal local head update mismatch" >&2; exit 1; }
          gh auth setup-git
          git push origin "${EXIT_REFRESH_FACILITY_BRANCH}"
          [[ "$(git ls-remote --heads origin "refs/heads/${EXIT_REFRESH_FACILITY_BRANCH}" | cut -f1)" == "${final_sha}" ]] || { echo "terminal remote head mismatch" >&2; exit 1; }

      - name: Retire completed durable claim
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${EXIT_REFRESH_BRANCH}" =~ ^automation/6-kric-exit-full-capital-refresh-[0-9]+$ ]] || { echo "EXIT claim branch is invalid" >&2; exit 1; }
          [[ "${EXIT_REFRESH_CLAIM_SHA}" =~ ^[a-f0-9]{40}$ ]] || { echo "EXIT claim SHA is invalid" >&2; exit 1; }
          remote_claim="$(git ls-remote --heads origin "refs/heads/${EXIT_REFRESH_BRANCH}")"
          IFS=$'\t' read -r remote_claim_sha remote_claim_ref <<< "${remote_claim}"
          [[ "${remote_claim_sha}" == "${EXIT_REFRESH_CLAIM_SHA}" ]] || { echo "EXIT claim SHA changed" >&2; exit 1; }
          [[ "${remote_claim_ref}" == "refs/heads/${EXIT_REFRESH_BRANCH}" ]] || { echo "EXIT claim ref changed" >&2; exit 1; }
          gh auth setup-git
          git push origin --delete "${EXIT_REFRESH_BRANCH}"

      - name: Remove disposable terminal worktrees
        if: ${{ always() }}
        run: |
          set -euo pipefail
          for entry in "transfer-source:${EXIT_REFRESH_FACILITY_HEAD_SHA}" "source-main:${EXIT_REFRESH_MAIN_SHA}" "private-builder:${EXIT_REFRESH_BUILDER_SHA}"; do
            directory="${EXIT_REFRESH_OPERATION_ROOT}/${entry%%:*}"
            expected="${entry#*:}"
            if [[ -e "${directory}" ]]; then
              [[ "$(git -C "${directory}" rev-parse HEAD)" == "${expected}" ]] || { echo "disposable terminal worktree identity mismatch" >&2; exit 1; }
              git worktree remove --force "${directory}"
              [[ ! -e "${directory}" ]] || { echo "disposable terminal worktree removal failed" >&2; exit 1; }
            fi
          done
          if [[ "${EXIT_REFRESH_RECOVERY_STATE:-}" == "INSPECTED_ANCESTOR_CLAIM" ]]; then
            directory="${EXIT_REFRESH_OPERATION_ROOT}/ancestor-retained"
            if [[ -e "${directory}" ]]; then
              [[ "$(git -C "${directory}" rev-parse HEAD)" == "${EXIT_REFRESH_ANCESTOR_FACILITY_HEAD_SHA}" ]] || { echo "ancestor retained worktree identity mismatch" >&2; exit 1; }
              git worktree remove --force "${directory}"
              [[ ! -e "${directory}" ]] || { echo "ancestor retained worktree removal failed" >&2; exit 1; }
            fi
          fi
