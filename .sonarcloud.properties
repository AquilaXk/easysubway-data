# SonarCloud 자동 분석 설정(자동 분석은 sonar-project.properties가 아니라 이 파일을 읽는다).
# tools/datapack/sources/** 는 외부 공식 원천(서울교통공사·대전·대구·광주 등)을 받은 그대로 보존한 스냅샷이다.
# 원문 바이트가 곧 증거(sha256로 결속)이므로 접근성·중복 속성·http 링크 같은 원문 코드 지적을 이유로 고칠 수 없다. 우리 코드가 아니므로 분석 대상에서 뺀다.
# tools/route-map/vendor/** 는 외부 라이브러리 배포본(harfbuzzjs)을 무수정으로 둔 사본이다. 바이트를 sha256으로 고정해 쓰므로 고칠 수 없다.
sonar.exclusions=tools/datapack/sources/**,tools/route-map/vendor/**
