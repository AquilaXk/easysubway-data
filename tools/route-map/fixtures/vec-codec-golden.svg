<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80">
  <defs>
    <pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#E9F1F6" stroke-width="0.5"/>
    </pattern>
    <clipPath id="card"><rect x="4" y="4" width="112" height="72" rx="6"/></clipPath>
  </defs>
  <rect width="120" height="80" fill="url(#grid)" opacity="0.5"/>
  <g clip-path="url(#card)">
    <path d="M 10 10 C 20 0 40 20 50 10 Z" fill="#14293D" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 60 40 L 110 40" stroke="#F68712" stroke-width="6" stroke-linecap="square"/>
    <circle cx="30" cy="55" r="12" fill="#ED6C00" fill-opacity="0.5"/>
  </g>
</svg>
